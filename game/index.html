<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azura Heat — Port Azura</title>
<style>
  html, body { margin:0; padding:0; background:#0b0e12; height:100%; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family: Arial, Helvetica, sans-serif; }
  canvas { background:#10151b; box-shadow:0 0 60px rgba(0,0,0,.8); max-width:100vw; max-height:100vh; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
/* ============================================================
   AZURA HEAT — an original 2D top-down open-world crime game.
   One file, vanilla JS + Canvas 2D, no network, no assets.
   The city of Port Azura: 6x5 districts, a beach, the sea,
   traffic, pedestrians, police, and three cash jobs.
   ============================================================ */

// ---------- deterministic RNG (mulberry32) ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32(1);
function rnd(a,b){return a+rng()*(b-a);}
function rndi(a,b){return Math.floor(rnd(a,b+1));}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;return Math.sqrt(dx*dx+dy*dy);}
function angWrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function angLerp(a,b,t){return a+angWrap(b-a)*t;}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^h>>>13,1274126177);return ((h^h>>>16)>>>0)/4294967296;}

// ---------- canvas ----------
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const VIEW_W=1280, VIEW_H=720;

// ---------- world constants ----------
const TILE=64, PITCH=5, COLS=6, ROWS=5;              // district pitch = 4 building tiles + 1 road tile
const CITY_W=(COLS*PITCH+1)*TILE;                    // 1984
const CITY_H=(ROWS*PITCH+1)*TILE;                    // 1664
const BEACH_X=CITY_W;                                // sand starts here
const WATER_X=CITY_W+128;                            // 2112, sea starts here
const WORLD_W=2368, WORLD_H=CITY_H;
const ROAD_TX=[0,5,10,15,20,25,30], ROAD_TY=[0,5,10,15,20,25];
const PIERS=[{x:2016,y:672,w:256,h:44},{x:2016,y:1056,w:256,h:44}];
const DOCKS_POS={x:2246,y:694};
const CAFE_POS={x:832,y:946};
const POLICE_RESPAWN={x:192,y:352};
const HOSP_RESPAWN={x:192,y:1312};
const PARK_POS={x:1792,y:192};
const STEP=1/60;

// ---------- input ----------
const keys={};
let shotMode=null;
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;
  initAudio();
  if(e.code==='KeyM'){muted=!muted;}
  if(state==='play'&&e.code==='KeyP'){state='pause';}
  else if(state==='pause'&&e.code==='KeyP'){state='play';}
  if((state==='title'||state==='busted'||state==='downed')&&(e.code==='Enter'||e.code==='Space'))confirmScreen();
  if(state==='play'&&e.code==='KeyE')interactCar();
  if(state==='play'&&e.code==='KeyF')interactContact();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousedown',()=>{initAudio();if(state==='title'||state==='busted'||state==='downed')confirmScreen();});
function keyDown(...codes){return codes.some(c=>keys[c]);}

// ---------- tiny audio (WebAudio bleeps, M mutes) ----------
let AC=null, muted=false;
function initAudio(){ if(shotMode) return; if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(freq,dur,type,vol,delay){
  if(!AC||muted)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.05,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function sfx(name){
  if(!AC||muted)return;
  if(name==='cash'){beep(880,0.09,'square',0.05);beep(1320,0.14,'square',0.05,0.08);}
  else if(name==='blip'){beep(520,0.06,'square',0.04);}
  else if(name==='pickup'){beep(660,0.07,'square',0.05);beep(990,0.1,'square',0.05,0.06);}
  else if(name==='crash'){beep(90,0.18,'sawtooth',0.09);}
  else if(name==='door'){beep(300,0.05,'square',0.04);beep(210,0.07,'square',0.04,0.05);}
  else if(name==='busted'){beep(392,0.16,'square',0.06);beep(311,0.16,'square',0.06,0.15);beep(233,0.3,'square',0.06,0.3);}
  else if(name==='downed'){beep(220,0.25,'sawtooth',0.06);beep(147,0.4,'sawtooth',0.06,0.22);}
  else if(name==='fail'){beep(330,0.15,'square',0.05);beep(262,0.25,'square',0.05,0.14);}
}
let sirenT=0, sirenHi=false;
function updateSiren(dt){
  if(!AC||muted)return;
  const near=cars.some(c=>c.type==='police'&&dist(c.x,c.y,player.x,player.y)<520);
  if(!near||wantedStars()===0)return;
  sirenT-=dt;
  if(sirenT<=0){sirenT=0.38;sirenHi=!sirenHi;beep(sirenHi?880:659,0.3,'triangle',0.022);}
}

// ---------- world generation ----------
let buildings=[], trees=[], palms=[];
const BUILDING_COLORS=['#8a4b3a','#a05a41','#6e7f8d','#7d6a53','#946b54','#5d6e7e','#a3764f','#7a4a56','#686f78','#8c7a5c'];
const ROOF_COLORS=['#5b4238','#6d4a3a','#4c5a64','#57493a','#64483a','#46545f','#6e563e','#573c46','#4c5157','#5f5140'];
function blockRect(bx,by){return {x:(bx*PITCH+1)*TILE,y:(by*PITCH+1)*TILE,w:(PITCH-1)*TILE,h:(PITCH-1)*TILE};}
function isSpecial(bx,by,kind){
  if(kind==='police')return bx===0&&by===0;
  if(kind==='cafe')return bx===2&&by===2;
  if(kind==='hospital')return bx===0&&by===4;
  if(kind==='parking')return bx===5&&by===0;
  return false;
}
function buildWorld(seed){
  rng=mulberry32(seed);
  buildings=[];trees=[];palms=[];
  for(let by=0;by<ROWS;by++)for(let bx=0;bx<COLS;bx++){
    const r=blockRect(bx,by);
    if(isSpecial(bx,by,'parking'))continue;                       // open asphalt lot
    if(isSpecial(bx,by,'police')){addBuilding(r.x+22,r.y+22,r.w-44,r.h-44,'#3d4d6e','#2e3d59',30,'POLICE');continue;}
    if(isSpecial(bx,by,'hospital')){addBuilding(r.x+22,r.y+22,r.w-44,r.h-44,'#cfd4d8','#a9b2b8',26,'HOSPITAL');continue;}
    if(isSpecial(bx,by,'cafe')){addBuilding(r.x+30,r.y+18,r.w-60,r.h-70,'#7fb3c8','#5d8ea6',18,'CAFE');continue;}
    const roll=rng();
    if(roll<0.16){                                                 // park block
      for(let i=0;i<7;i++)trees.push({x:r.x+rnd(24,r.w-24),y:r.y+rnd(24,r.h-24),r:rnd(13,22)});
      continue;
    }
    if(roll<0.52){                                                 // one tower
      const inset=rnd(16,34);
      addBuilding(r.x+inset,r.y+inset,r.w-inset*2,r.h-inset*2,pick(BUILDING_COLORS),pick(ROOF_COLORS),rnd(20,44),'');
    }else{                                                         // four slabs
      const gap=14, iw=(r.w-gap)/2, ih=(r.h-gap)/2;
      for(let q=0;q<4;q++){
        const qx=r.x+(q%2)*(iw+gap), qy=r.y+Math.floor(q/2)*(ih+gap);
        addBuilding(qx+4,qy+4,iw-8,ih-8,pick(BUILDING_COLORS),pick(ROOF_COLORS),rnd(10,26),'');
      }
    }
  }
  for(let i=0;i<26;i++)palms.push({x:BEACH_X+rnd(14,110),y:rnd(30,WORLD_H-30),r:rnd(12,19)});
}
function addBuilding(x,y,w,h,color,roof,height,label){
  buildings.push({x,y,w,h,color,roof,height,label,seed:Math.floor(rnd(1,1e9))});
}
function pointInBuilding(x,y,pad){
  pad=pad||0;
  for(const b of buildings)if(x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad)return b;
  return null;
}
function onPier(x,y){return PIERS.some(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);}
function waterBlocked(x,y){return x>=WATER_X&&!onPier(x,y);}
function circleRectHit(cx,cy,r,b){
  const nx=clamp(cx,b.x,b.x+b.w), ny=clamp(cy,b.y,b.y+b.h);
  const dx=cx-nx, dy=cy-ny, d2=dx*dx+dy*dy;
  if(d2>r*r)return null;
  if(d2>0.0001){const d=Math.sqrt(d2);return {nx:dx/d,ny:dy/d,depth:r-d};}
  // centre inside the rect: push out along the smallest exit
  const left=cx-b.x, right=b.x+b.w-cx, top=cy-b.y, bot=b.y+b.h-cy;
  const m=Math.min(left,right,top,bot);
  if(m===left)return {nx:-1,ny:0,depth:left+r};
  if(m===right)return {nx:1,ny:0,depth:right+r};
  if(m===top)return {nx:0,ny:-1,depth:top+r};
  return {nx:0,ny:1,depth:bot+r};
}
// Push a circle out of buildings / water / world edge. Returns impact speed along the normal (0 if none).
function collideCircle(e,r){
  let impact=0;
  for(const b of buildings){
    const hit=circleRectHit(e.x,e.y,r,b);
    if(hit){
      const vn=(e.vx||0)*hit.nx+(e.vy||0)*hit.ny;
      if(vn<0)impact=Math.max(impact,-vn);
      e.x+=hit.nx*hit.depth; e.y+=hit.ny*hit.depth;
    }
  }
  if(waterBlocked(e.x,e.y)&&e.x>WATER_X-r){const vn=-(e.vx||0);if(vn>0)impact=Math.max(impact,vn);e.x=WATER_X-r;}
  e.x=clamp(e.x,r,WORLD_W-r); e.y=clamp(e.y,r,WORLD_H-r);
  return impact;
}

// ---------- game state ----------
let state='title';                 // title | play | pause | busted | downed
let simTime=0, cash=0, heat=0, lastCrimeT=-99, bust=0, shake=0;
let player=null, cars=[], peds=[], particles=[];
let mission=null, splash=null, banner=null;
let contactReadyAt={docks:0,cafe:0}, missionFlip={docks:0,cafe:0};
let cam={x:0,y:0};
const CAR_COLORS=['#c0392b','#2980b9','#27ae60','#f39c12','#8e44ad','#d35400','#16a085','#bdc3c7','#e67e22','#34495e'];
const PED_COLORS=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#fd79a8','#fdcb6e','#74b9ff'];

function wantedStars(){return heat<=0?0:Math.min(5,Math.ceil(heat/25));}
function addHeat(n){heat=clamp(heat+n,0,125);lastCrimeT=simTime;}

// ---------- entities ----------
function makeCar(x,y,angle,color,type){
  return {x,y,vx:0,vy:0,angle,speed:0,color:color||pick(CAR_COLORS),type:type||'civil',
    hp:100,driver:null,nodeTx:0,nodeTy:0,tgtTx:0,tgtTy:0,cruise:rnd(85,125),smokeT:0,missionCar:false,dead:false};
}
function nearestNode(x,y){
  let best=null,bd=1e18;
  for(const tx of ROAD_TX)for(const ty of ROAD_TY){
    const cx=tx*TILE+32, cy=ty*TILE+32, d=(cx-x)*(cx-x)+(cy-y)*(cy-y);
    if(d<bd){bd=d;best={tx,ty};}
  }
  return best;
}
function initWalker(car){
  const n=nearestNode(car.x,car.y);
  car.nodeTx=n.tx;car.nodeTy=n.ty;
  pickNextNode(car,true);
}
function pickNextNode(car,first){
  const opts=[];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx,dy] of dirs){
    const tx=car.nodeTx+dx*PITCH, ty=car.nodeTy+dy*PITCH;
    if(ROAD_TX.includes(tx)&&ROAD_TY.includes(ty)){
      if(!first&&tx===car.tgtTx&&ty===car.tgtTy&&car.nodeTx!==car.tgtTx) { /* allow */ }
      opts.push({tx,ty,dx,dy});
    }
  }
  // avoid immediate U-turn unless it is the only way
  const back=opts.filter(o=>!(o.tx===car.prevTx&&o.ty===car.prevTy));
  const chosen=pick(back.length?back:opts);
  car.prevTx=car.nodeTx;car.prevTy=car.nodeTy;
  car.tgtTx=chosen.tx;car.tgtTy=chosen.ty;
}
function laneTarget(car){
  const dx=Math.sign(car.tgtTx-car.nodeTx), dy=Math.sign(car.tgtTy-car.nodeTy);
  const LANE=13;
  const ox=dy!==0?(dy>0?-LANE:LANE):0;
  const oy=dx!==0?(dx>0?LANE:-LANE):0;
  return {x:car.tgtTx*TILE+32+ox, y:car.tgtTy*TILE+32+oy, dx, dy};
}
function spawnTraffic(n){
  for(let i=0;i<n;i++){
    const tx=pick(ROAD_TX), ty=pick(ROAD_TY);
    const c=makeCar(tx*TILE+32+rnd(-8,8),ty*TILE+32+rnd(-8,8),0,null,'civil');
    initWalker(c);cars.push(c);
  }
}
function spawnParked(){
  const spots=[[1710,110],[1792,110],[1874,110],[1710,270],[1874,270],[352,700],[672,1010],[1312,380],[1632,1010],[990,1330]];
  for(const [x,y] of spots){
    if(pointInBuilding(x,y,26))continue;
    const c=makeCar(x,y,Math.PI/2,null,'parked');c.driver='parked';cars.push(c);
  }
}
function spawnPeds(n){
  for(let i=0;i<n;i++){
    let x=0,y=0,tries=0;
    do{x=rnd(50,CITY_W-40);y=rnd(50,CITY_H-40);tries++;}while(pointInBuilding(x,y,14)&&tries<20);
    peds.push({x,y,vx:0,vy:0,angle:rnd(0,6.28),speed:0,color:pick(PED_COLORS),
      state:'walk',tx:x,ty:y,fleeT:0,downT:0,thinkT:rnd(0,2)});
  }
}
function resetWorld(seed,keepCash){
  buildWorld(seed);
  cars=[];peds=[];particles=[];
  player={x:352,y:352,vx:0,vy:0,angle:0,speed:0,hp:100,car:null,walkPhase:0};
  if(!keepCash)cash=0;
  heat=0;bust=0;lastCrimeT=-99;mission=null;splash=null;banner=null;
  contactReadyAt={docks:0,cafe:0};
  spawnTraffic(9);spawnParked();spawnPeds(14);
}
function spawnParticle(x,y,color,n,spread,life){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-spread,spread),vy:rnd(-spread,spread)-14,
    life:rnd(life*0.5,life),maxLife:life,color,size:rnd(2,5)});
}

// ---------- interaction ----------
function confirmScreen(){
  if(state==='title'){state='play';sfx('blip');}
  else if(state==='busted'){
    const fine=Math.min(cash,150);cash-=fine;
    exitToFoot(POLICE_RESPAWN.x,POLICE_RESPAWN.y);
    heat=0;bust=0;player.hp=Math.max(player.hp,60);state='play';
  }else if(state==='downed'){
    cash-=Math.min(cash,100);
    exitToFoot(HOSP_RESPAWN.x,HOSP_RESPAWN.y);
    heat=0;bust=0;player.hp=100;state='play';
  }
}
function exitToFoot(x,y){
  if(player.car){player.car.driver=null;player.car=null;}
  player.x=x;player.y=y;player.vx=0;player.vy=0;player.speed=0;
}
function nearestCar(maxD){
  let best=null,bd=maxD;
  for(const c of cars){if(c.dead)continue;const d=dist(c.x,c.y,player.x,player.y);if(d<bd){bd=d;best=c;}}
  return best;
}
function interactCar(){
  if(player.car){
    const c=player.car;
    if(Math.abs(c.speed)<70){
      const side=c.angle+Math.PI/2;
      player.x=c.x+Math.cos(side)*30;player.y=c.y+Math.sin(side)*30;
      if(pointInBuilding(player.x,player.y,12)){player.x=c.x-Math.cos(side)*30;player.y=c.y-Math.sin(side)*30;}
      c.driver=null;player.car=null;sfx('door');
    }
    return;
  }
  const c=nearestCar(52);
  if(c&&Math.abs(c.speed)<25){
    const wasParked=c.driver==='parked';
    c.driver='player';player.car=c;player.x=c.x;player.y=c.y;sfx('door');
    if(wasParked&&c.type==='civil')addHeat(12);                    // grand theft auto
    if(c.missionCar&&mission&&mission.id==='fish'&&mission.step===0){
      mission.step=1;mission.timer=100;mission.target={x:CAFE_POS.x,y:CAFE_POS.y-24,r:52};
      mission.text='Deliver the fish van to Café Azul';sfx('pickup');
    }
  }
}
const CONTACTS=[
  {id:'docks',name:'The Docks',x:DOCKS_POS.x,y:DOCKS_POS.y},
  {id:'cafe',name:'Café Azul',x:CAFE_POS.x,y:CAFE_POS.y},
];
function nearContact(){
  for(const c of CONTACTS)if(dist(c.x,c.y,player.x,player.y)<58)return c;
  return null;
}
function interactContact(){
  if(mission)return;
  const c=nearContact();
  if(!c||simTime<contactReadyAt[c.id])return;
  startMission(c.id);
}
function startMission(contactId){
  missionFlip[contactId]++;
  if(contactId==='docks'&&missionFlip.docks%2===1){
    // M1 "Fresh Fish": a teal van waits on the coast avenue
    const van=makeCar(1952,760,Math.PI/2,'#1abc9c','civil');
    van.missionCar=true;van.driver='parked';cars.push(van);
    mission={id:'fish',giver:'The Docks',name:'Fresh Fish',pay:250,step:0,timer:75,
      target:{x:1952,y:760,r:60},text:'Get in the teal fish van on the coast avenue'};
  }else if(contactId==='docks'){
    // M3 "Hot Cooler": grab the package off pier two, dump it at the parking lot — heat sticks
    mission={id:'cooler',giver:'The Docks',name:'Hot Cooler',pay:450,step:0,timer:130,
      target:{x:2246,y:1078,r:24},text:'Pick up the package at the end of pier two'};
  }else{
    // M2 "Café Run": three checkpoints across town
    const pts=[];
    const cand=[[352,352],[1632,352],[352,1312],[1632,1312],[992,672],[672,992],[1952,1600],[1312,672]];
    for(let i=0;i<3;i++){const p=cand.splice(rndi(0,cand.length-1),1)[0];pts.push({x:p[0],y:p[1],r:44});}
    mission={id:'run',giver:'Café Azul',name:'Café Run',pay:300,step:0,timer:110,points:pts,
      target:pts[0],text:'Hit the checkpoints around Port Azura (1 of 3)'};
  }
  sfx('blip');
}
function completeMission(){
  cash+=mission.pay;
  splash={t:3,pay:mission.pay,name:mission.name};
  contactReadyAt[mission.giver==='The Docks'?'docks':'cafe']=simTime+20;
  mission=null;sfx('cash');
}
function failMission(){
  banner={t:2.6,text:'MISSION FAILED',color:'#e74c3c'};
  contactReadyAt[mission.giver==='The Docks'?'docks':'cafe']=simTime+8;
  mission=null;sfx('fail');
}
function updateMission(dt){
  if(!mission)return;
  mission.timer-=dt;
  if(mission.timer<=0){failMission();return;}
  const t=mission.target;
  if(mission.id==='fish'&&mission.step===1){
    if(player.car&&player.car.missionCar&&dist(player.x,player.y,t.x,t.y)<t.r)completeMission();
  }else if(mission.id==='run'){
    if(dist(player.x,player.y,t.x,t.y)<t.r){
      mission.step++;sfx('pickup');
      if(mission.step>=3){completeMission();return;}
      mission.target=mission.points[mission.step];
      mission.text='Hit the checkpoints around Port Azura ('+(mission.step+1)+' of 3)';
    }
  }else if(mission.id==='cooler'){
    if(mission.step===0){
      if(!player.car&&dist(player.x,player.y,t.x,t.y)<t.r){
        mission.step=1;mission.target={x:PARK_POS.x,y:PARK_POS.y,r:56};
        mission.text='Dump the cooler at the north-east parking lot — the heat is on';
        addHeat(Math.max(0,55-heat));sfx('pickup');
      }
    }else{
      heat=Math.max(heat,50);                                     // the cooler keeps you hot
      if(dist(player.x,player.y,t.x,t.y)<t.r)completeMission();
    }
  }
}

// ---------- simulation ----------
function step(dt){
  simTime+=dt;
  if(splash){splash.t-=dt;if(splash.t<=0)splash=null;}
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  shake=Math.max(0,shake-dt*2.2);
  if(state==='play'){
    updatePlayer(dt);
    updateMission(dt);
    updateBusted(dt);
    // heat decay: slow while fresh, faster once you lie low
    const cool=simTime-lastCrimeT>4?2.4:0.35;
    if(!(mission&&mission.id==='cooler'&&mission.step===1))heat=Math.max(0,heat-cool*dt);
    if(player.hp<100&&wantedStars()===0)player.hp=Math.min(100,player.hp+2.2*dt);
  }
  updateTraffic(dt);
  updatePolice(dt);
  updatePeds(dt);
  updateParticles(dt);
  updateSiren(dt);
  // camera follows the player (or the car he sits in)
  const fx=player.car?player.car.x:player.x, fy=player.car?player.car.y:player.y;
  cam.x=clamp(fx-VIEW_W/2,0,Math.max(0,WORLD_W-VIEW_W));
  cam.y=clamp(fy-VIEW_H/2,0,Math.max(0,WORLD_H-VIEW_H));
}
function updatePlayer(dt){
  if(player.car){updatePlayerDriving(dt);return;}
  let mx=0,my=0;
  if(keyDown('KeyW','ArrowUp'))my-=1;
  if(keyDown('KeyS','ArrowDown'))my+=1;
  if(keyDown('KeyA','ArrowLeft'))mx-=1;
  if(keyDown('KeyD','ArrowRight'))mx+=1;
  const sprint=keyDown('ShiftLeft','ShiftRight')?1.45:1;
  const sp=172*sprint;
  if(mx||my){
    const l=Math.hypot(mx,my);mx/=l;my/=l;
    player.angle=Math.atan2(my,mx);
    player.walkPhase+=dt*11*sprint;
  }
  player.vx=mx*sp;player.vy=my*sp;
  player.x+=player.vx*dt;player.y+=player.vy*dt;
  player.speed=Math.hypot(player.vx,player.vy);
  collideCircle(player,11);
}
function updatePlayerDriving(dt){
  const c=player.car;
  const fwdX=Math.cos(c.angle), fwdY=Math.sin(c.angle);
  c.speed=c.vx*fwdX+c.vy*fwdY;
  const healthF=c.hp<=0?0.25:c.hp<35?0.6:1;
  if(keyDown('KeyW','ArrowUp'))c.speed+=290*healthF*dt;
  else if(keyDown('KeyS','ArrowDown'))c.speed-=c.speed>10?420*dt:150*dt;
  c.speed-=c.speed*0.55*dt;                                       // drag
  if(!keyDown('KeyW','ArrowUp','KeyS','ArrowDown'))c.speed-=c.speed*0.7*dt;
  c.speed=clamp(c.speed,-120,335*healthF+40);
  let steer=0;
  if(keyDown('KeyA','ArrowLeft'))steer-=1;
  if(keyDown('KeyD','ArrowRight'))steer+=1;
  if(steer&&Math.abs(c.speed)>4)c.angle+=steer*2.1*dt*clamp(Math.abs(c.speed)/130,0,1)*Math.sign(c.speed);
  const nx=Math.cos(c.angle), ny=Math.sin(c.angle);
  c.vx=nx*c.speed;c.vy=ny*c.speed;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  const imp=collideCarBody(c);
  if(imp>120){
    const dmg=(imp-110)*0.09;
    c.hp=Math.max(0,c.hp-dmg);
    player.hp=Math.max(0,player.hp-dmg*0.35);
    shake=Math.min(1,shake+imp/300);sfx('crash');
    spawnParticle(c.x,c.y,'#f5c542',5,60,0.4);
    addHeat(7);
    c.speed*=-0.22;c.vx=nx*c.speed;c.vy=ny*c.speed;
  }
  player.x=c.x;player.y=c.y;player.speed=Math.abs(c.speed);player.angle=c.angle;
  if(c.hp<45){c.smokeT-=dt;if(c.smokeT<=0){c.smokeT=0.09;spawnParticle(c.x,c.y,c.hp<20?'#333':'#999',1,16,0.8);}}
  if(c.hp<=0&&!c.dead){c.dead=true;banner={t:2.4,text:'RIDE WRECKED',color:'#e74c3c'};}
}
// Circle-pair body collision for a car; returns worst impact speed.
function collideCarBody(c){
  let impact=0;
  const fx=Math.cos(c.angle), fy=Math.sin(c.angle);
  for(const off of [0,14,-14]){
    const p={x:c.x+fx*off,y:c.y+fy*off,vx:c.vx,vy:c.vy};
    const before={x:p.x,y:p.y};
    const imp=collideCircle(p,off===0?19:15);
    if(imp>impact)impact=imp;
    c.x+=p.x-before.x;c.y+=p.y-before.y;
  }
  // car vs car
  for(const o of cars){
    if(o===c)continue;
    const d=dist(c.x,c.y,o.x,o.y);
    if(d<37&&d>0.01){
      const nx=(c.x-o.x)/d, ny=(c.y-o.y)/d, push=(37-d)/2;
      c.x+=nx*push;c.y+=ny*push;o.x-=nx*push;o.y-=ny*push;
      const rel=Math.abs((c.vx-o.vx)*nx+(c.vy-o.vy)*ny);
      if(rel>55){
        impact=Math.max(impact,rel);
        const dmg=(rel-50)*0.07;
        c.hp=Math.max(0,c.hp-dmg);o.hp=Math.max(0,o.hp-dmg);
        if(c.driver==='player'||o.driver==='player'){addHeat(8);shake=Math.min(1,shake+rel/280);sfx('crash');}
        c.vx+=nx*rel*0.4;c.vy+=ny*rel*0.4;o.vx-=nx*rel*0.4;o.vy-=ny*rel*0.4;
      }
    }
  }
  return impact;
}
function updateTraffic(dt){
  for(const c of cars){
    if(c.driver==='player'||c.driver==='parked'||c.type==='police'||c.dead)continue;
    driveWalker(c,dt);
  }
}
function driveWalker(c,dt){
  const t=laneTarget(c);
  const d=dist(c.x,c.y,t.x,t.y);
  if(d<14){carArriveNode(c);return;}
  const want=Math.atan2(t.y-c.y,t.x-c.x);
  c.angle=angLerp(c.angle,want,Math.min(1,dt*4));
  let sp=c.cruise;
  // brake for anything solid ahead
  for(const o of cars){
    if(o===c)continue;
    const dx=o.x-c.x, dy=o.y-c.y, dd=Math.hypot(dx,dy);
    if(dd<52&&(dx*Math.cos(c.angle)+dy*Math.sin(c.angle))>10){sp=0;break;}
  }
  if(!player.car){const dx=player.x-c.x,dy=player.y-c.y;
    if(Math.hypot(dx,dy)<44&&(dx*Math.cos(c.angle)+dy*Math.sin(c.angle))>6)sp=0;}
  c.speed=lerp(c.speed,sp,Math.min(1,dt*2.4));
  c.vx=Math.cos(c.angle)*c.speed;c.vy=Math.sin(c.angle)*c.speed;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  collideCarBody(c);
  if(c.hp<45){c.smokeT-=dt;if(c.smokeT<=0){c.smokeT=0.12;spawnParticle(c.x,c.y,'#999',1,14,0.7);}}
  if(c.hp<=0)c.dead=true;
}
function carArriveNode(c){
  c.nodeTx=c.tgtTx;c.nodeTy=c.tgtTy;
  c.x=clamp(c.x,20,WORLD_W-20);c.y=clamp(c.y,20,WORLD_H-20);
  pickNextNode(c,false);
}
function updatePolice(dt){
  const stars=wantedStars();
  const cops=cars.filter(c=>c.type==='police'&&!c.dead);
  // spawn up to `stars` cruisers near (but not on top of) the player
  if(state==='play'&&stars>0&&cops.length<stars){
    const a=rnd(0,Math.PI*2), px=player.x+Math.cos(a)*660, py=player.y+Math.sin(a)*660;
    const n=nearestNode(clamp(px,40,WORLD_W-40),clamp(py,40,WORLD_H-40));
    const c=makeCar(n.tx*TILE+32,n.ty*TILE+32,0,'#eef1f4','police');
    initWalker(c);cars.push(c);cops.push(c);
  }
  for(const c of cops){
    if(c.driver==='player')continue;
    if(stars===0){driveWalker(c,dt);if(dist(c.x,c.y,player.x,player.y)>760){c.dead=true;}}
    else{
      const want=Math.atan2(player.y-c.y,player.x-c.x);
      c.angle=angLerp(c.angle,want,Math.min(1,dt*2.7));
      const d=dist(c.x,c.y,player.x,player.y);
      const sp=d>44?clamp(d*1.5,130,232):0;
      c.speed=lerp(c.speed,sp,Math.min(1,dt*3));
      c.vx=Math.cos(c.angle)*c.speed;c.vy=Math.sin(c.angle)*c.speed;
      c.x+=c.vx*dt;c.y+=c.vy*dt;
      const imp=collideCarBody(c);
      if(imp>130){c.hp=Math.max(0,c.hp-(imp-120)*0.05);c.speed*=-0.2;}
      if(c.hp<=0)c.dead=true;
    }
  }
  for(let i=cars.length-1;i>=0;i--)if(cars[i].dead&&cars[i].type==='police')cars.splice(i,1);
}
function updateBusted(dt){
  const px=player.x, py=player.y;
  const mySpeed=player.car?Math.abs(player.car.speed):player.speed;
  let near=false;
  for(const c of cars)if(c.type==='police'&&!c.dead&&dist(c.x,c.y,px,py)<40)near=true;
  if(near&&mySpeed<32)bust=Math.min(1,bust+dt/1.5);
  else bust=Math.max(0,bust-dt*1.4);
  if(bust>=1){
    state='busted';sfx('busted');
    if(player.car){player.car.driver=null;player.car=null;}
  }
}
function updatePeds(dt){
  for(const p of peds){
    if(p.state==='down'){p.downT-=dt;if(p.downT<=0)p.state='walk';continue;}
    // threats: fast cars close by
    let threat=null;
    for(const c of cars){
      if(Math.abs(c.speed)>55&&dist(c.x,c.y,p.x,p.y)<92){threat=c;break;}
    }
    if(threat){p.state='flee';p.fleeT=1.1;p.tx=p.x+(p.x-threat.x)*2;p.ty=p.y+(p.y-threat.y)*2;}
    if(p.state==='flee'){
      p.fleeT-=dt;if(p.fleeT<=0)p.state='walk';
      movePed(p,dt,158,p.tx,p.ty);
    }else{
      p.thinkT-=dt;
      if(p.thinkT<=0||dist(p.x,p.y,p.tx,p.ty)<10){
        p.thinkT=rnd(1.5,4);
        let tries=0;
        do{p.tx=clamp(p.x+rnd(-260,260),30,CITY_W-30);p.ty=clamp(p.y+rnd(-260,260),30,CITY_H-30);tries++;}
        while(pointInBuilding(p.tx,p.ty,12)&&tries<8);
      }
      movePed(p,dt,56,p.tx,p.ty);
    }
    // run over?
    for(const c of cars){
      if(Math.abs(c.speed)>60&&dist(c.x,c.y,p.x,p.y)<21){
        p.state='down';p.downT=3.2;
        spawnParticle(p.x,p.y,'#e74c3c',6,70,0.5);
        if(c.driver==='player'){addHeat(38);player.hp=Math.max(0,player.hp-2);shake=Math.min(1,shake+0.4);sfx('crash');}
        break;
      }
    }
    // cars hurt the player on foot
    if(!player.car&&state==='play'){
      for(const c of cars){
        if(Math.abs(c.speed)>70&&dist(c.x,c.y,player.x,player.y)<23){
          player.hp=Math.max(0,player.hp-13);
          player.x+= (player.x-c.x)*1.4; player.y+=(player.y-c.y)*1.4;
          shake=Math.min(1,shake+0.5);sfx('crash');
          if(player.hp<=0){state='downed';sfx('downed');}
          break;
        }
      }
    }
  }
}
function movePed(p,dt,sp,tx,ty){
  const d=dist(p.x,p.y,tx,ty);
  if(d<4){p.speed=0;return;}
  const want=Math.atan2(ty-p.y,tx-p.x);
  p.angle=angLerp(p.angle,want,Math.min(1,dt*8));
  p.vx=Math.cos(p.angle)*sp;p.vy=Math.sin(p.angle)*sp;
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.speed=sp;
  collideCircle(p,10);
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=22*dt;p.vx*=0.98;
  }
}

// ---------- rendering ----------
function fmtCash(n){return '$'+String(Math.max(0,Math.floor(n))).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function panel(x,y,w,h){ctx.fillStyle='rgba(8,12,16,0.58)';rr(x,y,w,h,10);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;rr(x,y,w,h,10);ctx.stroke();}

function draw(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const shx=shake>0?Math.sin(simTime*79)*7*shake:0, shy=shake>0?Math.cos(simTime*67)*6*shake:0;
  const ox=cam.x+shx, oy=cam.y+shy;
  drawWorld(ox,oy);
  ctx.save();ctx.translate(-ox,-oy);
  for(const c of cars)drawCar(c);
  for(const p of peds)drawPed(p);
  if(!player.car)drawPlayer();
  drawParticles();
  drawMarkers();
  ctx.restore();
  drawHUD();
  if(state==='title')drawTitle();
  if(state==='pause')drawCenterScreen('PAUSED','Press P to resume', '#ffffff');
  if(state==='busted')drawBusted();
  if(state==='downed')drawCenterScreen('DOWNED','The city knocked you flat. Press ENTER — wake up at the hospital (-$100)','#e74c3c');
}
function drawWorld(ox,oy){
  // sea
  const wg=ctx.createLinearGradient(0,0,VIEW_W,0);
  wg.addColorStop(0,'#1b6a8a');wg.addColorStop(1,'#144e68');
  ctx.fillStyle=wg;ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.strokeStyle='rgba(255,255,255,0.20)';ctx.lineWidth=2;ctx.beginPath();
  for(let wy=-40;wy<WORLD_H+40;wy+=46){
    for(let wx=WATER_X;wx<=WORLD_W;wx+=26){
      const sx=wx-ox, sy=wy-oy+Math.sin(wx*0.02+simTime*1.4+wy*0.7)*3;
      if(wx===WATER_X)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    }
  }
  ctx.stroke();
  // sand
  ctx.fillStyle='#d9c08a';ctx.fillRect(BEACH_X-ox,0-ox,WATER_X-BEACH_X,VIEW_H);
  ctx.fillStyle='#c9ae76';ctx.fillRect(WATER_X-16-ox,0,16,VIEW_H);
  // city base (sidewalk)
  ctx.fillStyle='#565b61';ctx.fillRect(0-ox,0-oy,CITY_W,CITY_H);
  // block interiors
  for(let by=0;by<ROWS;by++)for(let bx=0;bx<COLS;bx++){
    const r=blockRect(bx,by);
    if(isSpecial(bx,by,'parking')){
      ctx.fillStyle='#33373c';ctx.fillRect(r.x-ox,r.y-oy,r.w,r.h);
      ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;
      for(let sx=r.x+22;sx<r.x+r.w-10;sx+=44){ctx.beginPath();ctx.moveTo(sx-ox,r.y+14-oy);ctx.lineTo(sx-ox,r.y+74-oy);ctx.stroke();}
    }else if(buildings.some(b=>b.label==='')&&false){/* noop */}
    else {
      const hasPark=!buildings.some(b=>b.x>=r.x-1&&b.x<r.x+r.w&&b.y>=r.y-1&&b.y<r.y+r.h);
      ctx.fillStyle=hasPark?'#3f7a3a':'#5d6167';
      ctx.fillRect(r.x-ox,r.y-oy,r.w,r.h);
    }
  }
  // roads
  ctx.fillStyle='#2e3236';
  for(const tx of ROAD_TX)ctx.fillRect(tx*TILE-ox,0-oy,TILE,CITY_H);
  for(const ty of ROAD_TY)ctx.fillRect(0-ox,ty*TILE-oy,CITY_W,TILE);
  ctx.strokeStyle='rgba(216,190,90,0.55)';ctx.lineWidth=3;ctx.setLineDash([20,24]);
  ctx.beginPath();
  for(const tx of ROAD_TX){ctx.moveTo(tx*TILE+32-ox,0-oy);ctx.lineTo(tx*TILE+32-ox,CITY_H-oy);}
  for(const ty of ROAD_TY){ctx.moveTo(0-ox,ty*TILE+32-oy);ctx.lineTo(CITY_W-ox,ty*TILE+32-oy);}
  ctx.stroke();ctx.setLineDash([]);
  // piers
  for(const p of PIERS){
    ctx.fillStyle='#8a6a42';ctx.fillRect(p.x-ox,p.y-oy,p.w,p.h);
    ctx.strokeStyle='rgba(60,40,18,0.5)';ctx.lineWidth=2;
    for(let px=p.x+16;px<p.x+p.w;px+=16){ctx.beginPath();ctx.moveTo(px-ox,p.y-oy);ctx.lineTo(px-ox,p.y+p.h-oy);ctx.stroke();}
  }
  // trees & palms
  for(const t of trees){
    ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.ellipse(t.x-ox+4,t.y-oy+6,t.r,t.r*0.7,0,0,7);ctx.fill();
    ctx.fillStyle='#2d5a27';ctx.beginPath();ctx.arc(t.x-ox,t.y-oy,t.r,0,7);ctx.fill();
    ctx.fillStyle='#3c7434';ctx.beginPath();ctx.arc(t.x-ox-4,t.y-oy-4,t.r*0.62,0,7);ctx.fill();
  }
  for(const t of palms){
    ctx.strokeStyle='#7a5c33';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(t.x-ox,t.y-oy);ctx.lineTo(t.x-ox+3,t.y-oy-10);ctx.stroke();
    ctx.strokeStyle='#3c7434';ctx.lineWidth=3;
    for(let a=0;a<6;a++){const ang=a*1.05+0.4;ctx.beginPath();ctx.moveTo(t.x-ox+3,t.y-oy-10);ctx.quadraticCurveTo(t.x-ox+3+Math.cos(ang)*t.r,t.y-oy-10+Math.sin(ang)*t.r*0.5-4,t.x-ox+3+Math.cos(ang)*t.r*1.5,t.y-oy-2+Math.sin(ang)*t.r*0.7);ctx.stroke();}
  }
  // buildings
  for(const b of buildings){
    const so=b.height*0.4;
    ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fillRect(b.x-ox+so,b.y-oy+so*1.2,b.w,b.h);
    ctx.fillStyle=b.color;ctx.fillRect(b.x-ox,b.y-oy,b.w,b.h);
    ctx.fillStyle=b.roof;ctx.fillRect(b.x-ox+5,b.y-oy+5,b.w-10,b.h-10);
    // facade windows along the south strip
    const cols=Math.max(2,Math.floor(b.w/26)), rowsW=Math.max(1,Math.floor(b.height/13));
    for(let i=0;i<cols;i++)for(let j=0;j<rowsW;j++){
      const lit=hash2(b.seed+i*7,j*13)>0.42;
      ctx.fillStyle=lit?'rgba(255,214,120,0.85)':'rgba(20,26,32,0.55)';
      ctx.fillRect(b.x-ox+9+i*(b.w-18)/cols,b.y-oy+b.h-9-(j+1)*9,9,5);
    }
    if(b.label){
      ctx.fillStyle='rgba(255,255,255,0.92)';ctx.font='bold 17px Arial';ctx.textAlign='center';
      ctx.fillText(b.label,b.x-ox+b.w/2,b.y-oy+b.h/2+6);
      if(b.label==='HOSPITAL'){ctx.fillStyle='#d43a2f';ctx.fillRect(b.x-ox+b.w/2-4,b.y-oy+16,8,22);ctx.fillRect(b.x-ox+b.w/2-11,b.y-oy+23,22,8);}
      if(b.label==='CAFE'){ctx.fillStyle='#e2574c';ctx.fillRect(b.x-ox+8,b.y-oy+b.h-24,b.w-16,12);}
    }
  }
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
  ctx.fillStyle='rgba(0,0,0,0.30)';ctx.beginPath();ctx.ellipse(3,5,25,13,0,0,7);ctx.fill();

  if(c.type==='police'){
    ctx.fillStyle='#2470c2';ctx.fillRect(-23,-3,46,6);
    const ph=Math.floor(simTime*2.6)%2===0;

  }
  if(c.missionCar){ctx.fillStyle='#dff9f4';ctx.fillRect(-21,-8,15,16);ctx.fillStyle='#1abc9c';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText('FISH',-13,3);}
  ctx.fillStyle='rgba(16,24,32,0.92)';rr(-7,-9,19,18,4);ctx.fill();
  ctx.fillStyle='rgba(150,200,230,0.75)';ctx.fillRect(9,-8,4,16);
  ctx.fillStyle='rgba(255,240,180,0.95)';ctx.beginPath();ctx.arc(23,-6,2.4,0,7);ctx.arc(23,6,2.4,0,7);ctx.fill();
  if(c.dead){ctx.fillStyle='rgba(30,30,30,0.35)';rr(-23,-11,46,22,6);ctx.fill();}

}
function drawPed(p){
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.beginPath();ctx.ellipse(1,3,9,5,0,0,7);ctx.fill();
  if(p.state==='down'){ctx.rotate(Math.PI/2);}
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();
  ctx.fillStyle='#e8b08a';ctx.beginPath();ctx.arc(0,0,4.2,0,7);ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  const p=player;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(1,3,10,5.5,0,0,7);ctx.fill();
  const moving=p.speed>8, ph=moving?Math.sin(p.walkPhase)*4:0;
  ctx.fillStyle='#2b2f36';
  ctx.fillRect(-5+ph*0.4,-7,4,6);ctx.fillRect(-5-ph*0.4,1,4,6);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.stroke();
  ctx.fillStyle='#e8b08a';ctx.beginPath();ctx.arc(0,0,4.6,0,7);ctx.fill();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=2.6;ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(Math.cos(p.angle)*11,Math.sin(p.angle)*11);ctx.stroke();
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1)*0.8;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawMarkers(){
  const pulse=1+Math.sin(simTime*4)*0.12;
  if(!mission){
    for(const c of CONTACTS){
      if(simTime<contactReadyAt[c.id])continue;
      ctx.strokeStyle='#2ecc71';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(c.x,c.y,20*pulse,0,7);ctx.stroke();
      ctx.fillStyle='#27ae60';ctx.beginPath();ctx.arc(c.x,c.y,14,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.fillText('$',c.x,c.y+6);
    }
  }
  if(mission){
    const t=mission.target;
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*0.55*pulse,0,7);ctx.stroke();
    ctx.fillStyle='#ffd23f';ctx.font='bold 22px Arial';ctx.textAlign='center';
    ctx.fillText('▼',t.x,t.y-26*pulse+Math.sin(simTime*5)*3);
  }
}
function drawHUD(){
  // cash
  panel(16,16,196,58);
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.font='bold 11px Arial';ctx.textAlign='left';ctx.fillText('CASH',30,36);
  ctx.fillStyle='#2ecc71';ctx.font='bold 27px Arial';ctx.fillText(fmtCash(cash),30,66);
  if(muted){ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px Arial';ctx.fillText('MUTED — M to unmute',30,90);}
  // wanted stars
  const stars=wantedStars();
  panel(VIEW_W-232,16,216,58);
  for(let i=0;i<5;i++){
    ctx.font='30px Arial';ctx.textAlign='center';
    ctx.fillStyle=i<stars?'#ffd23f':'rgba(255,255,255,0.22)';
    ctx.fillText('★',VIEW_W-196+i*40,56);
  }
  if(heat>0){
    ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(VIEW_W-216,82,184,5);
    ctx.fillStyle='#e74c3c';ctx.fillRect(VIEW_W-216,82,184*clamp(heat/125,0,1),5);
  }
  // health (+ ride)
  panel(16,VIEW_H-64,236,48);
  ctx.fillStyle='rgba(255,255,255,0.65)';ctx.font='bold 10px Arial';ctx.textAlign='left';ctx.fillText('HEALTH',28,VIEW_H-44);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(82,VIEW_H-52,158,10);
  ctx.fillStyle=player.hp>35?'#2ecc71':'#e74c3c';ctx.fillRect(82,VIEW_H-52,158*clamp(player.hp/100,0,1),10);
  if(player.car){
    ctx.fillStyle='rgba(255,255,255,0.65)';ctx.fillText('RIDE',28,VIEW_H-26);
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(82,VIEW_H-34,158,10);
    ctx.fillStyle=player.car.hp>35?'#3498db':'#e74c3c';ctx.fillRect(82,VIEW_H-34,158*clamp(player.car.hp/100,0,1),10);
    ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';
    ctx.fillText(String(Math.round(Math.abs(player.car.speed)*0.32)),VIEW_W/2,VIEW_H-24);
    ctx.font='11px Arial';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText('km/h',VIEW_W/2+52,VIEW_H-24);
  }
  // objective banner
  if(mission){
    panel(VIEW_W/2-290,16,580,64);
    ctx.textAlign='center';
    ctx.fillStyle='#ffd23f';ctx.font='bold 14px Arial';
    ctx.fillText(mission.name.toUpperCase()+' — '+mission.giver.toUpperCase()+' — '+fmtCash(mission.pay),VIEW_W/2,38);
    ctx.fillStyle='#fff';ctx.font='14px Arial';
    ctx.fillText(mission.text,VIEW_W/2,58);
    ctx.fillStyle=mission.timer<15?'#e74c3c':'#ffd23f';ctx.font='bold 14px Arial';ctx.textAlign='right';
    ctx.fillText(Math.ceil(mission.timer)+'s',VIEW_W/2+272,38);
  }
  // context prompt
  ctx.textAlign='center';ctx.font='bold 15px Arial';
  let prompt='';
  if(state==='play'){
    if(player.car&&Math.abs(player.car.speed)<70)prompt='[E] Exit vehicle';
    else if(!player.car&&nearestCar(52))prompt='[E] Enter vehicle';
    else if(!player.car&&!mission){const c=nearContact();if(c&&simTime>=contactReadyAt[c.id])prompt='[F] New job from '+c.name;}
  }
  if(prompt){panel(VIEW_W/2-150,VIEW_H-108,300,34);ctx.fillStyle='#fff';ctx.fillText(prompt,VIEW_W/2,VIEW_H-86);}
  // bust meter
  if(bust>0.02&&state==='play'){
    panel(VIEW_W/2-130,110,260,30);
    ctx.fillStyle='#e74c3c';rr(VIEW_W/2-120,120,240*bust,10,5);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.fillText('BUSTED',VIEW_W/2,106);
  }
  if(banner){
    ctx.globalAlpha=clamp(banner.t,0,1);
    ctx.fillStyle=banner.color;ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText(banner.text,VIEW_W/2,VIEW_H/2-90);
    ctx.globalAlpha=1;
  }
  if(splash){
    ctx.globalAlpha=clamp(splash.t/1.2,0,1);
    panel(VIEW_W/2-240,VIEW_H/2-118,480,96);
    ctx.fillStyle='#ffd23f';ctx.font='bold 34px Arial';ctx.textAlign='center';
    ctx.fillText('MISSION COMPLETE',VIEW_W/2,VIEW_H/2-76);
    ctx.fillStyle='#2ecc71';ctx.font='bold 24px Arial';
    ctx.fillText(splash.name+'  +'+fmtCash(splash.pay),VIEW_W/2,VIEW_H/2-42);
    ctx.globalAlpha=1;
  }
  drawMinimap();
}
function drawMinimap(){
  const mw=190, mh=142, mx=VIEW_W-mw-16, my=VIEW_H-mh-16;
  panel(mx-6,my-6,mw+12,mh+12);
  const sx=mw/WORLD_W, sy=mh/WORLD_H;
  ctx.fillStyle='#1b6a8a';ctx.fillRect(mx+WATER_X*sx,my,mw-WATER_X*sx,mh);
  ctx.fillStyle='#d9c08a';ctx.fillRect(mx+BEACH_X*sx,my,(WATER_X-BEACH_X)*sx,mh);
  ctx.fillStyle='#3a3f45';ctx.fillRect(mx,my,CITY_W*sx,CITY_H*sy);
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.beginPath();
  for(const tx of ROAD_TX){ctx.moveTo(mx+(tx*TILE+32)*sx,my);ctx.lineTo(mx+(tx*TILE+32)*sx,my+CITY_H*sy);}
  for(const ty of ROAD_TY){ctx.moveTo(mx,my+(ty*TILE+32)*sy);ctx.lineTo(mx+CITY_W*sx,my+(ty*TILE+32)*sy);}
  ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.4)';
  for(const b of buildings)ctx.fillRect(mx+b.x*sx,my+b.y*sy,Math.max(2,b.w*sx),Math.max(2,b.h*sy));
  for(const c of CONTACTS){ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.arc(mx+c.x*sx,my+c.y*sy,3.4,0,7);ctx.fill();}
  if(mission){const t=mission.target;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(mx+t.x*sx,my+t.y*sy,4.4,0,7);ctx.fill();
    ctx.strokeStyle='#ffd23f';ctx.beginPath();ctx.arc(mx+t.x*sx,my+t.y*sy,7+Math.sin(simTime*4)*1.6,0,7);ctx.stroke();}
  for(const c of cars){
    if(c.type==='police'){ctx.fillStyle=Math.floor(simTime*2.6)%2?'#ff3b30':'#3a7bff';}
    else if(c.driver==='player'){continue;}
    else ctx.fillStyle='rgba(230,230,230,0.75)';
    ctx.fillRect(mx+c.x*sx-1.6,my+c.y*sy-1.6,3.2,3.2);
  }
  const px=player.car?player.car.x:player.x, py=player.car?player.car.y:player.y;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx+px*sx,my+py*sy,4,0,7);ctx.fill();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(mx+px*sx,my+py*sy,6.4,0,7);ctx.stroke();
}
function drawCenterScreen(title,sub,color){
  ctx.fillStyle='rgba(5,8,12,0.66)';ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.fillStyle=color;ctx.font='bold 64px Arial';ctx.textAlign='center';
  ctx.fillText(title,VIEW_W/2,VIEW_H/2-10);
  ctx.fillStyle='#fff';ctx.font='17px Arial';ctx.fillText(sub,VIEW_W/2,VIEW_H/2+30);
}
function drawBusted(){
  const ph=Math.floor(simTime*3)%2===0;
  ctx.fillStyle=ph?'rgba(255,59,48,0.20)':'rgba(58,123,255,0.20)';ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.fillStyle='rgba(5,8,12,0.55)';ctx.fillRect(0,VIEW_H/2-110,VIEW_W,220);
  ctx.fillStyle='#fff';ctx.font='bold 68px Arial';ctx.textAlign='center';
  ctx.fillText('BUSTED',VIEW_W/2,VIEW_H/2-16);
  ctx.font='17px Arial';
  ctx.fillText('The Port Azura PD finally cornered you. Press ENTER — pay a $150 fine and walk from the station.',VIEW_W/2,VIEW_H/2+28);
}
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,VIEW_H);
  g.addColorStop(0,'rgba(6,10,16,0.30)');g.addColorStop(0.55,'rgba(6,10,16,0.45)');g.addColorStop(1,'rgba(6,10,16,0.90)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.textAlign='center';
  ctx.font='bold 96px Arial';
  ctx.fillStyle='#ffffff';ctx.fillText('AZURA',VIEW_W/2,VIEW_H/2-96);
  ctx.fillStyle='#ffcf3f';ctx.fillText('HEAT',VIEW_W/2,VIEW_H/2-6);
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='19px Arial';
  ctx.fillText('Port Azura never sleeps. Neither do its cops.',VIEW_W/2,VIEW_H/2+30);
  ctx.font='15px Arial';ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('WASD / Arrows — move & drive      E — enter / exit car      F — take a job from a $ contact',VIEW_W/2,VIEW_H/2+78);
  ctx.fillText('P — pause      M — mute      Run jobs for The Docks and Café Azul. Outrun the stars.',VIEW_W/2,VIEW_H/2+102);
  if(Math.floor(simTime*1.6)%2===0){
    ctx.fillStyle='#2ecc71';ctx.font='bold 22px Arial';
    ctx.fillText('PRESS ENTER OR CLICK TO PLAY',VIEW_W/2,VIEW_H/2+152);
  }
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='12px Arial';
  ctx.fillText('An original game set in the fictional city of Port Azura.',VIEW_W/2,VIEW_H-18);
}

// ---------- main loop ----------
let lastTs=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastTs)lastTs=ts;
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  while(acc>=STEP){
    if(state!=='pause')step(STEP);
    acc-=STEP;
  }
  if(state==='play'&&player.hp<=0){state='downed';sfx('downed');}
  draw();
}

// ---------- deterministic screenshot mode ----------
// ?shot=start|play|end&seed=N renders one fixed scene: seeded world, fixed 1/60 steps, single draw.
function autopilotDrive(target){
  const c=player.car;if(!c)return;
  const want=Math.atan2(target.y-c.y,target.x-c.x);
  const diff=angWrap(want-c.angle);
  keys.KeyW=true;keys.KeyA=diff<-0.08;keys.KeyD=diff>0.08;
}
function clearKeys(){for(const k in keys)keys[k]=false;}
function setupShot(mode,seed){
  shotMode=mode;
  resetWorld(seed,false);
  if(mode==='start'){
    state='title';
    player.x=2064;player.y=700;                       // standing on the sand by pier one
    for(let i=0;i<90;i++)step(STEP);
  }else if(mode==='play'){
    state='play';cash=640;
    startMission('docks');                            // Fresh Fish, step 0
    const van=cars.find(c=>c.missionCar);
    van.x=1400;van.y=992;van.angle=Math.PI;van.driver='player';player.car=van;
    mission.step=1;mission.timer=84;
    mission.target={x:CAFE_POS.x,y:CAFE_POS.y-24,r:52};
    mission.text='Deliver the fish van to Café Azul';
    heat=55;
    const driveTarget={x:300,y:992};                  // chase west along the avenue; the delivery stays in progress
    for(let i=0;i<240;i++){autopilotDrive(driveTarget);step(STEP);}
    clearKeys();
    if(state!=='play')state='play';                   // the scene is a live chase, whatever happened
  }else if(mode==='end'){
    state='play';cash=1530;heat=20;
    player.x=CAFE_POS.x;player.y=990;player.angle=-Math.PI/2;
    const cop=makeCar(352,1312,0,'#eef1f4','police');initWalker(cop);cars.push(cop);   // patrols far off — flavour, no bust risk
    for(let i=0;i<150;i++)step(STEP);
    splash={t:3,pay:300,name:'Café Run'};             // frozen on the victory splash
  }
  draw();
  window.__shotReady=true;
}

// ---------- boot ----------
const params=new URLSearchParams(location.search);
if(params.get('shot')){
  setupShot(params.get('shot'),parseInt(params.get('seed')||'1',10)||1);
}else{
  resetWorld((Date.now()%900000)+1,false);
  state='title';
  requestAnimationFrame(frame);
}
</script>
