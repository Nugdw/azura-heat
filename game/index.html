<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azura Heat — Port Azura</title>
<style>
  html, body { margin: 0; padding: 0; background: #07090d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; display: block;
           background: #0d1420; box-shadow: 0 0 60px rgba(0,0,0,.8); }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
/* =====================================================================
   AZURA HEAT — an original top-down open-world crime game set in the
   fictional coastal city of Port Azura. Vanilla JS + Canvas 2D.
   No network requests, no external assets, everything lives in this
   file. Simulation runs on a fixed 1/60 timestep; every random draw
   comes from one mulberry32 stream, so a seeded scene is reproducible
   byte for byte (see the ?shot= mode at the bottom).
   ===================================================================== */

// ---------- tiny utilities ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };
function angWrap(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function angLerp(a, b, t) { return a + angWrap(b - a) * t; }

// ---------- canvas ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VW = 1280, VH = 720;
const STEP = 1 / 60;

// ---------- world layout ----------
// Port Azura: a 6 x 5 grid of city blocks wrapped by roads, a sandy
// beach along the south edge and the sea beyond it.
const ROAD = 88, BLOCK = 240, PITCH = ROAD + BLOCK;      // 328
const COLS = 6, ROWS = 5;
const CITY_W = COLS * BLOCK + (COLS + 1) * ROAD;          // 2056
const CITY_H = ROWS * BLOCK + (ROWS + 1) * ROAD;          // 1728
const SAND = 170, SEA = 250;
const WORLD_W = CITY_W;                                    // 2056
const WORLD_H = CITY_H + SAND + SEA;                       // 2148
const VX = [], HY = [];                                    // road centre lines
for (let i = 0; i <= COLS; i++) VX.push(ROAD / 2 + i * PITCH);
for (let j = 0; j <= ROWS; j++) HY.push(ROAD / 2 + j * PITCH);
const PIER = { x: 124, y: CITY_H + 108, w: 72, h: SEA + 58 };  // wooden pier into the sea

// ---------- contacts & missions ----------
const CONTACTS = {
  docks: { x: 168, y: CITY_H + 66, name: 'THE DOCKS', who: 'Marlo the fixer' },
  cafe:  { x: VX[4], y: HY[2] + 70, name: 'CAFÉ AZUL', who: 'Inés the barista' },
};
const MISSIONS = [
  { id: 'cargo', contact: 'docks', name: 'Harbor Cargo', pay: 300, time: 150,
    blurb: 'A crate is waiting at the end of the pier. Take it to the depot up north.',
    stages: [
      { x: 160, y: CITY_H + SAND + 132, label: 'Pick up the crate at the pier' },
      { x: VX[6], y: HY[1], label: 'Deliver the crate to the north depot' },
    ] },
  { id: 'rush', contact: 'cafe', name: 'Azul Coffee Rush', pay: 250, time: 120,
    blurb: 'Three cafés across town need beans before the rush. Hit every stop.',
    stages: [
      { x: VX[1], y: HY[3], label: 'Coffee stop 1 of 3 — south-west' },
      { x: VX[3], y: HY[1], label: 'Coffee stop 2 of 3 — mid-town' },
      { x: VX[5], y: HY[4], label: 'Coffee stop 3 of 3 — south-east' },
    ] },
  { id: 'joyride', contact: 'docks', name: 'The Convertible Job', pay: 400, time: 180, carJob: true,
    blurb: 'A red convertible is parked mid-town. Bring it to the docks garage. Intact-ish.',
    stages: [
      { car: true, label: 'Steal the red convertible' },
      { x: 318, y: CITY_H + 74, label: 'Bring the convertible to the docks garage' },
    ] },
];
const RESPAWN = {
  police: { x: VX[0], y: 210 },
  hospital: { x: VX[6], y: HY[4] + 40 },
};

// ---------- palettes ----------
const ROOF_COLORS = ['#b5543c', '#c96f4a', '#8f5f9e', '#4a7fb5', '#53a08a', '#c2a15c', '#7a6a5f', '#a34d68', '#5d8a4a', '#946846'];
const CAR_COLORS = ['#d64541', '#3f6fd8', '#e8b93c', '#39b56a', '#e6e6e6', '#2b2f36', '#8e44ad', '#e67e22', '#1abc9c', '#c0c6cc'];
const PED_COLORS = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#e67e22', '#ecf0f1', '#fd79a8', '#81ecec'];

// ---------- game state ----------
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot');                       // null | 'start' | 'play' | 'end'
const SEED = (() => { const n = parseInt(Q.get('seed') || '1', 10); return Number.isFinite(n) ? n : 1; })();
const SHOTMODE = SHOT === 'start' || SHOT === 'play' || SHOT === 'end';
let rng = mulberry32(SHOTMODE ? SEED : (Date.now() % 1000003) + 11);

const S = {
  mode: 'title',            // title | playing | paused | busted | downed | complete
  steps: 0,
  cash: 20,
  heat: 0,                  // 0..599, stars = floor(heat/120)
  lastCrime: -9999,
  bust: 0,                  // 0..1 bust meter
  notice: '', noticeT: 0,
  mission: null,            // { def, stage, tLeft }
  doneMissions: {},
  completeInfo: null,
  muted: false,
  camX: 0, camY: 0,
  shake: 0,
};
const stars = () => Math.min(5, Math.floor(S.heat / 120));

const player = { x: VX[1], y: HY[4], a: -Math.PI / 2, hp: 100, car: null, lastHurt: -9999, walk: 0 };
let buildings = [];   // {x,y,w,h,color, floors}
let parks = [];       // {x,y,w,h, trees:[{x,y,r}]}
let lots = [];        // {x,y,w,h}
let sandDots = [], seaLines = [];
let civCars = [];     // {x,y,a,v,hp,color,mode:'parked'|'traffic'|'player'|'wreck', ni,nj,ti,tj,speed, hitCd}
let cops = [];        // {x,y,a,v,hp}
let peds = [];        // {x,y,a,speed,color, tx,ty, flee}
let jobCar = null;

// ---------- world generation (all draws from the seeded rng) ----------
function buildWorld() {
  buildings = []; parks = []; lots = []; civCars = []; cops = []; peds = []; jobCar = null;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const bx = ROAD + c * PITCH, by = ROAD + r * PITCH;
      let kind = 'building';
      const roll = rng();
      if (roll > 0.84) kind = 'park'; else if (roll > 0.68) kind = 'lot';
      if (c === 2 && r === 3) kind = 'lot';                    // the convertible waits here
      if (kind === 'building') {
        const inset = 16 + Math.floor(rng() * 10);
        buildings.push({
          x: bx + inset, y: by + inset, w: BLOCK - inset * 2, h: BLOCK - inset * 2,
          color: ROOF_COLORS[Math.floor(rng() * ROOF_COLORS.length)],
          floors: 2 + Math.floor(rng() * 5),
        });
      } else if (kind === 'park') {
        const trees = [];
        const n = 5 + Math.floor(rng() * 5);
        for (let i = 0; i < n; i++) trees.push({ x: bx + 30 + rng() * (BLOCK - 60), y: by + 30 + rng() * (BLOCK - 60), r: 10 + rng() * 9 });
        parks.push({ x: bx, y: by, w: BLOCK, h: BLOCK, trees });
      } else {
        lots.push({ x: bx, y: by, w: BLOCK, h: BLOCK });
        // parked cars in two neat rows
        for (let i = 0; i < 3; i++) {
          for (let k = 0; k < 2; k++) {
            if (rng() < 0.38) continue;
            civCars.push(newCar(bx + 44 + i * 76, by + 58 + k * 118, Math.PI / 2, 'parked'));
          }
        }
      }
    }
  }
  // the red convertible for the docks job
  jobCar = newCar(ROAD + 2 * PITCH + 118, ROAD + 3 * PITCH + 128, -Math.PI / 2, 'parked');
  jobCar.color = '#e02121'; jobCar.job = true;
  civCars.push(jobCar);
  // a few roadside parked cars
  const spots = [[VX[0] + 30, 560], [VX[3] - 30, 900], [VX[5] + 30, 240], [VX[2] - 30, 1560], [VX[4] + 30, 1180]];
  for (const [x, y] of spots) civCars.push(newCar(x, y, 0, 'parked'));
  // traffic
  for (let i = 0; i < 11; i++) {
    const ni = Math.floor(rng() * (COLS + 1)), nj = Math.floor(rng() * (ROWS + 1));
    const car = newCar(VX[ni], HY[nj], 0, 'traffic');
    car.ni = ni; car.nj = nj; car.ti = ni; car.tj = nj;
    car.speed = 118 + rng() * 55;
    pickNextNode(car);
    civCars.push(car);
  }
  // pedestrians on the sidewalks
  for (let i = 0; i < 16; i++) {
    const p = { x: 0, y: 0, a: rng() * Math.PI * 2, speed: 34 + rng() * 22,
                color: PED_COLORS[Math.floor(rng() * PED_COLORS.length)], tx: 0, ty: 0, flee: 0, fall: 0 };
    const pt = sidewalkPoint();
    p.x = pt.x; p.y = pt.y;
    const t2 = sidewalkPoint(); p.tx = t2.x; p.ty = t2.y;
    peds.push(p);
  }
  // beach & sea dressing, fixed once so renders are stable
  sandDots = [];
  for (let i = 0; i < 260; i++) sandDots.push({ x: rng() * WORLD_W, y: CITY_H + rng() * SAND, r: 1 + rng() * 2 });
  seaLines = [];
  for (let i = 0; i < 26; i++) seaLines.push({ x: rng() * WORLD_W, y: CITY_H + SAND + 14 + rng() * (SEA - 28), len: 26 + rng() * 60, ph: rng() * Math.PI * 2 });
}
function newCar(x, y, a, mode) {
  return { x, y, a, v: 0, hp: 100, color: CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)],
           mode, ni: 0, nj: 0, ti: 0, tj: 0, speed: 130, hitCd: 0, job: false };
}
function sidewalkPoint() {
  // a point on the sidewalk ring of a random block
  const c = Math.floor(rng() * COLS), r = Math.floor(rng() * ROWS);
  const bx = ROAD + c * PITCH, by = ROAD + r * PITCH, side = Math.floor(rng() * 4), t = rng();
  const off = 8;
  if (side === 0) return { x: bx + t * BLOCK, y: by - off };
  if (side === 1) return { x: bx + t * BLOCK, y: by + BLOCK + off };
  if (side === 2) return { x: bx - off, y: by + t * BLOCK };
  return { x: bx + BLOCK + off, y: by + t * BLOCK };
}
function pickNextNode(car) {
  // choose the next intersection to drive to (prefers going straight)
  const opts = [];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const [dx, dy] of dirs) {
    const ni = car.ti + dx, nj = car.tj + dy;
    if (ni < 0 || ni > COLS || nj < 0 || nj > ROWS) continue;
    if (ni === car.ni && nj === car.nj && (car.ti !== car.ni || car.tj !== car.nj)) continue; // no U-turn
    const straight = (dx === Math.sign(car.ti - car.ni) && dy === Math.sign(car.tj - car.nj)) ? 3 : 1;
    for (let k = 0; k < straight; k++) opts.push([ni, nj]);
  }
  if (!opts.length) { car.ni = car.ti; car.nj = car.tj; return; }
  const [ni, nj] = opts[Math.floor(rng() * opts.length)];
  car.ni = car.ti; car.nj = car.tj; car.ti = ni; car.tj = nj;
}

// ---------- collision helpers ----------
function circleVsBuildings(x, y, rad) {
  // returns a push-out correction {x,y} or null
  for (const b of buildings) {
    const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
    const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
    if (d2 < rad * rad) {
      if (d2 > 0.0001) { const d = Math.sqrt(d2); return { x: cx + (dx / d) * rad, y: cy + (dy / d) * rad, hit: true, depth: rad - d }; }
      // centre inside the rect: push out along the smallest exit
      const exits = [x - b.x + rad, b.x + b.w - x + rad, y - b.y + rad, b.y + b.h - y + rad];
      const m = Math.min(...exits);
      if (m === exits[0]) return { x: b.x - rad, y, hit: true, depth: m };
      if (m === exits[1]) return { x: b.x + b.w + rad, y, hit: true, depth: m };
      if (m === exits[2]) return { x, y: b.y - rad, hit: true, depth: m };
      return { x, y: b.y + b.h + rad, hit: true, depth: m };
    }
  }
  return null;
}
function inSea(x, y, onFoot) {
  if (y < CITY_H + SAND + 8) return false;
  if (x > PIER.x - 4 && x < PIER.x + PIER.w + 4 && y < PIER.y + PIER.h) return false; // the pier
  return true;
}
function crime(points) {
  S.heat = clamp(S.heat + points, 0, 599);
  S.lastCrime = S.steps;
}
function notice(text, seconds) { S.notice = text; S.noticeT = Math.round(seconds * 60); }

// ---------- audio (tiny bleeps; M mutes; off in shot mode) ----------
let audioCtx = null;
function beep(freq, dur, type) {
  if (S.muted || SHOTMODE) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* audio is decoration only */ }
}

// ---------- input ----------
const keys = {};
let contactNear = null;
addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyM') { S.muted = !S.muted; notice(S.muted ? 'Sound off' : 'Sound on', 1); }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (S.mode === 'playing') S.mode = 'paused';
    else if (S.mode === 'paused') S.mode = 'playing';
  }
  if (e.code === 'Enter') confirmOverlay();
  if (e.code === 'KeyE' && S.mode === 'playing') interact();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
cv.addEventListener('pointerdown', () => { if (S.mode !== 'playing' && S.mode !== 'paused') confirmOverlay(); });

function confirmOverlay() {
  if (S.mode === 'title') { S.mode = 'playing'; beep(660, 0.08); }
  else if (S.mode === 'busted') respawnAfterBust();
  else if (S.mode === 'downed') respawnAfterDowned();
  else if (S.mode === 'complete') {
    S.cash += S.completeInfo.pay; S.doneMissions[S.completeInfo.id] = true;
    S.completeInfo = null; S.mode = 'playing'; beep(880, 0.12);
  }
}
function interact() {
  if (player.car) { // step out, just beside the car
    const c = player.car;
    c.mode = 'parked'; c.v = 0;
    player.x = c.x - Math.sin(c.a) * 26; player.y = c.y + Math.cos(c.a) * 26;
    player.car = null;
    return;
  }
  // nearest stealable car
  let best = null, bd = 46 * 46;
  for (const c of civCars) {
    if (c.mode !== 'parked') continue;
    const d = dist2(player.x, player.y, c.x, c.y);
    if (d < bd) { bd = d; best = c; }
  }
  if (best) {
    best.mode = 'player'; player.car = best;
    player.x = best.x; player.y = best.y;
    if (best.job && S.mission && S.mission.def.carJob && S.mission.stage === 0) {
      crime(200); S.mission.stage = 1; S.mission.stole = true;
      notice('Heat is on — get it to the docks garage!', 3); beep(196, 0.2, 'sawtooth');
    } else if (!best.job) {
      crime(25); // hot-wiring a stranger's car is still a crime
    }
    return;
  }
  if (contactNear) {
    const def = MISSIONS.find((m) => m.contact === contactNear && !S.doneMissions[m.id]);
    if (def && !S.mission) {
      S.mission = { def, stage: 0, tLeft: Math.round(def.time * 60), stole: false };
      notice(def.name + ' — ' + def.stages[0].label, 4); beep(523, 0.1);
    }
  }
}

// ---------- consequences ----------
function hurtPlayer(n) {
  if (SHOTMODE || S.mode !== 'playing') return;
  player.hp -= n; player.lastHurt = S.steps; S.shake = Math.min(10, S.shake + 4);
  if (player.hp <= 0) { player.hp = 0; S.mode = 'downed'; beep(110, 0.4, 'sawtooth'); }
}
function doBusted() {
  S.mode = 'busted';
  S.lastFine = Math.floor(S.cash * 0.15);
  beep(146, 0.4, 'sawtooth');
}
function respawnAfterBust() {
  S.cash -= S.lastFine || 0;
  S.heat = 0; S.bust = 0; cops = [];
  if (player.car) { player.car.mode = 'parked'; player.car.v = 0; player.car = null; }
  player.x = RESPAWN.police.x; player.y = RESPAWN.police.y;
  player.hp = Math.max(player.hp, 60);
  S.mode = 'playing'; notice('The Azura PD keeps your car paperwork. And a fine.', 3);
}
function respawnAfterDowned() {
  S.cash = Math.max(0, S.cash - 50);
  S.heat = Math.floor(S.heat / 2); S.bust = 0;
  if (player.car) { player.car.mode = 'parked'; player.car.v = 0; player.car = null; }
  player.x = RESPAWN.hospital.x; player.y = RESPAWN.hospital.y;
  player.hp = 100;
  S.mode = 'playing'; notice('St. Azura General patches you up. $50, please.', 3);
}

// ---------- simulation ----------
function step(dt) {
  S.steps++;
  if (S.noticeT > 0) S.noticeT--;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 30 * dt);
  updateTraffic(dt);
  updatePeds(dt);
  if (S.mode !== 'playing') return;
  updatePlayer(dt);
  updateCops(dt);
  updateMission(dt);
  // heat cools off when you have been good for a while
  if (S.steps - S.lastCrime > 360 && S.heat > 0) S.heat = Math.max(0, S.heat - 26 * dt);
  // slow health regen once the danger has passed
  if (S.steps - player.lastHurt > 360 && player.hp > 0 && player.hp < 100) player.hp = Math.min(100, player.hp + 1.6 * dt);
  // bust meter: close police + you barely moving = cuffs
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  const pSpeed = player.car ? Math.abs(player.car.v) : player.footSpeed || 0;
  let nearCop = false;
  for (const c of cops) if (dist2(px, py, c.x, c.y) < 105 * 105) { nearCop = true; break; }
  if (stars() > 0 && nearCop && pSpeed < 26) S.bust = Math.min(1, S.bust + dt / 2.4);
  else S.bust = Math.max(0, S.bust - dt / 1.3);
  if (S.bust >= 1 && !SHOTMODE) doBusted();
  // who is offering work nearby?
  contactNear = null;
  if (!player.car && !S.mission) {
    for (const key of Object.keys(CONTACTS)) {
      const c = CONTACTS[key];
      if (dist2(player.x, player.y, c.x, c.y) < 58 * 58 &&
          MISSIONS.some((m) => m.contact === key && !S.doneMissions[m.id])) contactNear = key;
    }
  }
}

function updatePlayer(dt) {
  if (player.car) {
    const car = player.car;
    const fwdIn = keys.KeyW || keys.KeyArrowUp, backIn = keys.KeyS || keys.KeyArrowDown;
    const leftIn = keys.KeyA || keys.KeyArrowLeft, rightIn = keys.KeyD || keys.KeyArrowRight;
    if (fwdIn) car.v += 235 * dt;
    if (backIn) car.v -= (car.v > 5 ? 360 : 155) * dt;
    car.v -= car.v * 0.5 * dt;                                   // drag
    if (!fwdIn && !backIn) car.v -= car.v * 0.9 * dt;            // engine braking
    car.v = clamp(car.v, -98, 308);
    const steer = (leftIn ? -1 : 0) + (rightIn ? 1 : 0);
    if (steer) car.a += steer * 1.85 * dt * clamp(car.v / 95, -1, 1);
    moveCar(car, dt, true);
    player.x = car.x; player.y = car.y; player.a = car.a;
    return;
  }
  // on foot
  let mx = 0, my = 0;
  if (keys.KeyW || keys.KeyArrowUp) my -= 1;
  if (keys.KeyS || keys.KeyArrowDown) my += 1;
  if (keys.KeyA || keys.KeyArrowLeft) mx -= 1;
  if (keys.KeyD || keys.KeyArrowRight) mx += 1;
  const len = Math.hypot(mx, my);
  player.footSpeed = len ? 152 : 0;
  if (len) {
    mx /= len; my /= len;
    player.a = Math.atan2(my, mx);
    player.walk += dt * 11;
    let nx = clamp(player.x + mx * 152 * dt, 12, WORLD_W - 12);
    let ny = clamp(player.y + my * 152 * dt, 12, WORLD_H - 12);
    if (inSea(nx, ny, true)) { if (!inSea(nx, player.y, true)) ny = player.y; else if (!inSea(player.x, ny, true)) nx = player.x; else { nx = player.x; ny = player.y; } }
    const push = circleVsBuildings(nx, ny, 10);
    if (push) { nx = push.x; ny = push.y; }
    player.x = nx; player.y = ny;
  }
  // traffic can hurt a pedestrian player
  for (const c of civCars) {
    if (c.mode !== 'traffic' || Math.abs(c.v) < 65) continue;
    if (dist2(player.x, player.y, c.x, c.y) < 21 * 21 && S.steps - (c.hitP || -999) > 70) {
      c.hitP = S.steps; hurtPlayer(16);
      player.x += Math.cos(c.a) * 16; player.y += Math.sin(c.a) * 16;
    }
  }
}

function moveCar(car, dt, isPlayerCar) {
  const ox = car.x, oy = car.y;
  car.x += Math.cos(car.a) * car.v * dt;
  car.y += Math.sin(car.a) * car.v * dt;
  car.x = clamp(car.x, 16, WORLD_W - 16);
  car.y = clamp(car.y, 16, WORLD_H - 16);
  if (inSea(car.x, car.y, false)) { car.x = ox; car.y = oy; car.v *= -0.3; }
  const push = circleVsBuildings(car.x, car.y, 15);
  if (push) {
    car.x = push.x; car.y = push.y;
    const impact = Math.abs(car.v);
    if (impact > 55) {
      const dmg = (impact - 55) * 0.14;
      car.hp -= dmg;
      if (isPlayerCar) { S.shake = Math.min(9, impact / 26); if (car.hp < 100) notice(car.hp > 30 ? 'Your ride is taking a beating' : 'This car is nearly wrecked', 1.6); }
      if (car.hp <= 0 && isPlayerCar) wreckPlayerCar();
    }
    car.v *= -0.28;
  }
  // car vs car (civilian)
  for (const o of civCars) {
    if (o === car || o.mode === 'wreck') continue;
    const d2 = dist2(car.x, car.y, o.x, o.y);
    if (d2 < 31 * 31 && d2 > 0.01) {
      const d = Math.sqrt(d2), ux = (car.x - o.x) / d, uy = (car.y - o.y) / d;
      car.x += ux * (31 - d) / 2; car.y += uy * (31 - d) / 2;
      o.x -= ux * (31 - d) / 2; o.y -= uy * (31 - d) / 2;
      const impact = Math.abs(car.v);
      if (impact > 60 && S.steps - (car.hitCd || 0) > 50) {
        car.hitCd = S.steps;
        o.hp -= (impact - 60) * 0.1; car.hp -= (impact - 60) * 0.05;
        if (isPlayerCar) { crime(45); if (car.hp <= 0) wreckPlayerCar(); }
        if (o.hp <= 0) o.mode = 'wreck';
      }
      car.v *= 0.55;
    }
  }
  // car vs police
  for (const c of cops) {
    const d2 = dist2(car.x, car.y, c.x, c.y);
    if (d2 < 31 * 31 && d2 > 0.01) {
      const d = Math.sqrt(d2), ux = (car.x - c.x) / d, uy = (car.y - c.y) / d;
      car.x += ux * (31 - d) / 2; car.y += uy * (31 - d) / 2;
      if (isPlayerCar && Math.abs(car.v) > 60 && S.steps - (car.hitCd || 0) > 50) {
        car.hitCd = S.steps; crime(120); notice('Ramming the PD? Bold.', 2);
      }
      car.v *= 0.6;
    }
  }
}
function wreckPlayerCar() {
  const car = player.car;
  if (!car) return;
  car.hp = 0; car.mode = 'wreck'; car.v = 0;
  player.x = car.x - Math.sin(car.a) * 28; player.y = car.y + Math.cos(car.a) * 28;
  player.car = null;
  hurtPlayer(8);
  notice('Wrecked. Walk it off.', 3);
}

function updateTraffic(dt) {
  for (const car of civCars) {
    if (car.mode !== 'traffic') continue;
    // target point: next intersection, offset to the right-hand lane
    const a = Math.atan2(HY[car.tj] - HY[car.nj], VX[car.ti] - VX[car.ni]);
    const tx = VX[car.ti] - Math.sin(a) * 15, ty = HY[car.tj] + Math.cos(a) * 15;
    const want = Math.atan2(ty - car.y, tx - car.x);
    car.a = turnToward(car.a, want, 2.4 * dt);
    // slow down for a car ahead
    let sp = car.speed;
    for (const o of civCars) {
      if (o === car) continue;
      const fx = car.x + Math.cos(car.a) * 40, fy = car.y + Math.sin(car.a) * 40;
      if (dist2(fx, fy, o.x, o.y) < 30 * 30) { sp = Math.min(sp, Math.abs(o.v) * 0.8 + 8); break; }
    }
    if (player.car && dist2(car.x + Math.cos(car.a) * 40, car.y + Math.sin(car.a) * 40, player.car.x, player.car.y) < 30 * 30) sp = 10;
    car.v = lerp(car.v, sp, 1 - Math.pow(0.02, dt));
    car.x += Math.cos(car.a) * car.v * dt;
    car.y += Math.sin(car.a) * car.v * dt;
    const push = circleVsBuildings(car.x, car.y, 14);
    if (push) { car.x = push.x; car.y = push.y; }
    if (dist2(car.x, car.y, VX[car.ti], HY[car.tj]) < 30 * 30) pickNextNode(car);
  }
}
function turnToward(a, want, maxDelta) { return a + clamp(angWrap(want - a), -maxDelta, maxDelta); }

function updatePeds(dt) {
  for (const p of peds) {
    if (p.fall > 0) { p.fall--; continue; }
    // flee the nearest fast car
    let threat = null, td = 120 * 120;
    for (const c of civCars) {
      if (Math.abs(c.v) < 42) continue;
      const d = dist2(p.x, p.y, c.x, c.y);
      if (d < td) { td = d; threat = c; }
    }
    for (const c of cops) {
      const d = dist2(p.x, p.y, c.x, c.y);
      if (d < td) { td = d; threat = c; }
    }
    let gx, gy, sp;
    if (threat) {
      gx = p.x + (p.x - threat.x); gy = p.y + (p.y - threat.y); sp = 158; p.flee = 20;
    } else {
      gx = p.tx; gy = p.ty; sp = p.speed;
      if (dist2(p.x, p.y, gx, gy) < 12 * 12) { const t = sidewalkPoint(); p.tx = t.x; p.ty = t.y; }
    }
    const want = Math.atan2(gy - p.y, gx - p.x);
    p.a = turnToward(p.a, want, 6 * dt);
    let nx = p.x + Math.cos(p.a) * sp * dt, ny = p.y + Math.sin(p.a) * sp * dt;
    const push = circleVsBuildings(nx, ny, 7);
    if (push) { nx = push.x; ny = push.y; }
    if (!inSea(nx, ny, true)) { p.x = clamp(nx, 10, WORLD_W - 10); p.y = clamp(ny, 10, WORLD_H - 10); }
    // knocked down by a fast car (they dive, they scramble up, they tell the cops)
    for (const c of civCars) {
      if (Math.abs(c.v) > 58 && dist2(p.x, p.y, c.x, c.y) < 18 * 18) {
        p.fall = 55;
        p.x += Math.cos(c.a) * 14; p.y += Math.sin(c.a) * 14;
        if (c === player.car) { crime(60); notice('You clipped a pedestrian!', 2); }
        break;
      }
    }
  }
}

function updateCops(dt) {
  const want = stars() > 0 ? Math.min(6, stars() + 1) : 0;
  if (cops.length < want) {
    S.spawnCd = (S.spawnCd || 0) - dt;
    if (S.spawnCd <= 0) {
      S.spawnCd = 0.8;
      // spawn at a far edge intersection
      let bx = VX[0], by = HY[0], bd = -1;
      const cand = [[0, 0], [COLS, 0], [0, ROWS], [COLS, ROWS], [3, 0], [3, ROWS], [0, 2], [COLS, 2]];
      for (const [i, j] of cand) {
        const d = dist2(player.x, player.y, VX[i], HY[j]);
        if (d > bd) { bd = d; bx = VX[i]; by = HY[j]; }
      }
      if (bd > 420 * 420) cops.push({ x: bx, y: by, a: 0, v: 0, hp: 100 });
    }
  }
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  for (let i = cops.length - 1; i >= 0; i--) {
    const c = cops[i];
    if (want === 0 && dist2(px, py, c.x, c.y) > 950 * 950) { cops.splice(i, 1); continue; }
    const wantA = Math.atan2(py - c.y, px - c.x);
    c.a = turnToward(c.a, wantA, 2.7 * dt);
    const d = Math.sqrt(dist2(px, py, c.x, c.y));
    const sp = want === 0 ? 130 : d > 150 ? 314 : d > 62 ? 238 : 96;
    c.v += clamp(sp - c.v, -320 * dt, 210 * dt);
    c.x += Math.cos(c.a) * c.v * dt;
    c.y += Math.sin(c.a) * c.v * dt;
    c.x = clamp(c.x, 16, WORLD_W - 16); c.y = clamp(c.y, 16, WORLD_H - 16);
    const push = circleVsBuildings(c.x, c.y, 15);
    if (push) { c.x = push.x; c.y = push.y; c.v *= 0.45; }
    // ramming the player's car hurts both
    if (player.car && dist2(c.x, c.y, player.car.x, player.car.y) < 30 * 30) {
      const pc = player.car;
      pc.hp -= 14 * dt; c.hp -= 8 * dt;
      if (pc.hp <= 0) wreckPlayerCar();
    }
  }
}

function updateMission(dt) {
  const m = S.mission;
  if (!m) return;
  m.tLeft--;
  if (m.tLeft <= 0) {
    S.mission = null; notice('Mission failed — out of time. The contact shrugs.', 3); beep(220, 0.25);
    return;
  }
  const st = m.def.stages[m.stage];
  if (!st) return;
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  if (st.car) {
    if (jobCar && dist2(px, py, jobCar.x, jobCar.y) < 60 * 60 && !m.hintShown) {
      m.hintShown = true; notice('There she is. Press E next to the convertible.', 3);
    }
    return; // completion happens in interact() when the car is taken
  }
  if (dist2(px, py, st.x, st.y) < 52 * 52) {
    m.stage++;
    beep(740, 0.09);
    if (m.stage >= m.def.stages.length) {
      S.completeInfo = { id: m.def.id, name: m.def.name, pay: m.def.pay };
      S.mission = null;
      if (!SHOTMODE) { S.mode = 'complete'; beep(988, 0.16); }
    } else {
      notice(m.def.stages[m.stage].label, 3);
    }
  }
}

function render() {

}

function drawMarkers() {

    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(28, 74, 120, 8);
    ctx.fillStyle = '#60a5fa'; ctx.fillRect(28, 74, 120 * clamp(player.car.hp, 0, 100) / 100, 8);
    text('RIDE', 158, 78, 11, '#e5e7eb');
  } else {
    text(player.car ? '' : 'on foot', 28, 79, 11, '#9ca3af', 'left', 'normal');
  }
  // wanted stars
  const st = stars();
  for (let i = 0; i < 5; i++) text('★', VW / 2 - 52 + i * 26, 30, 25, i < st ? '#ffd23f' : 'rgba(255,255,255,.22)', 'center');
  if (S.bust > 0.02) {
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(VW / 2 - 70, 48, 140, 9);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(VW / 2 - 70, 48, 140 * S.bust, 9);
    text('BUSTED?', VW / 2, 68, 11, '#fca5a5', 'center');
  }
  if (S.noticeT > 0) text(S.notice, VW / 2, 92, 16, '#fde68a', 'center');
  // mission banner
  if (S.mission) {
    const m = S.mission, stg = m.def.stages[m.stage];
    const t = Math.max(0, Math.ceil(m.tLeft / 60));
    const mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
    panel(VW / 2 - 265, VH - 64, 530, 48);
    text(m.def.name + '  ·  ' + mm + ':' + ss, VW / 2, VH - 46, 14, '#ffd23f', 'center');
    text(stg.label, VW / 2, VH - 26, 13, '#ffffff', 'center', 'normal');
  }
  text('WASD/arrows move · E enter/exit · P pause · M sound' + (S.muted ? ' · MUTED' : ''), 16, VH - 16, 12, 'rgba(255,255,255,.55)', 'left', 'normal');
}
function drawMinimap() {
  const w = 182, h = 190, x0 = VW - w - 14, y0 = 14, sc = w / WORLD_W;
  panel(x0 - 4, y0 - 4, w + 8, h + 8, 0.62);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  ctx.fillStyle = '#20262e'; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = '#14507a'; ctx.fillRect(x0, y0 + (CITY_H + SAND) * sc, w, SEA * sc);
  ctx.fillStyle = '#e2cf9e'; ctx.fillRect(x0, y0 + CITY_H * sc, w, SAND * sc);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i <= COLS; i++) { ctx.moveTo(x0 + VX[i] * sc, y0); ctx.lineTo(x0 + VX[i] * sc, y0 + CITY_H * sc); }
  for (let j = 0; j <= ROWS; j++) { ctx.moveTo(x0, y0 + HY[j] * sc); ctx.lineTo(x0 + CITY_W * sc, y0 + HY[j] * sc); }
  ctx.stroke();
  ctx.fillStyle = '#596068';
  for (const b of buildings) ctx.fillRect(x0 + b.x * sc, y0 + b.y * sc, Math.max(2, b.w * sc), Math.max(2, b.h * sc));
  for (const key of Object.keys(CONTACTS)) {
    const c = CONTACTS[key];
    ctx.fillStyle = key === 'docks' ? '#22d3ee' : '#fb923c';
    ctx.beginPath(); ctx.arc(x0 + c.x * sc, y0 + c.y * sc, 3.4, 0, 7); ctx.fill();
  }
  if (S.mission) {
    const stg = S.mission.def.stages[S.mission.stage];
    const tx = stg.car ? (jobCar ? jobCar.x : 0) : stg.x, ty = stg.car ? (jobCar ? jobCar.y : 0) : stg.y;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(x0 + tx * sc, y0 + ty * sc, 4 + Math.sin(S.steps * 0.15) * 1.2, 0, 7); ctx.fill();
  }
  for (const c of cops) { ctx.fillStyle = '#2f7bff'; ctx.beginPath(); ctx.arc(x0 + c.x * sc, y0 + c.y * sc, 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(x0 + player.x * sc, y0 + player.y * sc, 3.6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.strokeRect(x0 + S.camX * sc, y0 + S.camY * sc, VW * sc, VH * sc);
  ctx.restore();
}
function drawOverlays() {
  if (S.mode === 'playing') return;
  ctx.fillStyle = S.mode === 'title' ? 'rgba(4,8,14,.66)' : 'rgba(4,8,14,.6)';
  ctx.fillRect(0, 0, VW, VH);
  if (S.mode === 'title') {
    text('AZURA HEAT', VW / 2, 218, 74, '#ffd23f', 'center');
    text('P O R T   A Z U R A', VW / 2, 268, 22, '#7dd3fc', 'center');
    text('An original top-down crime sandbox. Steal rides, run jobs for the docks', VW / 2, 322, 17, '#e5e7eb', 'center', 'normal');
    text('and Café Azul, and try not to meet the Azura PD up close.', VW / 2, 346, 17, '#e5e7eb', 'center', 'normal');
    text('WASD / arrows — move & drive      E — enter / exit car, take a job', VW / 2, 408, 16, '#cbd5e1', 'center', 'normal');
    text('P — pause      M — sound on/off', VW / 2, 434, 16, '#cbd5e1', 'center', 'normal');
    text('PRESS ENTER OR CLICK TO PLAY', VW / 2, 496, 21, '#7CFC9A', 'center');
  } else if (S.mode === 'paused') {
    text('PAUSED', VW / 2, VH / 2 - 10, 46, '#ffffff', 'center');
    text('P or Esc to keep driving', VW / 2, VH / 2 + 34, 16, '#cbd5e1', 'center', 'normal');
  } else if (S.mode === 'busted') {
    text('BUSTED', VW / 2, VH / 2 - 26, 58, '#f87171', 'center');
    text('The Azura PD walks you to the station. Fine: $' + (S.lastFine || 0), VW / 2, VH / 2 + 24, 18, '#e5e7eb', 'center', 'normal');
    text('PRESS ENTER', VW / 2, VH / 2 + 62, 18, '#7CFC9A', 'center');
  } else if (S.mode === 'downed') {
    text('DOWNED', VW / 2, VH / 2 - 26, 58, '#fb923c', 'center');
    text('You wake up at St. Azura General. The bill is $50.', VW / 2, VH / 2 + 24, 18, '#e5e7eb', 'center', 'normal');
    text('PRESS ENTER', VW / 2, VH / 2 + 62, 18, '#7CFC9A', 'center');
  } else if (S.mode === 'complete') {
    text('MISSION COMPLETE', VW / 2, VH / 2 - 30, 48, '#7CFC9A', 'center');
    text(S.completeInfo.name, VW / 2, VH / 2 + 16, 22, '#ffffff', 'center');
    text('+$' + S.completeInfo.pay, VW / 2, VH / 2 + 52, 26, '#ffd23f', 'center');
    if (!SHOTMODE) text('PRESS ENTER', VW / 2, VH / 2 + 94, 17, '#cbd5e1', 'center');
  }
}

// ---------- shot-mode scenes (deterministic; used for the renders) ----------
function setupShot() {
  if (SHOT === 'start') {
    S.mode = 'title';
    player.x = 330; player.y = CITY_H + 30; player.a = -0.4;
    for (let i = 0; i < 150; i++) step(STEP);           // ambient life behind the title
  } else if (SHOT === 'play') {
    S.mode = 'playing';
    const car = newCar(VX[2], HY[2], 0, 'player');
    car.color = '#3f6fd8'; car.v = 130;
    civCars.push(car);
    player.car = car; player.x = car.x; player.y = car.y;
    S.cash = 140;
    S.heat = 240; S.lastCrime = 0;                       // two stars
    cops.push({ x: VX[2] - 235, y: HY[2] - 16, a: 0, v: 205, hp: 100 });
    cops.push({ x: VX[2] - 330, y: HY[2] + 17, a: 0, v: 215, hp: 100 });
    S.mission = { def: MISSIONS[0], stage: 1, tLeft: 140 * 60, stole: false };  // carrying the crate
    civCars = civCars.filter((c) => !(c.mode === 'traffic' && Math.abs(c.y - HY[2]) < 58 && c.x > VX[1] && c.x < VX[5]));
    keys.KeyW = true;                                    // scripted: foot down, straight east
    for (let i = 0; i < 120; i++) step(STEP);
    keys.KeyW = false;
  } else if (SHOT === 'end') {
    S.doneMissions = { cargo: true };
    S.cash = 320;
    S.completeInfo = { id: 'rush', name: 'Azul Coffee Rush', pay: 250 };
    player.x = CONTACTS.cafe.x + 30; player.y = CONTACTS.cafe.y + 10; player.a = -0.6;
    for (let i = 0; i < 90; i++) step(STEP);             // ambient life
    S.mode = 'complete';
  }
  render();
  window.__shotReady = true;
}

// ---------- boot ----------
buildWorld();
if (SHOTMODE) {
  setupShot();
} else {
  let last = performance.now(), acc = 0;
  const frame = (now) => {
    acc += Math.min(0.12, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
