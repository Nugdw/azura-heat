<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azura Heat — a tiny open-world crime caper in Port Azura</title>
<style>
  html, body { margin: 0; padding: 0; background: #10151c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #274b63; box-shadow: 0 0 60px rgba(0,0,0,.55); }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
/* =====================================================================
   AZURA HEAT — an original 2D top-down open-world crime game.
   Port Azura is a fictional coastal city: six districts wide, five tall,
   with a beach and a bright azure sea along its southern edge.
   Vanilla JS + Canvas 2D. No assets, no network, one file.
   ===================================================================== */

// ---------------------------------------------------------------- utils
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

/** mulberry32: small deterministic PRNG, the only randomness source. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- config
const VIEW_W = 1280, VIEW_H = 720;
const COLS = 6, ROWS = 5;              // district grid
const BLOCK = 250, ROAD = 90;          // block size / road width
const PITCH = BLOCK + ROAD;            // 340
const CITY_W = COLS * BLOCK + (COLS + 1) * ROAD;   // 2130
const CITY_H = ROWS * BLOCK + (ROWS + 1) * ROAD;   // 1790
const BEACH_H = 170;
const SEA_Y = CITY_H + BEACH_H;                    // water starts here
const WORLD_W = CITY_W;                            // 2130
const WORLD_H = SEA_Y + 430;                       // 2390
const LANE = 21;                                   // traffic lane offset from road centre
const STEP = 1 / 60;                               // fixed timestep

const vRoadX = k => k * PITCH + ROAD / 2;          // centre x of vertical road k (0..COLS)
const hRoadY = j => j * PITCH + ROAD / 2;          // centre y of horizontal road j (0..ROWS)
const blockX = c => c * PITCH + ROAD;              // left edge of block column c
const blockY = r => r * PITCH + ROAD;              // top edge of block row r

// ---------------------------------------------------------------- dom
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ------------------------------------------------------- url / shot mode
const params = new URLSearchParams(location.search);
const SHOT = params.get('shot');                   // null | 'start' | 'play' | 'end'
const SEED = (() => { const n = parseInt(params.get('seed') || '1', 10); return Number.isFinite(n) ? n : 1; })();
const IN_SHOT = SHOT === 'start' || SHOT === 'play' || SHOT === 'end';

// Two RNG streams: the world layout is always identical; the simulation
// stream is seeded by ?seed in shot mode so captures are reproducible.
const worldRng = mulberry32(0xA2024);
const simRng = mulberry32(IN_SHOT ? (SEED * 2654435761) >>> 0 : (Date.now() % 2147483647) + 7);
const srnd = (a, b) => a + simRng() * (b - a);
const srange = n => Math.floor(simRng() * n);

// ---------------------------------------------------------------- world
// Buildings / parks / parking lots are generated once from worldRng.
const BUILDING_COLORS = ['#e8b4a0', '#f2d5a7', '#a8c6d8', '#d9a7c0', '#b5d3a7', '#f0e6c8', '#c9b8e0', '#9fd4cf', '#e6a08a', '#bcd2e8'];
const blocks = [];        // {c, r, kind, buildings: [{x,y,w,h,color,roof}], trees: [{x,y,r}]}
const solids = [];        // AABBs that block movement: {x, y, w, h}
const parkedSpots = [];   // candidate parked-car spots {x, y, ang}

const CAFE_BLOCK = { c: 3, r: 0 };        // Café Azul lives here
const PD_BLOCK = { c: 0, r: 0 };          // Port Azura Police Department
const HOSP_BLOCK = { c: 5, r: 4 };        // St. Azura Hospital

for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const bx = blockX(c), by = blockY(r);
    const roll = worldRng();
    let kind = 'buildings';
    const special = (c === CAFE_BLOCK.c && r === CAFE_BLOCK.r) || (c === PD_BLOCK.c && r === PD_BLOCK.r) || (c === HOSP_BLOCK.c && r === HOSP_BLOCK.r);
    if (!special) {
      if (roll < 0.16) kind = 'park';
      else if (roll < 0.28) kind = 'parking';
    }
    const blk = { c, r, kind, buildings: [], trees: [] };
    if (kind === 'buildings') {
      const m = 26 + worldRng() * 14;
      blk.buildings.push({ x: bx + m, y: by + m, w: BLOCK - m * 2, h: BLOCK - m * 2 - 20, color: BUILDING_COLORS[Math.floor(worldRng() * BUILDING_COLORS.length)], roof: 6 + worldRng() * 10 });
      if (worldRng() < 0.45) {
        blk.buildings.push({ x: bx + 14, y: by + BLOCK - 66, w: 74, h: 52, color: BUILDING_COLORS[Math.floor(worldRng() * BUILDING_COLORS.length)], roof: 4 });
      }
      for (const b of blk.buildings) solids.push(b);
    } else if (kind === 'park') {
      const n = 7 + Math.floor(worldRng() * 6);
      for (let i = 0; i < n; i++) blk.trees.push({ x: bx + 30 + worldRng() * (BLOCK - 60), y: by + 30 + worldRng() * (BLOCK - 60), r: 10 + worldRng() * 9 });
      const pav = { x: bx + BLOCK / 2 - 26, y: by + BLOCK / 2 - 18, w: 52, h: 36, color: '#c98d5e', roof: 5 };
      blk.buildings.push(pav); solids.push(pav);
    } else { // parking: two rows of marked bays
      for (let i = 0; i < 4; i++) {
        parkedSpots.push({ x: bx + 42 + i * 52, y: by + 58, ang: Math.PI / 2 });
        parkedSpots.push({ x: bx + 42 + i * 52, y: by + BLOCK - 58, ang: -Math.PI / 2 });
      }
    }
    blocks.push(blk);
  }
}
// a few kerbside parked cars along the avenues
for (let j = 1; j < ROWS; j++) {
  parkedSpots.push({ x: vRoadX(0) + ROAD / 2 + 24, y: hRoadY(j) - 74, ang: -Math.PI / 2 });
  parkedSpots.push({ x: vRoadX(0) + ROAD / 2 + 24, y: hRoadY(j) - 138, ang: -Math.PI / 2 });
  parkedSpots.push({ x: vRoadX(COLS) - ROAD / 2 - 24, y: hRoadY(j) + 74, ang: Math.PI / 2 });
  parkedSpots.push({ x: vRoadX(COLS) - ROAD / 2 - 24, y: hRoadY(j) + 138, ang: Math.PI / 2 });
}

// Piers: wooden walkways over the water. Walkable on foot, not for cars.
const PIERS = [
  { x: blockX(1) + 96, y: SEA_Y - 6, w: 46, h: 190 },
  { x: blockX(4) + 96, y: SEA_Y - 6, w: 46, h: 150 },
];
const DOCK = { x: PIERS[0].x + PIERS[0].w / 2, y: CITY_H + 66 };            // The Docks contact, on the sand
const DOCK_CRATE = { x: PIERS[0].x + PIERS[0].w / 2, y: SEA_Y + 168 };      // crate at the end of pier 1
const DOCK_GARAGE = { x: blockX(1) + 60, y: CITY_H + 40 };                 // delivery point by the docks
const CAFE = { x: blockX(CAFE_BLOCK.c) + BLOCK / 2, y: blockY(CAFE_BLOCK.r) + BLOCK + 26 }; // Café Azul contact, kerb below its block
const PD = { x: blockX(PD_BLOCK.c) + BLOCK / 2, y: blockY(PD_BLOCK.r) + BLOCK / 2 };
const HOSP = { x: blockX(HOSP_BLOCK.c) + BLOCK / 2, y: blockY(HOSP_BLOCK.r) + BLOCK / 2 };
const MISSION_CAR_SPOT = { x: CAFE.x + 92, y: CAFE.y + 8, ang: 0 };        // the marked convertible near the café

/** Is a point on a pier (walkable ground over water)? */
function onPier(x, y) {
  return PIERS.some(p => x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h);
}

// ---------------------------------------------------------------- audio
// Tiny WebAudio synth: bleeps only, created lazily on the first gesture.
let audioCtx = null, muted = false;
function beep(freq, dur, type, vol, when) {
  if (muted || IN_SHOT) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* audio is a garnish, never a blocker */ }
}
const sfx = {
  click: () => beep(220, 0.06, 'square', 0.04),
  pickup: () => { beep(660, 0.08, 'square', 0.05); beep(990, 0.1, 'square', 0.05, 0.08); },
  cash: () => { beep(523, 0.09, 'triangle', 0.07); beep(659, 0.09, 'triangle', 0.07, 0.09); beep(784, 0.16, 'triangle', 0.07, 0.18); },
  thud: () => beep(70, 0.12, 'sawtooth', 0.08),
  sting: () => { beep(392, 0.14, 'sawtooth', 0.06); beep(311, 0.22, 'sawtooth', 0.06, 0.13); },
  siren: () => { beep(880, 0.12, 'sine', 0.03); beep(660, 0.12, 'sine', 0.03, 0.13); },
};

// ---------------------------------------------------------------- input
const keys = {};
let pressedE = false, pressedEnter = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (!keys[k]) {
    if (k === 'e') pressedE = true;
    if (k === 'enter' || k === ' ') pressedEnter = true;
    if (k === 'p' && (G.state === 'play' || G.state === 'pause')) { G.state = G.state === 'play' ? 'pause' : 'play'; }
    if (k === 'm') { muted = !muted; }
  }
  keys[k] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('pointerdown', () => { pressedEnter = true; });
const input = { up: false, down: false, left: false, right: false };
function readInput() {
  input.up = !!(keys['w'] || keys['arrowup']);
  input.down = !!(keys['s'] || keys['arrowdown']);
  input.left = !!(keys['a'] || keys['arrowleft']);
  input.right = !!(keys['d'] || keys['arrowright']);
}

// ---------------------------------------------------------------- state
const CAR_COLORS = ['#d94f3d', '#3d7bd9', '#f2b134', '#58b368', '#e8e4da', '#7a5fb0', '#e07bb0', '#4fb8c9', '#8a8f98', '#2f6f4f'];
const PED_COLORS = ['#f2c894', '#c96f4a', '#7a4a2b', '#f7d7b0', '#5b3a24'];
const PED_SHIRTS = ['#d94f3d', '#3d7bd9', '#f2b134', '#58b368', '#e07bb0', '#4fb8c9', '#eeeeee', '#333a45'];

const G = {
  state: IN_SHOT ? 'play' : 'title',   // title | play | pause | busted | downed | complete
  time: 0,
  cash: 120,
  wanted: 0,                 // 0..5 stars
  unseenTime: 0,             // seconds since anyone saw the player misbehave / saw the player
  bust: 0,                   // 0..1 bust meter
  banner: '', bannerT: 0,    // objective / toast text
  hint: '',                  // contextual prompt, e.g. "[E] enter car"
  stateT: 0,                 // time spent in the current screen state
  shake: 0,
  completeInfo: null,        // {name, reward} while the MISSION COMPLETE screen is up
};

const player = {
  x: DOCK.x - 70, y: DOCK.y + 30, ang: -Math.PI / 2, speed: 0,
  health: 100, car: null,     // car: the car object being driven, or null on foot
  radius: 10,
};

let cars = [];   // {x,y,ang,speed,color,kind:'traffic'|'parked'|'police'|'mission',health,rail,wp,turnCool,dead}
let peds = [];   // {x,y,ang,speed,skin,shirt,state:'walk'|'flee'|'down',target,thinkT,downT}
let nextCarId = 1;

function makeCar(x, y, ang, kind, color) {
  return { id: nextCarId++, x, y, ang, speed: 0, color: color || CAR_COLORS[srange(CAR_COLORS.length)], kind, health: 100, rail: null, wp: null, turnCool: 0, dead: false, radius: 17 };
}

function spawnTraffic() {
  // put a car on a random road lane, mid-block, heading along it
  const horizontal = simRng() < 0.5;
  const dir = simRng() < 0.5 ? 1 : -1;
  let car;
  if (horizontal) {
    const j = srange(ROWS + 1);
    const x = srnd(80, WORLD_W - 80);
    const y = hRoadY(j) + (dir > 0 ? LANE : -LANE);
    car = makeCar(x, y, dir > 0 ? 0 : Math.PI, 'traffic');
    car.rail = { axis: 'h', index: j, dir };
  } else {
    const k = srange(COLS + 1);
    const y = srnd(80, CITY_H - 80);
    const x = vRoadX(k) + (dir > 0 ? -LANE : LANE);
    car = makeCar(x, y, dir > 0 ? Math.PI / 2 : -Math.PI / 2, 'traffic');
    car.rail = { axis: 'v', index: k, dir };
  }
  car.speed = srnd(85, 125);
  car.cruise = car.speed;
  cars.push(car);
  return car;
}

function spawnPed(x, y) {
  const blk = blocks[srange(blocks.length)];
  const px = x !== undefined ? x : blockX(blk.c) + srnd(8, BLOCK - 8);
  const py = y !== undefined ? y : blockY(blk.r) + srnd(8, BLOCK - 8);
  const ped = {
    x: px, y: py, ang: srnd(0, TAU), speed: 0,
    skin: PED_COLORS[srange(PED_COLORS.length)], shirt: PED_SHIRTS[srange(PED_SHIRTS.length)],
    state: 'walk', target: null, thinkT: 0, downT: 0, radius: 8,
  };
  ped.target = pedWaypoint(ped);
  peds.push(ped);
  return ped;
}

/** A stroll target: a point on a block perimeter (the sidewalks). */
function pedWaypoint(ped) {
  const blk = blocks[srange(blocks.length)];
  const side = srange(4);
  const bx = blockX(blk.c), by = blockY(blk.r);
  if (side === 0) return { x: bx + srnd(4, BLOCK - 4), y: by + 5 };
  if (side === 1) return { x: bx + srnd(4, BLOCK - 4), y: by + BLOCK - 5 };
  if (side === 2) return { x: bx + 5, y: by + srnd(4, BLOCK - 4) };
  return { x: bx + BLOCK - 5, y: by + srnd(4, BLOCK - 4) };
}

function resetWorld() {
  cars = []; peds = []; nextCarId = 1;
  for (const spot of parkedSpots) if (simRng() < 0.62) cars.push(makeCar(spot.x, spot.y, spot.ang, 'parked'));
  const mc = makeCar(MISSION_CAR_SPOT.x, MISSION_CAR_SPOT.y, MISSION_CAR_SPOT.ang, 'mission', '#ffb400');
  cars.push(mc);
  for (let i = 0; i < 13; i++) spawnTraffic();
  for (let i = 0; i < 24; i++) spawnPed();
  return mc;
}
let missionCar = resetWorld();

// ------------------------------------------------------------ collisions
/** Push a circle (x, y, r) out of every solid AABB; returns corrected {x, y, hit}. */
function collideSolids(x, y, r) {
  let hit = false;
  for (const s of solids) {
    const nx = clamp(x, s.x, s.x + s.w), ny = clamp(y, s.y, s.y + s.h);
    const d2 = dist2(x, y, nx, ny);
    if (d2 < r * r) {
      hit = true;
      if (d2 > 0.0001) {
        const d = Math.sqrt(d2);
        x = nx + (x - nx) / d * r; y = ny + (y - ny) / d * r;
      } else {
        // centre inside the box: push out along the smallest penetration
        const left = x - s.x, right = s.x + s.w - x, top = y - s.y, bot = s.y + s.h - y;
        const m = Math.min(left, right, top, bot);
        if (m === left) x = s.x - r; else if (m === right) x = s.x + s.w + r;
        else if (m === top) y = s.y - r; else y = s.y + s.h + r;
      }
    }
  }
  return { x, y, hit };
}

/** Ground rules: foot traffic may wade onto piers but not into open water; cars may not enter water at all. */
function collideWater(x, y, r, onFoot) {
  if (y + r <= SEA_Y) return { x, y, hit: false };
  if (onFoot && onPier(x, y)) return { x, y, hit: false };
  // treat the sea as a big solid slab whose top edge is SEA_Y
  if (y > SEA_Y - r && !(onFoot && onPier(x, y))) return { x, y: SEA_Y - r, hit: true };
  return { x, y, hit: false };
}

function collideWorld(x, y, r, onFoot) {
  let res = collideSolids(x, y, r);
  x = res.x; y = res.y;
  const wres = collideWater(x, y, r, onFoot);
  x = clamp(wres.x, r, WORLD_W - r); y = clamp(wres.y, r, WORLD_H - r);
  return { x, y, hit: res.hit || wres.hit };
}

// -------------------------------------------------------------- missions
// Three jobs from two contacts. A mission is a list of steps; reaching a
// step's point (or satisfying its special condition) advances it.
const MISSIONS = [
  {
    id: 'fresh-catch', giver: 'docks', name: 'Fresh Catch',
    brief: 'Grab the crate at the end of the pier and run it up to Café Azul.',
    reward: 300, timeLimit: 170,
    steps: [
      { type: 'goto', x: DOCK_CRATE.x, y: DOCK_CRATE.y, r: 30, label: 'Pick up the crate at the end of the pier' },
      { type: 'goto', x: CAFE.x, y: CAFE.y, r: 42, label: 'Deliver the crate to Café Azul' },
    ],
  },
  {
    id: 'harbor-lights', giver: 'docks', name: 'Harbor Lights GP',
    brief: 'Hit all four harbour checkpoints before the clock runs out.',
    reward: 500, timeLimit: 190,
    steps: [
      { type: 'goto', x: vRoadX(0) + 40, y: hRoadY(0) + 40, r: 55, label: 'Checkpoint 1: north-west corner' },
      { type: 'goto', x: vRoadX(COLS) - 40, y: hRoadY(0) + 40, r: 55, label: 'Checkpoint 2: north-east corner' },
      { type: 'goto', x: vRoadX(COLS) - 40, y: CITY_H - 30, r: 55, label: 'Checkpoint 3: south-east, by the beach' },
      { type: 'goto', x: DOCK_GARAGE.x, y: DOCK_GARAGE.y, r: 55, label: 'Finish at the docks garage' },
    ],
  },
  {
    id: 'espresso-run', giver: 'cafe', name: 'Espresso Run',
    brief: 'Lift the amber convertible by the café, park it at the docks, then lose the heat.',
    reward: 650, timeLimit: 0,
    steps: [
      { type: 'steal', label: 'Steal the amber convertible near Café Azul' },
      { type: 'goto', x: DOCK_GARAGE.x, y: DOCK_GARAGE.y, r: 52, label: 'Park the convertible at the docks garage' },
      { type: 'loseheat', label: 'Lose the heat (wanted level to zero)' },
    ],
  },
];
const missionState = {};   // id -> 'available' | 'active' | 'done'
for (const m of MISSIONS) missionState[m.id] = 'available';
let activeMission = null;  // {def, step, t} while running

function banner(text, secs) { G.banner = text; G.bannerT = secs || 3.5; }

function startMission(def) {
  activeMission = { def, step: 0, t: 0 };
  missionState[def.id] = 'active';
  banner(def.name + ' — ' + def.steps[0].label, 4.5);
  sfx.pickup();
}
function failMission(why) {
  if (!activeMission) return;
  missionState[activeMission.def.id] = 'available';
  banner('MISSION FAILED — ' + why, 4);
  sfx.sting();
  activeMission = null;
}
function completeMission() {
  const def = activeMission.def;
  missionState[def.id] = 'done';
  G.cash += def.reward;
  activeMission = null;
  G.completeInfo = { name: def.name, reward: def.reward };
  G.state = 'complete'; G.stateT = 0;
  sfx.cash();
}
function missionMarker() {
  if (!activeMission) return null;
  const st = activeMission.def.steps[activeMission.step];
  if (st.type === 'goto') return { x: st.x, y: st.y };
  if (st.type === 'steal') return { x: missionCar.x, y: missionCar.y };
  return null;
}
function stepMission(dt) {
  if (!activeMission) return;
  const am = activeMission;
  am.t += dt;
  if (am.def.timeLimit && am.t > am.def.timeLimit) { failMission('out of time'); return; }
  const st = am.def.steps[am.step];
  let px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  // the Espresso Run delivery is about the convertible, not about the player
  if (am.def.id === 'espresso-run' && am.step === 1) { px = missionCar.x; py = missionCar.y; }
  let advance = false;
  if (st.type === 'goto') advance = dist2(px, py, st.x, st.y) < st.r * st.r;
  else if (st.type === 'steal') advance = player.car === missionCar;
  else if (st.type === 'loseheat') advance = G.wanted === 0;
  if (advance) {
    am.step++;
    sfx.pickup();
    if (am.step >= am.def.steps.length) completeMission();
    else banner(am.def.steps[am.step].label, 4);
  }
}

// ---------------------------------------------------------------- crime
/** Commit a crime: raises wanted; witnesses are peds/police within sight range. */
function commitCrime(stars, x, y) {
  if (G.crimeMute) return; // shot-mode scenes keep the wanted level they were given
  let witnessed = false;
  for (const p of peds) if (p.state !== 'down' && dist2(p.x, p.y, x, y) < 300 * 300) witnessed = true;
  for (const c of cars) if (c.kind === 'police' && dist2(c.x, c.y, x, y) < 420 * 420) witnessed = true;
  if (dist2(player.x, player.y, x, y) < 200 * 200) witnessed = true; // the deed is at the player's own hands
  if (witnessed) {
    G.wanted = clamp(G.wanted + stars, 0, 5);
    G.unseenTime = 0;
  }
}

function stepWanted(dt) {
  // being seen: any police car or ped close by resets the unseen clock
  let seen = false;
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  for (const c of cars) if (c.kind === 'police' && dist2(c.x, c.y, px, py) < 380 * 380) seen = true;
  if (!seen) for (const p of peds) if (p.state !== 'down' && dist2(p.x, p.y, px, py) < 190 * 190) seen = true;
  if (seen) G.unseenTime = 0; else G.unseenTime += dt;
  if (G.wanted > 0 && G.unseenTime > 6) { G.wanted -= 1; G.unseenTime = 0; if (G.wanted === 0) banner('You lost the heat', 2.5); }
  // keep the police presence proportional to the wanted level
  const want = Math.floor(G.wanted);
  const have = cars.filter(c => c.kind === 'police').length;
  if (want > have) spawnPolice(px, py);
  else if (want < have) {
    const cop = cars.find(c => c.kind === 'police');
    if (cop) { cop.kind = 'traffic'; cop.color = CAR_COLORS[srange(CAR_COLORS.length)]; cop.rail = null; cop.wp = null; }
  }
}

function spawnPolice(px, py) {
  // appear on a road at least 520px away from the player
  for (let tries = 0; tries < 12; tries++) {
    const horizontal = simRng() < 0.5;
    let x, y;
    if (horizontal) { const j = srange(ROWS + 1); x = srnd(60, WORLD_W - 60); y = hRoadY(j); }
    else { const k = srange(COLS + 1); x = vRoadX(k); y = srnd(60, CITY_H - 60); }
    if (dist2(x, y, px, py) < 520 * 520) continue;
    const cop = makeCar(x, y, 0, 'police', '#22335c');
    cop.speed = 0;
    cars.push(cop);
    sfx.siren();
    return;
  }
}

// ---------------------------------------------------------------- player
function stepPlayerOnFoot(dt) {
  readInput();
  let mx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let my = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  const mag = Math.hypot(mx, my);
  const spd = 158;
  if (mag > 0) {
    mx /= mag; my /= mag;
    player.ang = Math.atan2(my, mx);
    player.speed = spd;
  } else player.speed = 0;
  const res = collideWorld(player.x + mx * spd * dt, player.y + my * spd * dt, player.radius, true);
  player.x = res.x; player.y = res.y;

  // interactions
  G.hint = '';
  // contacts
  for (const [name, pt] of [['docks', DOCK], ['cafe', CAFE]]) {
    if (dist2(player.x, player.y, pt.x, pt.y) < 46 * 46) {
      const next = MISSIONS.find(m => m.giver === name && missionState[m.id] === 'available');
      const active = MISSIONS.find(m => m.giver === name && missionState[m.id] === 'active');
      if (active) G.hint = active.name + ' in progress — follow the gold marker';
      else if (next) G.hint = '[E] ' + next.name + ' — ' + next.brief + ' ($' + next.reward + ')';
      else G.hint = name === 'docks' ? 'The Docks: no more work today' : 'Café Azul: no more work today';
      if (pressedE && next && !activeMission) startMission(next);
    }
  }
  // enter a car
  let best = null, bestD = 46 * 46;
  for (const c of cars) {
    if (c.dead) continue;
    const d = dist2(player.x, player.y, c.x, c.y);
    if (d < bestD) { bestD = d; best = c; }
  }
  if (best) {
    if (best.kind === 'police') G.hint = G.hint || 'Police cruiser — locked';
    else {
      G.hint = G.hint || '[E] Enter car';
      if (pressedE) enterCar(best);
    }
  }
}

function enterCar(car) {
  const wasParked = car.kind === 'parked';
  player.car = car;
  car.speed = 0;
  if (car.kind === 'mission') {
    commitCrime(2, car.x, car.y);
    banner('Convertible lifted — the law noticed', 3);
  } else if (!wasParked) {
    // carjacking a moving ride: driver bails and runs
    const driver = spawnPed(car.x + 24, car.y + 10);
    driver.state = 'flee'; driver.thinkT = 3;
    commitCrime(1, car.x, car.y);
  } else {
    commitCrime(0, car.x, car.y); // quietly borrowing a parked car: no stars, but keep the hook
    if (G.wanted > 0) G.unseenTime = 0;
  }
  car.kind = 'player';
  sfx.click();
}

function exitCar() {
  const car = player.car;
  player.x = car.x + Math.cos(car.ang + Math.PI / 2) * 30;
  player.y = car.y + Math.sin(car.ang + Math.PI / 2) * 30;
  const res = collideWorld(player.x, player.y, player.radius, true);
  player.x = res.x; player.y = res.y;
  car.kind = 'parked'; car.speed = 0;
  player.car = null;
  sfx.click();
}

function stepPlayerDriving(dt) {
  const car = player.car;
  readInput();
  G.hint = '[E] Exit car';
  if (pressedE) { exitCar(); return; }
  driveCar(car, input, dt);
  player.x = car.x; player.y = car.y; player.ang = car.ang;
}

/** Arcade driving shared by the player (and the shot-mode autopilot). */
function driveCar(car, inp, dt) {
  const MAXF = 265, MAXR = 105;
  if (car.health <= 0) { car.speed = lerp(car.speed, 0, dt * 2); }
  else if (inp.up) car.speed = Math.min(car.speed + 240 * dt, MAXF);
  else if (inp.down) car.speed = Math.max(car.speed - (car.speed > 10 ? 320 : 160) * dt, -MAXR);
  else car.speed = lerp(car.speed, 0, dt * (car.speed > 0 ? 0.55 : 0.9));
  const turn = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  if (turn !== 0 && Math.abs(car.speed) > 4) {
    const grip = clamp(Math.abs(car.speed) / 120, 0.35, 1);
    car.ang += turn * 2.35 * grip * dt * Math.sign(car.speed);
  }
  const nx = car.x + Math.cos(car.ang) * car.speed * dt;
  const ny = car.y + Math.sin(car.ang) * car.speed * dt;
  const res = collideWorld(nx, ny, car.radius, false);
  if (res.hit && Math.abs(car.speed) > 90) {
    damageCar(car, Math.abs(car.speed) * 0.055, true);
    car.speed *= -0.25;
  } else if (res.hit) car.speed *= 0.6;
  car.x = res.x; car.y = res.y;
}

function damageCar(car, amount, noisy) {
  if (car.dead) return;
  car.health -= amount;
  if (noisy) { sfx.thud(); G.shake = Math.min(G.shake + 2.5, 6); }
  if (car.health <= 0) {
    car.health = 0; car.dead = true; car.speed = 0;
    if (player.car === car) banner('Your ride is wrecked — get out and find another', 3);
  }
}

// ---------------------------------------------------------------- traffic
function stepTraffic(car, dt) {
  if (car.dead) return;
  if (!car.rail) {
    // a car with no rail (e.g. a cruiser stood down) rejoins the nearest lane
    if (car.cruise === undefined) car.cruise = srnd(85, 125);
    const horiz = Math.abs(Math.cos(car.ang)) >= Math.abs(Math.sin(car.ang));
    if (horiz) {
      let bj = 0, bd = Infinity;
      for (let j = 0; j <= ROWS; j++) { const d = Math.abs(car.y - hRoadY(j)); if (d < bd) { bd = d; bj = j; } }
      const dir = Math.cos(car.ang) >= 0 ? 1 : -1;
      car.rail = { axis: 'h', index: bj, dir };
      car.y = hRoadY(bj) + (dir > 0 ? LANE : -LANE); car.ang = dir > 0 ? 0 : Math.PI;
    } else {
      let bk = 0, bd = Infinity;
      for (let k = 0; k <= COLS; k++) { const d = Math.abs(car.x - vRoadX(k)); if (d < bd) { bd = d; bk = k; } }
      const dir = Math.sin(car.ang) >= 0 ? 1 : -1;
      car.rail = { axis: 'v', index: bk, dir };
      car.x = vRoadX(bk) + (dir > 0 ? -LANE : LANE); car.ang = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    }
    car.turnCool = 1;
  }
  const rail = car.rail;
  car.turnCool -= dt;
  // slow for the car ahead on the same lane
  let target = car.cruise;
  for (const o of cars) {
    if (o === car || o.dead) continue;
    const ahead = (o.x - car.x) * Math.cos(car.ang) + (o.y - car.y) * Math.sin(car.ang);
    const side = Math.abs((o.x - car.x) * Math.sin(car.ang) - (o.y - car.y) * Math.cos(car.ang));
    if (ahead > 0 && ahead < 74 && side < 26) target = Math.min(target, Math.max(0, (ahead - 46) * 2.2));
  }
  if (player.car) {
    const ahead = (player.car.x - car.x) * Math.cos(car.ang) + (player.car.y - car.y) * Math.sin(car.ang);
    const side = Math.abs((player.car.x - car.x) * Math.sin(car.ang) - (player.car.y - car.y) * Math.cos(car.ang));
    if (ahead > 0 && ahead < 70 && side < 26) target = 0;
  }
  car.speed = lerp(car.speed, target, clamp(dt * 3, 0, 1));
  car.x += Math.cos(car.ang) * car.speed * dt;
  car.y += Math.sin(car.ang) * car.speed * dt;

  // at an intersection, maybe turn onto the crossing road
  if (car.turnCool <= 0) {
    if (rail.axis === 'h') {
      for (let k = 0; k <= COLS; k++) {
        const ix = vRoadX(k) + (rail.dir > 0 ? -LANE : LANE); // lane line of the crossing road for a right turn feel
        if (Math.abs(car.x - vRoadX(k)) < 8 && Math.abs(car.speed) > 5) {
          const roll = simRng();
          if (roll < 0.34) { // turn north or south onto road k
            const ndir = roll < 0.17 ? 1 : -1;
            car.rail = { axis: 'v', index: k, dir: ndir };
            car.x = vRoadX(k) + (ndir > 0 ? -LANE : LANE);
            car.ang = ndir > 0 ? Math.PI / 2 : -Math.PI / 2;
            car.turnCool = 1.2;
          }
          break;
        }
      }
    } else {
      for (let j = 0; j <= ROWS; j++) {
        if (Math.abs(car.y - hRoadY(j)) < 8 && Math.abs(car.speed) > 5) {
          const roll = simRng();
          if (roll < 0.34) {
            const ndir = roll < 0.17 ? 1 : -1;
            car.rail = { axis: 'h', index: j, dir: ndir };
            car.y = hRoadY(j) + (ndir > 0 ? LANE : -LANE);
            car.ang = ndir > 0 ? 0 : Math.PI;
            car.turnCool = 1.2;
          }
          break;
        }
      }
    }
  }
  // turn around at the world edge instead of leaving Port Azura
  if (car.x < 30 || car.x > WORLD_W - 30 || car.y < 30 || car.y > CITY_H + 60) {
    if (rail.axis === 'h') { rail.dir *= -1; car.y = hRoadY(rail.index) + (rail.dir > 0 ? LANE : -LANE); car.ang = rail.dir > 0 ? 0 : Math.PI; }
    else { rail.dir *= -1; car.x = vRoadX(rail.index) + (rail.dir > 0 ? -LANE : LANE); car.ang = rail.dir > 0 ? Math.PI / 2 : -Math.PI / 2; }
    car.turnCool = 1.5;
  }
}

// ---------------------------------------------------------------- police
function stepPolice(car, dt) {
  if (car.dead) return;
  const tx = player.car ? player.car.x : player.x, ty = player.car ? player.car.y : player.y;
  const want = Math.floor(G.wanted);
  const maxSpeed = 175 + want * 26;
  const desired = Math.atan2(ty - car.y, tx - car.x);
  car.ang += clamp(angDiff(desired, car.ang), -2.6 * dt, 2.6 * dt);
  const d = Math.sqrt(dist2(car.x, car.y, tx, ty));
  const goal = d > 46 ? maxSpeed : maxSpeed * 0.25;
  car.speed = lerp(car.speed, goal, clamp(dt * 1.6, 0, 1));
  const res = collideWorld(car.x + Math.cos(car.ang) * car.speed * dt, car.y + Math.sin(car.ang) * car.speed * dt, car.radius, false);
  if (res.hit) car.speed *= 0.55;
  car.x = res.x; car.y = res.y;

  // bust pressure: close + a slow or foot-bound player
  const playerSpeed = player.car ? Math.abs(player.car.speed) : player.speed;
  if (d < 58 && playerSpeed < 55) G.bust += dt * 0.55;
  else G.bust = Math.max(0, G.bust - dt * 0.3);
  if (G.bust >= 1) triggerBusted();
}

function triggerBusted() {
  G.state = 'busted'; G.stateT = 0; G.bust = 0;
  G.cash = Math.max(0, G.cash - Math.floor(G.cash * 0.15) - 25);
  if (activeMission && activeMission.def.id === 'espresso-run') failMission('busted');
  sfx.sting();
}
function triggerDowned() {
  G.state = 'downed'; G.stateT = 0;
  G.cash = Math.max(0, G.cash - Math.floor(G.cash * 0.10) - 15);
  sfx.sting();
}
function respawn(atPD) {
  if (player.car) { player.car.kind = 'parked'; player.car = null; }
  const pt = atPD ? PD : HOSP;
  player.x = pt.x; player.y = pt.y + 30;
  player.health = 100;
  G.wanted = 0; G.unseenTime = 0; G.bust = 0;
  for (const c of cars) if (c.kind === 'police') { c.kind = 'traffic'; c.rail = null; c.wp = null; c.color = CAR_COLORS[srange(CAR_COLORS.length)]; }
  G.state = 'play';
}

// ---------------------------------------------------------------- peds
function stepPed(ped, dt) {
  if (ped.state === 'down') {
    ped.downT -= dt;
    if (ped.downT <= 0) { ped.state = 'walk'; ped.target = pedWaypoint(ped); }
    return;
  }
  ped.thinkT -= dt;
  // threats: a fast car nearby, or a wanted player on foot
  let threat = null;
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  if (player.car && Math.abs(player.car.speed) > 60 && dist2(ped.x, ped.y, px, py) < 130 * 130) threat = { x: px, y: py };
  else if (!player.car && G.wanted > 0 && dist2(ped.x, ped.y, px, py) < 95 * 95) threat = { x: px, y: py };
  if (threat) ped.state = 'flee';
  else if (ped.state === 'flee' && ped.thinkT <= 0) ped.state = 'walk';

  if (ped.state === 'flee' && threat) {
    const away = Math.atan2(ped.y - threat.y, ped.x - threat.x);
    ped.ang = away; ped.speed = 205;
    ped.thinkT = 0.7;
  } else {
    if (!ped.target || dist2(ped.x, ped.y, ped.target.x, ped.target.y) < 18 * 18) ped.target = pedWaypoint(ped);
    ped.ang = Math.atan2(ped.target.y - ped.y, ped.target.x - ped.x);
    ped.speed = 62;
  }
  const res = collideWorld(ped.x + Math.cos(ped.ang) * ped.speed * dt, ped.y + Math.sin(ped.ang) * ped.speed * dt, ped.radius, true);
  ped.x = res.x; ped.y = res.y;
}

// ------------------------------------------------------- car interactions
function stepCarContacts(dt) {
  const pc = player.car;
  // car vs car: soft push-apart, damage on hard hits
  for (const c of cars) {
    if (c.dead) continue;
    for (const o of cars) {
      if (o === c || o.dead) continue;
      const d2 = dist2(c.x, c.y, o.x, o.y), min = c.radius + o.radius;
      if (d2 < min * min && d2 > 0.01) {
        const d = Math.sqrt(d2), push = (min - d) / 2;
        const ux = (c.x - o.x) / d, uy = (c.y - o.y) / d;
        if (c.kind !== 'parked' && c.kind !== 'mission') { c.x += ux * push; c.y += uy * push; }
        if (o.kind !== 'parked' && o.kind !== 'mission') { o.x -= ux * push; o.y -= uy * push; }
        const rel = Math.abs(c.speed) + Math.abs(o.speed);
        if (rel > 150 && (c === pc || o === pc)) {
          damageCar(c === pc ? c : o, 4, true);
          if (o.kind === 'police' || c.kind === 'police') commitCrime(1, pc.x, pc.y);
        }
      }
    }
    // traffic/police nudging the foot player is handled below
  }
  // cars vs peds
  for (const c of cars) {
    if (c.dead || Math.abs(c.speed) < 55) continue;
    for (const p of peds) {
      if (p.state === 'down') continue;
      if (dist2(c.x, c.y, p.x, p.y) < (c.radius + p.radius) * (c.radius + p.radius)) {
        p.state = 'down'; p.downT = 6;
        if (c === pc) { commitCrime(1, p.x, p.y); player.health -= 2; }
        sfx.thud();
      }
    }
  }
  // cars vs the on-foot player
  if (!player.car) {
    for (const c of cars) {
      if (c.dead || Math.abs(c.speed) < 40) continue;
      if (dist2(c.x, c.y, player.x, player.y) < (c.radius + player.radius) * (c.radius + player.radius)) {
        player.health -= Math.abs(c.speed) * 0.16;
        const away = Math.atan2(player.y - c.y, player.x - c.x);
        player.x += Math.cos(away) * 26; player.y += Math.sin(away) * 26;
        G.shake = 5; sfx.thud();
        if (player.health <= 0) { player.health = 0; triggerDowned(); }
      }
    }
  }
}

// ---------------------------------------------------------------- step
function step(dt) {
  G.time += dt;
  if (G.bannerT > 0) G.bannerT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 9);
  if (G.state !== 'play') { G.stateT += dt; pressedE = false; pressedEnter = false; return; }
  if (player.car) stepPlayerDriving(dt); else stepPlayerOnFoot(dt);
  for (const c of cars) {
    if (c.kind === 'traffic') stepTraffic(c, dt);
    else if (c.kind === 'police') stepPolice(c, dt);
  }
  for (const p of peds) stepPed(p, dt);
  stepCarContacts(dt);
  stepWanted(dt);
  stepMission(dt);
  // slow health regen keeps the loop forgiving
  if (player.health > 0 && player.health < 100) player.health = Math.min(100, player.health + dt * 1.6);
  pressedE = false; pressedEnter = false;
}

// -------------------------------------------------------------- rendering
let camX = 0, camY = 0;
function updateCamera() {
  const tx = player.car ? player.car.x : player.x, ty = player.car ? player.car.y : player.y;
  camX = clamp(tx - VIEW_W / 2, 0, Math.max(0, WORLD_W - VIEW_W));
  camY = clamp(ty - VIEW_H / 2, 0, Math.max(0, WORLD_H - VIEW_H));
  if (G.shake > 0) {
    camX += Math.sin(G.time * 51) * G.shake;
    camY += Math.cos(G.time * 43) * G.shake;
  }
}
function text(str, x, y, size, color, align, weight) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui, sans-serif';
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawWorld() {
  // sea
  const seaGrad = ctx.createLinearGradient(0, SEA_Y - camY, 0, WORLD_H - camY);
  seaGrad.addColorStop(0, '#3d9bc4'); seaGrad.addColorStop(1, '#1f6391');
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, SEA_Y - camY, VIEW_W, WORLD_H - SEA_Y + camY + 720);
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let wx = 40; wx < WORLD_W; wx += 130) {
    for (let wy = SEA_Y + 42; wy < WORLD_H - 20; wy += 74) {
      const sx = wx - camX + Math.sin(wy * 0.05 + wx) * 6, sy = wy - camY;
      if (sx < -40 || sx > VIEW_W + 40 || sy < -20 || sy > VIEW_H + 20) continue;
      ctx.moveTo(sx - 13, sy); ctx.quadraticCurveTo(sx, sy - 6, sx + 13, sy);
    }
  }
  ctx.stroke();
  // beach
  ctx.fillStyle = '#ecd9a0';
  ctx.fillRect(-camX, CITY_H - camY, WORLD_W, BEACH_H + 6);
  ctx.fillStyle = 'rgba(190,160,90,0.35)';
  for (let i = 0; i < 26; i++) {
    const dx = ((i * 733) % WORLD_W) - camX, dy = CITY_H + 18 + ((i * 389) % (BEACH_H - 30)) - camY;
    ctx.beginPath(); ctx.ellipse(dx, dy, 16, 4, 0, 0, TAU); ctx.fill();
  }
  // city ground (sidewalks / block base)
  ctx.fillStyle = '#9aa0a3';
  ctx.fillRect(-camX, -camY, CITY_W, CITY_H);
  // roads
  ctx.fillStyle = '#3b4046';
  for (let k = 0; k <= COLS; k++) ctx.fillRect(vRoadX(k) - ROAD / 2 - camX, -camY, ROAD, CITY_H);
  for (let j = 0; j <= ROWS; j++) ctx.fillRect(-camX, hRoadY(j) - ROAD / 2 - camY, CITY_W, ROAD);
  // lane dashes
  ctx.strokeStyle = 'rgba(240,220,120,0.55)'; ctx.lineWidth = 3; ctx.setLineDash([22, 26]);
  ctx.beginPath();
  for (let k = 0; k <= COLS; k++) { ctx.moveTo(vRoadX(k) - camX, -camY); ctx.lineTo(vRoadX(k) - camX, CITY_H - camY); }
  for (let j = 0; j <= ROWS; j++) { ctx.moveTo(-camX, hRoadY(j) - camY); ctx.lineTo(CITY_W - camX, hRoadY(j) - camY); }
  ctx.stroke(); ctx.setLineDash([]);
  // blocks
  for (const blk of blocks) {
    const bx = blockX(blk.c) - camX, by = blockY(blk.r) - camY;
    if (bx > VIEW_W || by > VIEW_H || bx + BLOCK < 0 || by + BLOCK < 0) continue;
    if (blk.kind === 'park') {
      ctx.fillStyle = '#69a862'; ctx.fillRect(bx, by, BLOCK, BLOCK);
      ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(bx + 8, by + 8, BLOCK - 16, BLOCK - 16);
    } else if (blk.kind === 'parking') {
      ctx.fillStyle = '#565d64'; ctx.fillRect(bx, by, BLOCK, BLOCK);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.strokeRect(bx + 20 + i * 52, by + 26, 44, 62);
        ctx.strokeRect(bx + 20 + i * 52, by + BLOCK - 88, 44, 62);
      }
    } else {
      ctx.fillStyle = '#b9b3a4'; ctx.fillRect(bx, by, BLOCK, BLOCK);
    }
    for (const t of blk.trees) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath(); ctx.ellipse(t.x - camX + 4, t.y - camY + 6, t.r, t.r * 0.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2f7d3a';
      ctx.beginPath(); ctx.arc(t.x - camX, t.y - camY, t.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3f9e4d';
      ctx.beginPath(); ctx.arc(t.x - camX - 3, t.y - camY - 3, t.r * 0.6, 0, TAU); ctx.fill();
    }
    for (const b of blk.buildings) {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(b.x - camX + 7, b.y - camY + 9, b.w, b.h);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - camX, b.y - camY, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      ctx.fillRect(b.x - camX + b.roof, b.y - camY + b.roof, b.w - b.roof * 2, b.h - b.roof * 2);
      ctx.fillStyle = 'rgba(40,60,90,0.35)';
      const cols = Math.floor(b.w / 26), rowsN = Math.floor(b.h / 26);
      for (let i = 0; i < cols; i++) for (let j2 = 0; j2 < rowsN; j2++) {
        if ((i * 7 + j2 * 13 + blk.c + blk.r) % 3 === 0) continue;
        ctx.fillRect(b.x - camX + 10 + i * 26, b.y - camY + 10 + j2 * 26, 12, 14);
      }
    }
  }
  // special buildings' signs
  drawSign(CAFE.x, blockY(CAFE_BLOCK.r) + 30, 'CAFÉ AZUL', '#0d5e73');
  drawSign(PD.x, blockY(PD_BLOCK.r) + 30, 'POLICE', '#22335c');
  drawSign(HOSP.x, blockY(HOSP_BLOCK.r) + 30, 'ST. AZURA HOSPITAL', '#a33327');
  // piers
  for (const p of PIERS) {
    ctx.fillStyle = '#8a6844';
    ctx.fillRect(p.x - camX, p.y - camY, p.w, p.h);
    ctx.strokeStyle = 'rgba(60,40,20,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let y = p.y + 12; y < p.y + p.h; y += 18) { ctx.moveTo(p.x - camX, y - camY); ctx.lineTo(p.x + p.w - camX, y - camY); }
    ctx.stroke();
    ctx.fillStyle = '#5d422a';
    ctx.fillRect(p.x - camX - 4, p.y - camY, 6, p.h); ctx.fillRect(p.x + p.w - camX - 2, p.y - camY, 6, p.h);
  }
  // dock crates
  ctx.fillStyle = '#b07a3f';
  ctx.fillRect(DOCK_CRATE.x - 13 - camX, DOCK_CRATE.y - 13 - camY, 26, 26);
  ctx.strokeStyle = '#6e4a22'; ctx.lineWidth = 3;
  ctx.strokeRect(DOCK_CRATE.x - 13 - camX, DOCK_CRATE.y - 13 - camY, 26, 26);
  ctx.fillStyle = '#caa06a';
  ctx.fillRect(DOCK.x - 40 - camX, DOCK.y + 26 - camY, 20, 16);
  ctx.fillRect(DOCK.x + 26 - camX, DOCK.y + 34 - camY, 16, 13);
}
function drawSign(x, y, label, color) {
  const sx = x - camX, sy = y - camY;
  if (sx < -120 || sx > VIEW_W + 120 || sy < -30 || sy > VIEW_H + 30) return;
  ctx.font = 'bold 15px system-ui, sans-serif';
  const w = ctx.measureText(label).width + 18;
  ctx.fillStyle = color;
  roundRect(sx - w / 2, sy - 12, w, 24, 5); ctx.fill();
  text(label, sx, sy + 1, 15, '#ffffff', 'center');
}

function drawCar(car) {
  const sx = car.x - camX, sy = car.y - camY;
  if (sx < -70 || sx > VIEW_W + 70 || sy < -70 || sy > VIEW_H + 70) return;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(car.ang);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  roundRect(-20, -8, 46, 24, 7); ctx.fill();
  ctx.fillStyle = car.dead ? '#2b2b2e' : car.color;
  roundRect(-23, -12, 46, 24, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(-4, -9, 17, 18, 4); ctx.fill();           // cabin
  ctx.fillStyle = 'rgba(170,220,255,0.75)';
  roundRect(-2, -8, 5, 16, 2); ctx.fill();            // windshield
  ctx.fillStyle = '#1c1e22';
  ctx.fillRect(-17, -14, 9, 4); ctx.fillRect(8, -14, 9, 4);
  ctx.fillRect(-17, 10, 9, 4); ctx.fillRect(8, 10, 9, 4);
  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(21, -9, 3, 5); ctx.fillRect(21, 4, 3, 5);
  if (car.kind === 'police') {
    ctx.fillStyle = '#f2f2f2'; ctx.fillRect(-14, -12, 12, 24);
    const phase = Math.floor(G.time * 4) % 2;
    ctx.fillStyle = phase ? '#ff3b30' : '#3b82f6';
    roundRect(-6, -7, 9, 5, 2); ctx.fill();
    ctx.fillStyle = phase ? '#3b82f6' : '#ff3b30';
    roundRect(-6, 2, 9, 5, 2); ctx.fill();
  }
  if (car.kind === 'mission') {
    ctx.fillStyle = '#fff3c4'; ctx.fillRect(-16, -3, 30, 6);
  }
  ctx.restore();
  // damage smoke / fire, in screen space so it stays round
  if (!car.dead && car.health < 45) {
    ctx.fillStyle = 'rgba(120,120,120,0.4)';
    const puffs = 2 + Math.floor((45 - car.health) / 15);
    for (let i = 0; i < puffs; i++) {
      const off = (G.time * 22 + i * 17) % 26;
      ctx.beginPath(); ctx.arc(sx + 14 - off * 0.4, sy - 8 - off, 4 + off * 0.3, 0, TAU); ctx.fill();
    }
  } else if (car.dead) {
    ctx.fillStyle = 'rgba(255,120,30,' + (0.55 + 0.3 * Math.sin(G.time * 23 + car.id)) + ')';
    ctx.beginPath(); ctx.arc(sx + 6, sy - 4, 8 + Math.sin(G.time * 29 + car.id) * 2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,60,0.8)';
    ctx.beginPath(); ctx.arc(sx + 6, sy - 4, 4.5, 0, TAU); ctx.fill();
  }
}

function drawPed(p, isPlayer) {
  const sx = p.x - camX, sy = p.y - camY;
  if (sx < -30 || sx > VIEW_W + 30 || sy < -30 || sy > VIEW_H + 30) return;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 7, 8, 3.5, 0, 0, TAU); ctx.fill();
  if (p.state === 'down' && !isPlayer) {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(Math.PI / 2);
    ctx.fillStyle = p.shirt; roundRect(-8, -5, 16, 10, 4); ctx.fill();
    ctx.fillStyle = p.skin; ctx.beginPath(); ctx.arc(11, 0, 4.5, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }
  const stride = p.speed > 5 ? Math.sin(G.time * 11 + p.x * 0.05) * 3 : 0;
  ctx.strokeStyle = '#2c3242'; ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.moveTo(sx, sy + 3); ctx.lineTo(sx + Math.cos(p.ang) * 2 + stride * Math.cos(p.ang + Math.PI / 2), sy + 9);
  ctx.moveTo(sx, sy + 3); ctx.lineTo(sx + Math.cos(p.ang) * 2 - stride * Math.cos(p.ang + Math.PI / 2), sy + 9);
  ctx.stroke();
  ctx.fillStyle = isPlayer ? '#ffd23e' : p.shirt;
  ctx.beginPath(); ctx.arc(sx, sy, 7.5, 0, TAU); ctx.fill();
  ctx.fillStyle = isPlayer ? '#8a5a2b' : p.skin;
  ctx.beginPath(); ctx.arc(sx + Math.cos(p.ang) * 2.5, sy + Math.sin(p.ang) * 2.5, 4.4, 0, TAU); ctx.fill();
  if (isPlayer) {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 11.5, 0, TAU); ctx.stroke();
  }
}

function drawMarkers() {
  // contacts: bobbing cyan diamonds with a $ 
  for (const [pt] of [[DOCK], [CAFE]]) {
    const sx = pt.x - camX, sy = pt.y - camY - 26 + Math.sin(G.time * 3 + pt.x) * 4;
    if (sx < -30 || sx > VIEW_W + 30 || sy < -40 || sy > VIEW_H + 30) continue;
    ctx.fillStyle = '#19c2d8';
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(Math.PI / 4);
    ctx.fillRect(-8, -8, 16, 16); ctx.restore();
    text('$', sx, sy + 1, 15, '#ffffff', 'center');
  }
  // active mission marker: gold beam + diamond
  const mk = missionMarker();
  if (mk) {
    const sx = mk.x - camX, sy = mk.y - camY;
    const grad = ctx.createLinearGradient(0, sy - 190, 0, sy);
    grad.addColorStop(0, 'rgba(255,200,40,0)'); grad.addColorStop(1, 'rgba(255,200,40,0.30)');
    ctx.fillStyle = grad;
    ctx.fillRect(sx - 13, sy - 190, 26, 190);
    const bob = Math.sin(G.time * 3.4) * 5;
    ctx.fillStyle = '#ffc828';
    ctx.save(); ctx.translate(sx, sy - 30 + bob); ctx.rotate(Math.PI / 4);
    ctx.fillRect(-9, -9, 18, 18); ctx.restore();
    ctx.strokeStyle = 'rgba(255,200,40,0.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy, 20 + Math.sin(G.time * 3.4) * 3, 0, TAU); ctx.stroke();
  }
}

function drawMinimap() {
  const MW = 176, MH = 198, MX = VIEW_W - MW - 14, MY = VIEW_H - MH - 14;
  const sx = MW / WORLD_W, sy = MH / WORLD_H;
  ctx.fillStyle = 'rgba(10,18,28,0.72)';
  roundRect(MX - 4, MY - 4, MW + 8, MH + 8, 8); ctx.fill();
  ctx.fillStyle = '#2e86ab'; ctx.fillRect(MX, MY, MW, MH);
  ctx.fillStyle = '#8f979c'; ctx.fillRect(MX, MY, CITY_W * sx, CITY_H * sy);
  ctx.fillStyle = '#ecd9a0'; ctx.fillRect(MX, MY + CITY_H * sy, MW, BEACH_H * sy);
  ctx.strokeStyle = 'rgba(30,34,40,0.8)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let k = 0; k <= COLS; k++) { ctx.moveTo(MX + vRoadX(k) * sx, MY); ctx.lineTo(MX + vRoadX(k) * sx, MY + CITY_H * sy); }
  for (let j = 0; j <= ROWS; j++) { ctx.moveTo(MX, MY + hRoadY(j) * sy); ctx.lineTo(MX + CITY_W * sx, MY + hRoadY(j) * sy); }
  ctx.stroke();
  const dot = (x, y, color, r) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(MX + x * sx, MY + y * sy, r, 0, TAU); ctx.fill(); };
  dot(DOCK.x, DOCK.y, '#19c2d8', 3); dot(CAFE.x, CAFE.y, '#19c2d8', 3);
  for (const c of cars) if (c.kind === 'police') dot(c.x, c.y, Math.floor(G.time * 4) % 2 ? '#ff5147' : '#5ea0ff', 3);
  const mk = missionMarker();
  if (mk) dot(mk.x, mk.y, '#ffc828', 4);
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  dot(px, py, '#ffffff', 4);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(MX + px * sx, MY + py * sy, 6.5, 0, TAU); ctx.stroke();
}

function drawHUD() {
  // top bar
  ctx.fillStyle = 'rgba(10,16,24,0.66)';
  ctx.fillRect(0, 0, VIEW_W, 52);
  text('$ ' + G.cash.toLocaleString('en-US'), 18, 27, 24, '#7be382', 'left');
  // health
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(150, 18, 170, 17, 5); ctx.fill();
  ctx.fillStyle = player.health > 30 ? '#58c96b' : '#e5484d';
  if (player.health > 0) { roundRect(150, 18, 170 * player.health / 100, 17, 5); ctx.fill(); }
  text('HP', 162, 27, 12, '#ffffff', 'left');
  if (player.car) {
    const dmg = Math.max(0, Math.round(player.car.health));
    text('RIDE ' + dmg + '%   ' + Math.abs(Math.round(player.car.speed * 0.24)) + ' mph', 345, 27, 16, '#cfe3ff', 'left');
  }
  // wanted stars
  for (let i = 0; i < 5; i++) {
    text('★', VIEW_W - 30 - i * 30, 27, 26, i < Math.floor(G.wanted) ? '#ffc828' : 'rgba(255,255,255,0.22)', 'center');
  }
  // bust meter
  if (G.bust > 0.02) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(VIEW_W / 2 - 130, 62, 260, 20, 7); ctx.fill();
    ctx.fillStyle = '#e5484d';
    roundRect(VIEW_W / 2 - 126, 66, 252 * clamp(G.bust, 0, 1), 12, 5); ctx.fill();
    text('BUSTED?', VIEW_W / 2, 100, 15, '#ff7a72', 'center');
  }
  // mission panel
  if (activeMission) {
    const def = activeMission.def, st = def.steps[activeMission.step];
    ctx.fillStyle = 'rgba(10,16,24,0.60)';
    roundRect(14, 62, 430, def.timeLimit ? 66 : 48, 8); ctx.fill();
    text(def.name.toUpperCase(), 26, 79, 14, '#ffc828', 'left');
    text(st.label, 26, 100, 14, '#ffffff', 'left', 'normal');
    if (def.timeLimit) {
      const left = Math.max(0, def.timeLimit - activeMission.t);
      text('⏱ ' + Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0'), 26, 119, 13, left < 25 ? '#ff7a72' : '#cfe3ff', 'left');
    }
  }
  // banner toast
  if (G.bannerT > 0 && G.banner) {
    ctx.font = 'bold 17px system-ui, sans-serif';
    const w = ctx.measureText(G.banner).width + 36;
    ctx.fillStyle = 'rgba(10,16,24,0.78)';
    roundRect(VIEW_W / 2 - w / 2, 118, w, 34, 9); ctx.fill();
    text(G.banner, VIEW_W / 2, 136, 17, '#ffe9a8', 'center');
  }
  // hint
  if (G.hint) {
    ctx.font = '15px system-ui, sans-serif';
    const w = ctx.measureText(G.hint).width + 30;
    ctx.fillStyle = 'rgba(10,16,24,0.70)';
    roundRect(VIEW_W / 2 - w / 2, VIEW_H - 46, w, 30, 8); ctx.fill();
    text(G.hint, VIEW_W / 2, VIEW_H - 30, 15, '#ffffff', 'center', 'normal');
  }
  if (muted) text('MUTED (M)', VIEW_W - 16, VIEW_H - 18, 12, 'rgba(255,255,255,0.6)', 'right', 'normal');
}

function drawScreens() {
  if (G.state === 'title') {
    const grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    grad.addColorStop(0, 'rgba(8,14,24,0.62)'); grad.addColorStop(0.55, 'rgba(8,14,24,0.30)'); grad.addColorStop(1, 'rgba(8,14,24,0.72)');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    text('AZURA HEAT', VIEW_W / 2, 218, 92, '#ffc828', 'center');
    text('P O R T   A Z U R A', VIEW_W / 2, 282, 25, '#aee6ff', 'center', 'normal');
    text('Run crates, lift convertibles, and stay one corner ahead of the Port Azura PD.', VIEW_W / 2, 330, 18, '#ffffff', 'center', 'normal');
    const pulse = 0.65 + 0.35 * Math.sin(G.time * 3.2);
    ctx.globalAlpha = pulse;
    text('PRESS ENTER TO PLAY', VIEW_W / 2, 428, 23, '#ffffff', 'center');
    ctx.globalAlpha = 1;
    text('WASD / arrows — move & drive      E — enter car / talk      P — pause      M — mute', VIEW_W / 2, 486, 16, 'rgba(255,255,255,0.85)', 'center', 'normal');
    text('Three jobs are waiting: two at The Docks, one at Café Azul. Follow the gold marker.', VIEW_W / 2, 518, 16, 'rgba(255,255,255,0.7)', 'center', 'normal');
  } else if (G.state === 'pause') {
    ctx.fillStyle = 'rgba(8,12,20,0.55)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    text('PAUSED', VIEW_W / 2, VIEW_H / 2 - 10, 54, '#ffffff', 'center');
    text('Press P to keep driving', VIEW_W / 2, VIEW_H / 2 + 42, 17, 'rgba(255,255,255,0.8)', 'center', 'normal');
  } else if (G.state === 'busted') {
    ctx.fillStyle = 'rgba(90,10,10,0.52)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    text('BUSTED', VIEW_W / 2, 268, 84, '#ff5147', 'center');
    text('The Port Azura PD thanks you for your donation to the widows-and-orphans fund.', VIEW_W / 2, 336, 17, '#ffffff', 'center', 'normal');
    text('Press ENTER to leave the station', VIEW_W / 2, 396, 18, '#ffd9d6', 'center');
  } else if (G.state === 'downed') {
    ctx.fillStyle = 'rgba(20,8,8,0.62)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    text('DOWNED', VIEW_W / 2, 268, 84, '#e8e4da', 'center');
    text('St. Azura Hospital patched you up. The bill stings worse than the stitches.', VIEW_W / 2, 336, 17, '#ffffff', 'center', 'normal');
    text('Press ENTER to check out', VIEW_W / 2, 396, 18, '#ffd9d6', 'center');
  } else if (G.state === 'complete' && G.completeInfo) {
    ctx.fillStyle = 'rgba(24,20,6,0.55)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    text('MISSION COMPLETE', VIEW_W / 2, 258, 58, '#ffc828', 'center');
    text(G.completeInfo.name, VIEW_W / 2, 322, 26, '#ffffff', 'center');
    text('+$' + G.completeInfo.reward, VIEW_W / 2, 362, 30, '#7be382', 'center');
    text('Press ENTER to keep rolling', VIEW_W / 2, 424, 17, 'rgba(255,255,255,0.85)', 'center', 'normal');
  }
}

function render() {
  updateCamera();
  ctx.fillStyle = '#1f6391';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  drawWorld();
  drawMarkers();
  for (const c of cars) drawCar(c);
  for (const p of peds) drawPed(p, false);
  if (!player.car) drawPed({ x: player.x, y: player.y, ang: player.ang, speed: player.speed, skin: '#8a5a2b', shirt: '#ffd23e', state: 'walk' }, true);
  if (G.state === 'play' || G.state === 'pause') { drawMinimap(); drawHUD(); }
  drawScreens();
}

// ------------------------------------------------------------ main loop
function handleScreenKeys() {
  if (!pressedEnter) return;
  if (G.state === 'title') { G.state = 'play'; pressedEnter = false; sfx.click(); }
  else if (G.state === 'busted' && G.stateT > 0.4) { respawn(true); pressedEnter = false; }
  else if (G.state === 'downed' && G.stateT > 0.4) { respawn(false); pressedEnter = false; }
  else if (G.state === 'complete' && G.stateT > 0.3) { G.state = 'play'; G.completeInfo = null; pressedEnter = false; }
}

let lastTs = 0, accumulator = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.1) dt = 0.1;
  accumulator += dt;
  handleScreenKeys();
  while (accumulator >= STEP) { step(STEP); accumulator -= STEP; }
  render();
}

// ------------------------------------------------------------ shot mode
// Deterministic scenes for screenshots: fixed steps, seeded RNG, no input.
// The autopilot drives the player's car by rewriting the shared input.
let autopilotFn = null;
const _origStepDriving = stepPlayerDriving;
stepPlayerDriving = function (dt) {
  if (!autopilotFn) { _origStepDriving(dt); return; }
  const car = player.car;
  readInput();
  autopilotFn(input, car);
  G.hint = '';
  driveCar(car, input, dt);
  player.x = car.x; player.y = car.y; player.ang = car.ang;
};

function runSteps(n) { for (let i = 0; i < n; i++) step(STEP); }

function setupShotStart() {
  runSteps(100); // let traffic and peds settle into the title vista
  G.state = 'title'; G.stateT = 0;
}

function setupShotPlay() {
  // mid-job: crate aboard, heading for Café Azul, two stars of company
  startMission(MISSIONS[0]);
  activeMission.step = 1;
  const car = cars.find(c => c.kind === 'parked');
  car.x = 240; car.y = hRoadY(3) + LANE; car.ang = 0; car.health = 92;
  player.x = car.x; player.y = car.y;
  enterCar(car);
  G.wanted = 2; G.unseenTime = 0; G.crimeMute = true;
  // one long straight blast east along the avenue: no corners to clip
  const route = [{ x: WORLD_W - 90, y: hRoadY(3) + LANE }];
  let wp = 0;
  autopilotFn = (inp, c) => {
    const t = route[Math.min(wp, route.length - 1)];
    if (dist2(c.x, c.y, t.x, t.y) < 70 * 70 && wp < route.length - 1) wp++;
    const want = Math.atan2(t.y - c.y, t.x - c.x);
    const d = angDiff(want, c.ang);
    inp.up = true; inp.down = false;
    inp.left = d < -0.06; inp.right = d > 0.06;
  };
  runSteps(330);
  autopilotFn = null;
  G.crimeMute = false;
  if (G.state !== 'play') { G.state = 'play'; } // a freak bust shouldn't change the scene's story
  banner('Deliver the crate to Café Azul', 999);
}

function setupShotEnd() {
  missionState['fresh-catch'] = 'done';
  G.cash = 120 + 300;
  player.x = CAFE.x - 34; player.y = CAFE.y + 4; player.ang = Math.PI;
  runSteps(50);
  G.completeInfo = { name: 'Fresh Catch', reward: 300 };
  G.state = 'complete'; G.stateT = 1;
}

if (IN_SHOT) {
  if (SHOT === 'start') setupShotStart();
  else if (SHOT === 'play') setupShotPlay();
  else setupShotEnd();
  render();
  window.__shotReady = true;
} else {
  requestAnimationFrame(frame);
}
</script>
