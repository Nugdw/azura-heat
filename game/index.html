<style>
  html, body { margin: 0; padding: 0; background: #05070b; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; display: block;
           background: #0d1420; box-shadow: 0 0 70px rgba(0,0,0,.85); }
</style>

<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
/* =====================================================================
   AZURA HEAT — ROUND 4
   An original top-down open-world crime game set in Port Azura, a
   fictional coastal city: 6x5 blocks, one long beach, a pier, and a
   police force with strong opinions about your driving.

   Round 4 adds, on top of the round-3 city (day-night cycle, four
   missions including Sunset Taxi Run, 12 cash coins, 24 citizens,
   taxis & vans, sprint + stamina, horn, WebAudio, minimap v2, score):
     - a real pause menu (P / Esc) that freezes the simulation and
       summarises missions done, coins, cash, score and the day
     - a persistent best score in localStorage, shown on the title
       screen and again on the mission-complete screen
     - a repeatable side hustle, Paket Pantai (Beach Parcel): grab a
       parcel at a glowing pickup, race it to the drop-off before the
       timer dies, get paid in cash and score, then a fresh random run
     - a simple radio (R) with three stops — off, synthwave, chill —
       all procedural WebAudio note patterns, no audio files at all
     - fairer heat: wanted stars now bleed away slowly while no police
       unit has eyes on you for a few seconds (stay out of sight)

   Round 3 added, on top of the round-2 core (traffic, pedestrians,
   0-5 star wanted system, bust/hospital loop, fixed-step simulation):
     - a full day-night cycle (sun, dusk glow, streetlights, lit windows)
     - a 4th mission: Sunset Taxi Run, from a new Beach Kiosk contact
     - 12 collectible cash coins hidden around the city
     - more citizens: joggers, beachgoers, speech bubbles
     - taxi + van traffic variants, sprinting with stamina, car horn
     - WebAudio v2: engine hum, sirens, horn, jingles, wave ambience
     - a bigger minimap (coins, compass, clock) and a score system
     - viewport culling so off-screen objects are never drawn

   Vanilla JS + Canvas 2D. No assets, no network, no build step.
   Simulation runs on a fixed 1/60 timestep; every random draw comes
   from one mulberry32 stream, so a seeded scene is reproducible
   (see the ?shot= mode at the bottom of this file).
   ===================================================================== */

// ---------- tiny utilities ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };
function angWrap(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function turnToward(a, want, maxDelta) { return a + clamp(angWrap(want - a), -maxDelta, maxDelta); }

// ---------- canvas ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VW = 1280, VH = 720;
const STEP = 1 / 60;

// ---------- world layout ----------
// Port Azura: a 6 x 5 grid of city blocks wrapped by roads, a sandy
// beach along the south edge and the sea beyond it.
const ROAD = 88, BLOCK = 240, PITCH = ROAD + BLOCK;      // 328
const COLS = 6, ROWS = 5;
const CITY_W = COLS * BLOCK + (COLS + 1) * ROAD;          // 2056
const CITY_H = ROWS * BLOCK + (ROWS + 1) * ROAD;          // 1728
const SAND = 170, SEA = 250;
const WORLD_W = CITY_W;                                    // 2056
const WORLD_H = CITY_H + SAND + SEA;                       // 2148
const VX = [], HY = [];                                    // road centre lines
for (let i = 0; i <= COLS; i++) VX.push(ROAD / 2 + i * PITCH);
for (let j = 0; j <= ROWS; j++) HY.push(ROAD / 2 + j * PITCH);
const PIER = { x: 124, y: CITY_H + 108, w: 72, h: SEA + 58 };  // wooden pier into the sea

// ---------- day-night ----------
// One full day lasts DAY_SECONDS of play. timeOfDay is 0..1 where
// 0.00 = midnight, 0.25 = 06:00 sunrise, 0.50 = noon, 0.75 = sunset.
const DAY_SECONDS = 240;
function sunElevation(tod) { return -Math.cos(tod * Math.PI * 2); }
function darkness(tod) { return clamp(0.30 - sunElevation(tod) * 0.58, 0, 0.66); }
function clockText(tod) {
  const mins = Math.floor(tod * 24 * 60);
  const hh = String(Math.floor(mins / 60)).padStart(2, '0');
  const mm = String(mins % 60).padStart(2, '0');
  return hh + ':' + mm;
}

// ---------- contacts & missions ----------
const CONTACTS = {
  docks: { x: 168, y: CITY_H + 66, name: 'THE DOCKS', who: 'Marlo the fixer' },
  cafe:  { x: VX[4], y: HY[2] + 70, name: 'CAFÉ AZUL', who: 'Inés the barista' },
  beach: { x: 940, y: CITY_H + 64, name: 'BEACH KIOSK', who: 'Lia at the kiosk' },
};
const MISSIONS = [
  { id: 'cargo', contact: 'docks', name: 'Harbor Cargo', pay: 300, time: 150,
    blurb: 'A crate is waiting at the end of the pier. Take it to the depot up north.',
    stages: [
      { x: 160, y: CITY_H + SAND + 132, label: 'Pick up the crate at the pier' },
      { x: VX[6], y: HY[1], label: 'Deliver the crate to the north depot' },
    ] },
  { id: 'rush', contact: 'cafe', name: 'Azul Coffee Rush', pay: 250, time: 120,
    blurb: 'Three cafés across town need beans before the rush. Hit every stop.',
    stages: [
      { x: VX[1], y: HY[3], label: 'Coffee stop 1 of 3 — south-west' },
      { x: VX[3], y: HY[1], label: 'Coffee stop 2 of 3 — mid-town' },
      { x: VX[5], y: HY[4], label: 'Coffee stop 3 of 3 — south-east' },
    ] },
  { id: 'joyride', contact: 'docks', name: 'The Convertible Job', pay: 400, time: 180, carJob: true,
    blurb: 'A red convertible is parked mid-town. Bring it to the docks garage. Intact-ish.',
    stages: [
      { car: true, label: 'Steal the red convertible' },
      { x: 318, y: CITY_H + 74, label: 'Bring the convertible to the docks garage' },
    ] },
  { id: 'taxi', contact: 'beach', name: 'Sunset Taxi Run', pay: 350, time: 140,
    blurb: 'Lia\'s cousin is stranded on the beachfront and late for a hospital shift. Cab it.',
    stages: [
      { x: VX[5], y: CITY_H + 84, label: 'Pick up the passenger on the beachfront' },
      { x: VX[6], y: HY[4] + 40, label: 'Drop them at St. Azura General' },
    ] },
];
const RESPAWN = {
  police: { x: VX[0], y: 210 },
  hospital: { x: VX[6], y: HY[4] + 40 },
};

// ---------- palettes ----------
const ROOF_COLORS = ['#b5543c', '#c96f4a', '#8f5f9e', '#4a7fb5', '#53a08a', '#c2a15c', '#7a6a5f', '#a34d68', '#5d8a4a', '#946846'];
const CAR_COLORS = ['#d64541', '#3f6fd8', '#e8b93c', '#39b56a', '#e6e6e6', '#2b2f36', '#8e44ad', '#e67e22', '#1abc9c', '#c0c6cc'];
const PED_COLORS = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#e67e22', '#ecf0f1', '#fd79a8', '#81ecec'];
const PED_LINES = ['Nice day for it.', 'Watch the pier gulls!', 'Coffee at Azul. Trust me.', 'Rentals? That way.',
  'I saw nothing.', 'The PD is hiring, apparently.', 'Beach closes at dusk. Allegedly.', 'Mind the convertible.'];

// ---------- game state ----------
const Q = new URLSearchParams(location.search);
const SHOT = Q.get('shot');                       // null | 'start' | 'play' | 'end'
const SEED = (() => { const n = parseInt(Q.get('seed') || '1', 10); return Number.isFinite(n) ? n : 1; })();
const SHOTMODE = SHOT === 'start' || SHOT === 'play' || SHOT === 'end';
let rng = mulberry32(SHOTMODE ? SEED : (Date.now() % 1000003) + 11);

const S = {
  mode: 'title',            // title | playing | paused | busted | downed | complete
  steps: 0,
  cash: 20,
  score: 0,
  heat: 0,                  // 0..599, stars = floor(heat/120)
  lastCrime: -9999,
  bust: 0,                  // 0..1 bust meter
  notice: '', noticeT: 0,
  mission: null,            // { def, stage, tLeft, stole, hintShown }
  doneMissions: {},
  completeInfo: null,
  muted: false,
  camX: 0, camY: 0,
  shake: 0,
  timeOfDay: 0.42,          // late morning on day 1
  day: 1,
  stamina: 100,
  coinsGot: 0,
  lastFine: 0,
  spawnCd: 0,
  sirenT: 0,
  // round 4 fields
  bestScore: loadBestScore(),   // persistent record, see loadBestScore()
  isNewBest: false,             // true once this run beats the record
  unseenT: 0,                   // seconds since a cop last had eyes on you
  parcel: null,                 // Paket Pantai run: {phase,x,y,tx,ty,tLeft,fromLabel,toLabel}
  parcelDone: 0,                // completed Paket Pantai deliveries
  parcelCd: 0,                  // cooldown before the next parcel spawns
};
const stars = () => Math.min(5, Math.floor(S.heat / 120));

const player = { x: VX[1], y: HY[4], a: -Math.PI / 2, hp: 100, car: null, lastHurt: -9999, walk: 0, footSpeed: 0 };
let buildings = [];   // {x,y,w,h,color, floors}
let parks = [];       // {x,y,w,h, trees:[{x,y,r}]}
let lots = [];        // {x,y,w,h}
let sandDots = [], seaLines = [];
let civCars = [];     // {x,y,a,v,hp,color,type,mode, ni,nj,ti,tj,speed, hitCd, job}
let cops = [];        // {x,y,a,v,hp}
let peds = [];        // {x,y,a,speed,color,kind, tx,ty, flee, fall, say, sayT}
let coins = [];       // {x,y,taken,ph}
let jobCar = null;
const TOTAL_COINS = 12;

// ---------- round 4: best score (localStorage) ----------
// The best score survives reloads. Storage can be blocked (private
// mode, file:// quirks), so every access is wrapped: failing to read
// or write the record must never break the game itself.
const BEST_SCORE_KEY = 'azura-heat-best-score-v1';
function loadBestScore() {
  try {
    const raw = window.localStorage.getItem(BEST_SCORE_KEY);
    const n = raw === null ? 0 : Number(raw);
    return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
  } catch (e) { return 0; }
}
function saveBestScore(value) {
  try { window.localStorage.setItem(BEST_SCORE_KEY, String(Math.floor(value))); } catch (e) { /* storage is a bonus */ }
}

// ---------- round 4: radio (procedural WebAudio, no audio files) ----------
// Three stops on the dial: 0 = off, 1 = synthwave, 2 = chill. Each
// channel is just a looping note pattern the step loop feeds to tone()
// on a beat clock, so the "stations" cost nothing but oscillators.
const RADIO_CHANNELS = [
  { id: 'off', name: 'RADIO OFF' },
  { id: 'synthwave', name: 'AZURA WAVE 98.4 — SYNTHWAVE' },
  { id: 'chill', name: 'PIER FM 91.1 — CHILL' },
];
const RADIO_PATTERNS = {
  // driving minor-key bassline + sparkle, eighth notes at ~132 bpm
  synthwave: { stepSec: 0.227, type: 'sawtooth', vol: 0.028,
    notes: [110, 0, 110, 0, 131, 0, 110, 0, 98, 0, 98, 0, 147, 0, 165, 0,
            110, 0, 110, 0, 131, 0, 110, 0, 196, 0, 165, 0, 147, 0, 131, 0] },
  // lazy major-7 arpeggio, eighth notes at ~76 bpm
  chill: { stepSec: 0.395, type: 'sine', vol: 0.04,
    notes: [262, 330, 392, 494, 392, 330, 294, 370, 440, 554, 440, 370,
            247, 311, 370, 466, 370, 311, 262, 330, 392, 494, 587, 494] },
};
const radio = { channel: 0, stepIdx: 0, nextIn: 0 };
function cycleRadio() {
  radio.channel = (radio.channel + 1) % RADIO_CHANNELS.length;
  radio.stepIdx = 0; radio.nextIn = 0;
  notice(RADIO_CHANNELS[radio.channel].name, 1.8);
  if (radio.channel !== 0) tone(880, 0.07, 'square', 0.04);
}
function updateRadio(dt) {
  if (SHOTMODE || S.muted || radio.channel === 0 || S.mode !== 'playing') return;
  const pat = RADIO_PATTERNS[RADIO_CHANNELS[radio.channel].id];
  if (!pat) return;
  radio.nextIn -= dt;
  if (radio.nextIn > 0) return;
  radio.nextIn = pat.stepSec;
  const f = pat.notes[radio.stepIdx % pat.notes.length];
  radio.stepIdx++;
  if (f > 0) tone(f, pat.stepSec * 0.92, pat.type, pat.vol);
}

// ---------- round 4: Paket Pantai (Beach Parcel) side activity ----------
// A repeatable delivery hustle, independent of the four story jobs:
// touch the glowing parcel pickup and a drop-off lights up somewhere
// else in the city. Beat the timer for cash + score; run out of time
// and the parcel is worthless. Either way a fresh random run follows.
const PARCEL_TIME = 75;              // seconds to make the delivery
const PARCEL_PAY = 120;              // cash on delivery (+ score too)
const PARCEL_PICKUPS = [
  { x: 160, y: CITY_H + 96, label: 'the pier kiosk' },
  { x: 940, y: CITY_H + 96, label: 'the beach kiosk' },
  { x: VX[1], y: HY[4] + 52, label: 'the south-west corner' },
  { x: VX[5], y: CITY_H + 84, label: 'the beachfront stand' },
];
const PARCEL_DROPS = [
  { x: VX[6], y: HY[1], label: 'the north depot' },
  { x: VX[0], y: HY[0] + 52, label: 'the old lighthouse gate' },
  { x: VX[3], y: HY[2], label: 'the mid-town plaza' },
  { x: VX[6], y: HY[4] + 40, label: 'St. Azura General' },
  { x: VX[2], y: HY[5] - 40, label: 'the south docks office' },
];
// S was initialised before BEST_SCORE_KEY existed (temporal dead zone),
// so its bestScore field started at the guarded fallback of 0. Now that
// the key constant is live, load the real stored record into the state.
S.bestScore = loadBestScore();

// ---------- world generation (all draws from the seeded rng) ----------
function newCar(x, y, a, mode) {
  const roll = rng();
  const type = mode === 'traffic' ? (roll < 0.16 ? 'taxi' : roll < 0.30 ? 'van' : 'sedan') : 'sedan';
  const color = type === 'taxi' ? '#f5c542' : CAR_COLORS[Math.floor(rng() * CAR_COLORS.length)];
  return { x, y, a, v: 0, hp: 100, color, type,
           mode, ni: 0, nj: 0, ti: 0, tj: 0, speed: 130, hitCd: 0, hitP: -999, job: false };
}
function sidewalkPoint() {
  const c = Math.floor(rng() * COLS), r = Math.floor(rng() * ROWS);
  const bx = ROAD + c * PITCH, by = ROAD + r * PITCH, side = Math.floor(rng() * 4), t = rng();
  const off = 8;
  if (side === 0) return { x: bx + t * BLOCK, y: by - off };
  if (side === 1) return { x: bx + t * BLOCK, y: by + BLOCK + off };
  if (side === 2) return { x: bx - off, y: by + t * BLOCK };
  return { x: bx + BLOCK + off, y: by + t * BLOCK };
}
function beachPoint() {
  return { x: 60 + rng() * (WORLD_W - 120), y: CITY_H + 26 + rng() * (SAND - 52) };
}
function pickNextNode(car) {
  const opts = [];
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (const [dx, dy] of dirs) {
    const ni = car.ti + dx, nj = car.tj + dy;
    if (ni < 0 || ni > COLS || nj < 0 || nj > ROWS) continue;
    if (ni === car.ni && nj === car.nj && (car.ti !== car.ni || car.tj !== car.nj)) continue; // no U-turn
    const straight = (dx === Math.sign(car.ti - car.ni) && dy === Math.sign(car.tj - car.nj)) ? 3 : 1;
    for (let k = 0; k < straight; k++) opts.push([ni, nj]);
  }
  if (!opts.length) { car.ni = car.ti; car.nj = car.tj; return; }
  const [ni, nj] = opts[Math.floor(rng() * opts.length)];
  car.ni = car.ti; car.nj = car.tj; car.ti = ni; car.tj = nj;
}
function buildWorld() {
  buildings = []; parks = []; lots = []; civCars = []; cops = []; peds = []; coins = []; jobCar = null;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const bx = ROAD + c * PITCH, by = ROAD + r * PITCH;
      let kind = 'building';
      const roll = rng();
      if (roll > 0.84) kind = 'park'; else if (roll > 0.68) kind = 'lot';
      if (c === 2 && r === 3) kind = 'lot';                    // the convertible waits here
      if (kind === 'building') {
        const inset = 16 + Math.floor(rng() * 10);
        buildings.push({
          x: bx + inset, y: by + inset, w: BLOCK - inset * 2, h: BLOCK - inset * 2,
          color: ROOF_COLORS[Math.floor(rng() * ROOF_COLORS.length)],
          floors: 2 + Math.floor(rng() * 5),
        });
      } else if (kind === 'park') {
        const trees = [];
        const n = 5 + Math.floor(rng() * 5);
        for (let i = 0; i < n; i++) trees.push({ x: bx + 30 + rng() * (BLOCK - 60), y: by + 30 + rng() * (BLOCK - 60), r: 10 + rng() * 9 });
        parks.push({ x: bx, y: by, w: BLOCK, h: BLOCK, trees });
      } else {
        lots.push({ x: bx, y: by, w: BLOCK, h: BLOCK });
        for (let i = 0; i < 3; i++) {
          for (let k = 0; k < 2; k++) {
            if (rng() < 0.38) continue;
            civCars.push(newCar(bx + 44 + i * 76, by + 58 + k * 118, Math.PI / 2, 'parked'));
          }
        }
      }
    }
  }
  // the red convertible for the docks job
  jobCar = newCar(ROAD + 2 * PITCH + 118, ROAD + 3 * PITCH + 128, -Math.PI / 2, 'parked');
  jobCar.color = '#e02121'; jobCar.job = true; jobCar.type = 'sedan';
  civCars.push(jobCar);
  // a few roadside parked cars
  const spots = [[VX[0] + 30, 560], [VX[3] - 30, 900], [VX[5] + 30, 240], [VX[2] - 30, 1560], [VX[4] + 30, 1180]];
  for (const [x, y] of spots) civCars.push(newCar(x, y, 0, 'parked'));
  // traffic (a few more cars than round 2, now with taxis and vans)
  for (let i = 0; i < 13; i++) {
    const ni = Math.floor(rng() * (COLS + 1)), nj = Math.floor(rng() * (ROWS + 1));
    const car = newCar(VX[ni], HY[nj], 0, 'traffic');
    car.ni = ni; car.nj = nj; car.ti = ni; car.tj = nj;
    car.speed = (car.type === 'van' ? 100 : 118) + rng() * 55;
    pickNextNode(car);
    civCars.push(car);
  }
  // citizens: sidewalk walkers, fast joggers, and beachgoers on the sand
  for (let i = 0; i < 24; i++) {
    const kind = i < 6 ? 'beach' : (i % 5 === 4 ? 'jogger' : 'walker');
    const p = { x: 0, y: 0, a: rng() * Math.PI * 2,
                speed: kind === 'jogger' ? 118 + rng() * 26 : kind === 'beach' ? 26 + rng() * 16 : 34 + rng() * 22,
                color: PED_COLORS[Math.floor(rng() * PED_COLORS.length)], kind, tx: 0, ty: 0, flee: 0, fall: 0, say: '', sayT: 0 };
    const pt = kind === 'beach' ? beachPoint() : sidewalkPoint();
    p.x = pt.x; p.y = pt.y;
    const t2 = kind === 'beach' ? beachPoint() : sidewalkPoint(); p.tx = t2.x; p.ty = t2.y;
    peds.push(p);
  }
  // collectible cash coins: parks, the pier, the beach, quiet corners
  const coinSpots = [];
  for (const pk of parks) coinSpots.push({ x: pk.x + pk.w / 2, y: pk.y + pk.h / 2 });
  for (const lt of lots) coinSpots.push({ x: lt.x + 30, y: lt.y + 30 });
  coinSpots.push({ x: PIER.x + PIER.w / 2, y: PIER.y + PIER.h - 26 });
  coinSpots.push({ x: 620, y: CITY_H + 84 }, { x: 1500, y: CITY_H + 110 }, { x: 1960, y: CITY_H + 60 });
  coinSpots.push({ x: VX[0] + 26, y: HY[0] + 26 }, { x: VX[6] - 26, y: HY[5] - 26 }, { x: VX[3] + 26, y: HY[2] + 26 });
  // shuffle with the seeded stream, then take TOTAL_COINS with a little jitter
  for (let i = coinSpots.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = coinSpots[i]; coinSpots[i] = coinSpots[j]; coinSpots[j] = t; }
  for (let i = 0; i < Math.min(TOTAL_COINS, coinSpots.length); i++) {
    coins.push({ x: clamp(coinSpots[i].x + (rng() - 0.5) * 30, 24, WORLD_W - 24),
                 y: clamp(coinSpots[i].y + (rng() - 0.5) * 30, 24, WORLD_H - 24),
                 taken: false, ph: rng() * Math.PI * 2 });
  }
  // beach & sea dressing, fixed once so renders are stable
  sandDots = [];
  for (let i = 0; i < 260; i++) sandDots.push({ x: rng() * WORLD_W, y: CITY_H + rng() * SAND, r: 1 + rng() * 2 });
  seaLines = [];
  for (let i = 0; i < 26; i++) seaLines.push({ x: rng() * WORLD_W, y: CITY_H + SAND + 14 + rng() * (SEA - 28), len: 26 + rng() * 60, ph: rng() * Math.PI * 2 });
}

// ---------- collision helpers ----------
function circleVsBuildings(x, y, rad) {
  for (const b of buildings) {
    const cx = clamp(x, b.x, b.x + b.w), cy = clamp(y, b.y, b.y + b.h);
    const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
    if (d2 < rad * rad) {
      if (d2 > 0.0001) { const d = Math.sqrt(d2); return { x: cx + (dx / d) * rad, y: cy + (dy / d) * rad, hit: true, depth: rad - d }; }
      const exits = [x - b.x + rad, b.x + b.w - x + rad, y - b.y + rad, b.y + b.h - y + rad];
      const m = Math.min(...exits);
      if (m === exits[0]) return { x: b.x - rad, y, hit: true, depth: m };
      if (m === exits[1]) return { x: b.x + b.w + rad, y, hit: true, depth: m };
      if (m === exits[2]) return { x, y: b.y - rad, hit: true, depth: m };
      return { x, y: b.y + b.h + rad, hit: true, depth: m };
    }
  }
  return null;
}
function inSea(x, y) {
  if (y < CITY_H + SAND + 8) return false;
  if (x > PIER.x - 4 && x < PIER.x + PIER.w + 4 && y < PIER.y + PIER.h) return false; // the pier
  return true;
}
function crime(points) {
  S.heat = clamp(S.heat + points, 0, 599);
  S.lastCrime = S.steps;
}
function notice(text, seconds) { S.notice = text; S.noticeT = Math.round(seconds * 60); }
function onScreen(x, y, m) {
  return x > S.camX - m && x < S.camX + VW + m && y > S.camY - m && y < S.camY + VH + m;
}

// ---------- round 4: score record, pause, parcel logic ----------
function recordScore() {
  // Called whenever the score jumps; keeps the stored record honest.
  if (S.score > S.bestScore) {
    S.bestScore = Math.floor(S.score);
    S.isNewBest = true;
    saveBestScore(S.bestScore);
  }
}
function togglePause() {
  if (S.mode === 'playing') { S.mode = 'paused'; }
  else if (S.mode === 'paused') { S.mode = 'playing'; }
}
function startParcelRun() {
  // Pick a pickup and a drop-off that are genuinely apart, using the
  // same seeded stream as the rest of the world generation at runtime.
  const from = PARCEL_PICKUPS[Math.floor(rng() * PARCEL_PICKUPS.length)];
  let to = PARCEL_DROPS[Math.floor(rng() * PARCEL_DROPS.length)];
  for (let guard = 0; guard < 6 && dist2(from.x, from.y, to.x, to.y) < 700 * 700; guard++) {
    to = PARCEL_DROPS[Math.floor(rng() * PARCEL_DROPS.length)];
  }
  S.parcel = { phase: 'pickup', x: from.x, y: from.y, tx: to.x, ty: to.y,
               tLeft: Math.round(PARCEL_TIME * 60), fromLabel: from.label, toLabel: to.label };
}
function updateParcel(dt) {
  if (SHOTMODE) return;
  if (!S.parcel) {
    S.parcelCd -= dt;
    if (S.parcelCd <= 0) startParcelRun();
    return;
  }
  const p = S.parcel;
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  if (p.phase === 'pickup') {
    if (dist2(px, py, p.x, p.y) < 46 * 46) {
      p.phase = 'carry';
      notice('Paket Pantai picked up! Deliver to ' + p.toLabel + ' — ' + PARCEL_TIME + 's!', 3);
      jingle([659, 880], 0.07);
    }
    return;
  }
  // carrying: the clock is ticking
  p.tLeft--;
  if (p.tLeft <= 0) {
    S.parcel = null; S.parcelCd = 6;
    notice('Paket Pantai expired — soggy and worthless. A new one will turn up.', 3);
    tone(220, 0.25, 'square', 0.05, 160);
    return;
  }
  if (dist2(px, py, p.tx, p.ty) < 52 * 52) {
    S.cash += PARCEL_PAY; S.score += PARCEL_PAY; S.parcelDone++;
    recordScore();
    S.parcel = null; S.parcelCd = 5;
    notice('Paket Pantai delivered! +$' + PARCEL_PAY + '  (deliveries: ' + S.parcelDone + ')', 3);
    jingle([784, 988, 1319], 0.08);
  }
}

// ---------- audio v2 (WebAudio, all procedural; M mutes; off in shot mode) ----------
let audioCtx = null, engineOsc = null, engineGain = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, slideTo) {
  if (S.muted || SHOTMODE) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) { /* audio is decoration only */ }
}
function beep(freq, dur, type) { tone(freq, dur, type, 0.05); }
function jingle(notes, stepSec, type) {
  if (S.muted || SHOTMODE) return;
  notes.forEach((f, i) => setTimeout(() => tone(f, 0.16, type || 'square', 0.055), i * stepSec * 1000));
}
function honk() {
  tone(349, 0.22, 'sawtooth', 0.07); tone(440, 0.22, 'sawtooth', 0.06);
  // nearby citizens startle and scatter
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  for (const p of peds) {
    if (dist2(p.x, p.y, px, py) < 150 * 150) {
      p.flee = 40; p.tx = p.x + (p.x - px) * 1.6; p.ty = p.y + (p.y - py) * 1.6;
    }
  }
}
function engineSound() {
  if (SHOTMODE) return;
  try {
    if (player.car && !S.muted && S.mode === 'playing') {
      const a = ac();
      if (!engineOsc) {
        engineOsc = a.createOscillator(); engineGain = a.createGain();
        engineOsc.type = 'sawtooth'; engineGain.gain.value = 0.0;
        const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
        engineOsc.connect(f); f.connect(engineGain); engineGain.connect(a.destination);
        engineOsc.start();
      }
      engineOsc.frequency.value = 55 + Math.abs(player.car.v) * 0.42;
      engineGain.gain.value = 0.012 + Math.abs(player.car.v) / 308 * 0.02;
    } else if (engineGain) {
      engineGain.gain.value = 0.0;
    }
  } catch (e) { /* decoration only */ }
}

// ---------- input ----------
const keys = {};
let contactNear = null;
addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyM') { S.muted = !S.muted; notice(S.muted ? 'Sound off' : 'Sound on', 1); }
  if (e.code === 'KeyH' && S.mode === 'playing') honk();
  if (e.code === 'KeyR' && (S.mode === 'playing' || S.mode === 'paused')) cycleRadio();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'Enter') confirmOverlay();
  if (e.code === 'KeyE' && S.mode === 'playing') interact();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
cv.addEventListener('pointerdown', () => { if (S.mode !== 'playing' && S.mode !== 'paused') confirmOverlay(); });

function confirmOverlay() {
  if (S.mode === 'title') { S.mode = 'playing'; jingle([523, 659, 784], 0.07); }
  else if (S.mode === 'busted') respawnAfterBust();
  else if (S.mode === 'downed') respawnAfterDowned();
  else if (S.mode === 'complete') {
    S.cash += S.completeInfo.pay; S.score += S.completeInfo.pay;
    recordScore();
    S.doneMissions[S.completeInfo.id] = true;
    S.completeInfo = null; S.mode = 'playing';
  }
}
function interact() {
  if (player.car) { // step out, just beside the car
    const c = player.car;
    c.mode = 'parked'; c.v = 0;
    player.x = c.x - Math.sin(c.a) * 26; player.y = c.y + Math.cos(c.a) * 26;
    player.car = null;
    return;
  }
  let best = null, bd = 46 * 46;
  for (const c of civCars) {
    if (c.mode !== 'parked') continue;
    const d = dist2(player.x, player.y, c.x, c.y);
    if (d < bd) { bd = d; best = c; }
  }
  if (best) {
    best.mode = 'player'; player.car = best;
    player.x = best.x; player.y = best.y;
    if (best.job && S.mission && S.mission.def.carJob && S.mission.stage === 0) {
      crime(200); S.mission.stage = 1; S.mission.stole = true;
      notice('Heat is on — get it to the docks garage!', 3); tone(196, 0.25, 'sawtooth', 0.07, 98);
    } else if (!best.job) {
      crime(25); tone(392, 0.07);
    }
    return;
  }
  if (contactNear) {
    const def = MISSIONS.find((m) => m.contact === contactNear && !S.doneMissions[m.id]);
    if (def && !S.mission) {
      S.mission = { def, stage: 0, tLeft: Math.round(def.time * 60), stole: false, hintShown: false };
      notice(def.name + ' — ' + def.stages[0].label, 4); jingle([523, 659], 0.08);
    }
  }
}

// ---------- consequences ----------
function hurtPlayer(n) {
  if (SHOTMODE || S.mode !== 'playing') return;
  player.hp -= n; player.lastHurt = S.steps; S.shake = Math.min(10, S.shake + 4);
  tone(140, 0.15, 'sawtooth', 0.06, 70);
  if (player.hp <= 0) { player.hp = 0; S.mode = 'downed'; tone(110, 0.4, 'sawtooth', 0.07, 55); }
}
function doBusted() {
  S.mode = 'busted';
  S.lastFine = Math.floor(S.cash * 0.15);
  tone(146, 0.4, 'sawtooth', 0.07, 73);
}
function respawnAfterBust() {
  S.cash -= S.lastFine || 0;
  S.heat = 0; S.bust = 0; cops = [];
  if (player.car) { player.car.mode = 'parked'; player.car.v = 0; player.car = null; }
  player.x = RESPAWN.police.x; player.y = RESPAWN.police.y;
  player.hp = Math.max(player.hp, 60);
  S.mode = 'playing'; notice('The Azura PD keeps your car paperwork. And a fine.', 3);
}
function respawnAfterDowned() {
  S.cash = Math.max(0, S.cash - 50);
  S.heat = Math.floor(S.heat / 2); S.bust = 0;
  if (player.car) { player.car.mode = 'parked'; player.car.v = 0; player.car = null; }
  player.x = RESPAWN.hospital.x; player.y = RESPAWN.hospital.y;
  player.hp = 100;
  S.mode = 'playing'; notice('St. Azura General patches you up. $50, please.', 3);
}

// ---------- simulation ----------
function step(dt) {
  // Round 4 pause menu: a paused game is a frozen game — no clock, no
  // traffic, no timers. Render still draws the world + the menu.
  if (S.mode === 'paused') return;
  S.steps++;
  if (S.noticeT > 0) S.noticeT--;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 30 * dt);
  // day-night clock always turns (even behind the title screen)
  S.timeOfDay += dt / DAY_SECONDS;
  if (S.timeOfDay >= 1) { S.timeOfDay -= 1; S.day++; }
  updateTraffic(dt);
  updatePeds(dt);
  updateCoins();
  if (S.mode !== 'playing') return;
  updatePlayer(dt);
  updateCops(dt);
  updateMission(dt);
  updateParcel(dt);
  updateRadio(dt);
  engineSound();
  // distant siren two-tone while the PD is looking for you
  if (stars() > 0 && cops.length) {
    S.sirenT -= dt;
    if (S.sirenT <= 0) { S.sirenT = 0.95; tone(660, 0.18, 'triangle', 0.018); setTimeout(() => tone(520, 0.18, 'triangle', 0.018), 220); }
  }
  // driving fast earns a trickle of score — style points, basically
  if (player.car && Math.abs(player.car.v) > 120) S.score += dt * 2;
  // near-miss bonus: threading past traffic at speed without touching it
  if (player.car && Math.abs(player.car.v) > 190 && S.steps % 30 === 0) {
    for (const o of civCars) {
      if (o.mode !== 'traffic') continue;
      const d = dist2(player.car.x, player.car.y, o.x, o.y);
      if (d > 34 * 34 && d < 62 * 62) { S.score += 5; break; }
    }
  }
  if (S.steps - S.lastCrime > 360 && S.heat > 0) S.heat = Math.max(0, S.heat - 26 * dt);
  // Round 4 heat balance: stars bleed away while nobody in uniform can
  // see you. A cop within sight range (340px) resets the unseen timer;
  // after 3 unseen seconds the heat drains slowly but steadily, so
  // breaking line of sight is a real escape plan, not just a delay.
  {
    const px2 = player.car ? player.car.x : player.x, py2 = player.car ? player.car.y : player.y;
    let seen = false;
    for (const c of cops) if (dist2(px2, py2, c.x, c.y) < 340 * 340) { seen = true; break; }
    if (seen) S.unseenT = 0; else S.unseenT += dt;
    if (S.unseenT > 3 && S.heat > 0) S.heat = Math.max(0, S.heat - 14 * dt);
  }
  recordScore();
  if (S.steps - player.lastHurt > 360 && player.hp > 0 && player.hp < 100) player.hp = Math.min(100, player.hp + 1.6 * dt);
  // bust meter: close police + you barely moving = cuffs
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  const pSpeed = player.car ? Math.abs(player.car.v) : player.footSpeed || 0;
  let nearCop = false;
  for (const c of cops) if (dist2(px, py, c.x, c.y) < 105 * 105) { nearCop = true; break; }
  if (stars() > 0 && nearCop && pSpeed < 26) S.bust = Math.min(1, S.bust + dt / 2.4);
  else S.bust = Math.max(0, S.bust - dt / 1.3);
  if (S.bust >= 1 && !SHOTMODE) doBusted();
  contactNear = null;
  if (!player.car && !S.mission) {
    for (const key of Object.keys(CONTACTS)) {
      const c = CONTACTS[key];
      if (dist2(player.x, player.y, c.x, c.y) < 58 * 58 &&
          MISSIONS.some((m) => m.contact === key && !S.doneMissions[m.id])) contactNear = key;
    }
  }
}

function updateCoins() {
  if (S.mode !== 'playing' || SHOTMODE) return;
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  for (const c of coins) {
    if (c.taken) continue;
    if (dist2(px, py, c.x, c.y) < 30 * 30) {
      c.taken = true; S.coinsGot++; S.cash += 25; S.score += 50;
      recordScore();
      jingle([988, 1319], 0.06);
      notice('Cash stash! +$25  (' + S.coinsGot + '/' + TOTAL_COINS + ')', 1.6);
    }
  }
}

function updatePlayer(dt) {
  if (player.car) {
    const car = player.car;
    const fwdIn = keys.KeyW || keys.KeyArrowUp, backIn = keys.KeyS || keys.KeyArrowDown;
    const leftIn = keys.KeyA || keys.KeyArrowLeft, rightIn = keys.KeyD || keys.KeyArrowRight;
    if (fwdIn) car.v += 235 * dt;
    if (backIn) car.v -= (car.v > 5 ? 360 : 155) * dt;
    car.v -= car.v * 0.5 * dt;
    if (!fwdIn && !backIn) car.v -= car.v * 0.9 * dt;
    car.v = clamp(car.v, -98, 308);
    const steer = (leftIn ? -1 : 0) + (rightIn ? 1 : 0);
    if (steer) car.a += steer * 1.85 * dt * clamp(car.v / 95, -1, 1);
    moveCar(car, dt, true);
    player.x = car.x; player.y = car.y; player.a = car.a;
    return;
  }
  // on foot — Shift sprints and drains stamina
  let mx = 0, my = 0;
  if (keys.KeyW || keys.KeyArrowUp) my -= 1;
  if (keys.KeyS || keys.KeyArrowDown) my += 1;
  if (keys.KeyA || keys.KeyArrowLeft) mx -= 1;
  if (keys.KeyD || keys.KeyArrowRight) mx += 1;
  const len = Math.hypot(mx, my);
  const wantSprint = (keys.ShiftLeft || keys.ShiftRight) && len > 0;
  if (wantSprint && S.stamina > 1) S.stamina = Math.max(0, S.stamina - 26 * dt);
  else S.stamina = Math.min(100, S.stamina + 15 * dt);
  const speed = wantSprint && S.stamina > 1 ? 232 : 152;
  player.footSpeed = len ? speed : 0;
  if (len) {
    mx /= len; my /= len;
    player.a = Math.atan2(my, mx);
    player.walk += dt * (speed > 200 ? 15 : 11);
    let nx = clamp(player.x + mx * speed * dt, 12, WORLD_W - 12);
    let ny = clamp(player.y + my * speed * dt, 12, WORLD_H - 12);
    if (inSea(nx, ny)) { if (!inSea(nx, player.y)) ny = player.y; else if (!inSea(player.x, ny)) nx = player.x; else { nx = player.x; ny = player.y; } }
    const push = circleVsBuildings(nx, ny, 10);
    if (push) { nx = push.x; ny = push.y; }
    player.x = nx; player.y = ny;
  }
  for (const c of civCars) {
    if (c.mode !== 'traffic' || Math.abs(c.v) < 65) continue;
    if (dist2(player.x, player.y, c.x, c.y) < 21 * 21 && S.steps - (c.hitP || -999) > 70) {
      c.hitP = S.steps; hurtPlayer(16);
      player.x += Math.cos(c.a) * 16; player.y += Math.sin(c.a) * 16;
    }
  }
}

function moveCar(car, dt, isPlayerCar) {
  const ox = car.x, oy = car.y;
  car.x += Math.cos(car.a) * car.v * dt;
  car.y += Math.sin(car.a) * car.v * dt;
  car.x = clamp(car.x, 16, WORLD_W - 16);
  car.y = clamp(car.y, 16, WORLD_H - 16);
  if (inSea(car.x, car.y)) { car.x = ox; car.y = oy; car.v *= -0.3; }
  const push = circleVsBuildings(car.x, car.y, 15);
  if (push) {
    car.x = push.x; car.y = push.y;
    const impact = Math.abs(car.v);
    if (impact > 55) {
      const dmg = (impact - 55) * 0.14;
      car.hp -= dmg;
      if (isPlayerCar) { S.shake = Math.min(9, impact / 26); tone(90, 0.12, 'sawtooth', 0.06, 50); if (car.hp < 100) notice(car.hp > 30 ? 'Your ride is taking a beating' : 'This car is nearly wrecked', 1.6); }
      if (car.hp <= 0 && isPlayerCar) wreckPlayerCar();
    }
    car.v *= -0.28;
  }
  for (const o of civCars) {
    if (o === car || o.mode === 'wreck') continue;
    const d2 = dist2(car.x, car.y, o.x, o.y);
    if (d2 < 31 * 31 && d2 > 0.01) {
      const d = Math.sqrt(d2), ux = (car.x - o.x) / d, uy = (car.y - o.y) / d;
      car.x += ux * (31 - d) / 2; car.y += uy * (31 - d) / 2;
      o.x -= ux * (31 - d) / 2; o.y -= uy * (31 - d) / 2;
      const impact = Math.abs(car.v);
      if (impact > 60 && S.steps - (car.hitCd || 0) > 50) {
        car.hitCd = S.steps;
        o.hp -= (impact - 60) * 0.1; car.hp -= (impact - 60) * 0.05;
        if (isPlayerCar) { crime(45); if (car.hp <= 0) wreckPlayerCar(); }
        if (o.hp <= 0) o.mode = 'wreck';
      }
      car.v *= 0.55;
    }
  }
  for (const c of cops) {
    const d2 = dist2(car.x, car.y, c.x, c.y);
    if (d2 < 31 * 31 && d2 > 0.01) {
      const d = Math.sqrt(d2), ux = (car.x - c.x) / d, uy = (car.y - c.y) / d;
      car.x += ux * (31 - d) / 2; car.y += uy * (31 - d) / 2;
      if (isPlayerCar && Math.abs(car.v) > 60 && S.steps - (car.hitCd || 0) > 50) {
        car.hitCd = S.steps; crime(120); notice('Ramming the PD? Bold.', 2);
      }
      car.v *= 0.6;
    }
  }
}
function wreckPlayerCar() {
  const car = player.car;
  if (!car) return;
  car.hp = 0; car.mode = 'wreck'; car.v = 0;
  player.x = car.x - Math.sin(car.a) * 28; player.y = car.y + Math.cos(car.a) * 28;
  player.car = null;
  hurtPlayer(8);
  notice('Wrecked. Walk it off.', 3);
}

function updateTraffic(dt) {
  for (const car of civCars) {
    if (car.mode !== 'traffic') continue;
    const a = Math.atan2(HY[car.tj] - HY[car.nj], VX[car.ti] - VX[car.ni]);
    const tx = VX[car.ti] - Math.sin(a) * 15, ty = HY[car.tj] + Math.cos(a) * 15;
    const want = Math.atan2(ty - car.y, tx - car.x);
    car.a = turnToward(car.a, want, 2.4 * dt);
    let sp = car.speed * (darkness(S.timeOfDay) > 0.3 ? 0.82 : 1); // the city drives gentler at night
    for (const o of civCars) {
      if (o === car) continue;
      const fx = car.x + Math.cos(car.a) * 40, fy = car.y + Math.sin(car.a) * 40;
      if (dist2(fx, fy, o.x, o.y) < 30 * 30) { sp = Math.min(sp, Math.abs(o.v) * 0.8 + 8); break; }
    }
    if (player.car && dist2(car.x + Math.cos(car.a) * 40, car.y + Math.sin(car.a) * 40, player.car.x, player.car.y) < 30 * 30) sp = 10;
    car.v = lerp(car.v, sp, 1 - Math.pow(0.02, dt));
    car.x += Math.cos(car.a) * car.v * dt;
    car.y += Math.sin(car.a) * car.v * dt;
    const push = circleVsBuildings(car.x, car.y, 14);
    if (push) { car.x = push.x; car.y = push.y; }
    if (dist2(car.x, car.y, VX[car.ti], HY[car.tj]) < 30 * 30) pickNextNode(car);
  }
}

function updatePeds(dt) {
  for (let i = 0; i < peds.length; i++) {
    const p = peds[i];
    if (p.sayT > 0) p.sayT--;
    // citizens occasionally say something (deterministic, seeded by index)
    if (p.sayT <= 0 && (S.steps + i * 131) % 1500 === 0 && p.kind !== 'beach') {
      p.say = PED_LINES[Math.floor(rng() * PED_LINES.length)]; p.sayT = 170;
    }
    if (p.fall > 0) { p.fall--; continue; }
    let threat = null, td = 120 * 120;
    for (const c of civCars) {
      if (Math.abs(c.v) < 42) continue;
      const d = dist2(p.x, p.y, c.x, c.y);
      if (d < td) { td = d; threat = c; }
    }
    for (const c of cops) {
      const d = dist2(p.x, p.y, c.x, c.y);
      if (d < td) { td = d; threat = c; }
    }
    let gx, gy, sp;
    if (threat || p.flee > 0) {
      if (threat) { gx = p.x + (p.x - threat.x); gy = p.y + (p.y - threat.y); }
      else { gx = p.tx; gy = p.ty; }
      sp = 158; if (p.flee > 0) p.flee--;
    } else {
      gx = p.tx; gy = p.ty; sp = p.speed;
      if (dist2(p.x, p.y, gx, gy) < 12 * 12) {
        const t = p.kind === 'beach' ? beachPoint() : sidewalkPoint(); p.tx = t.x; p.ty = t.y;
      }
    }
    const want = Math.atan2(gy - p.y, gx - p.x);
    p.a = turnToward(p.a, want, 6 * dt);
    let nx = p.x + Math.cos(p.a) * sp * dt, ny = p.y + Math.sin(p.a) * sp * dt;
    const push = circleVsBuildings(nx, ny, 7);
    if (push) { nx = push.x; ny = push.y; }
    if (!inSea(nx, ny)) { p.x = clamp(nx, 10, WORLD_W - 10); p.y = clamp(ny, 10, WORLD_H - 10); }
    for (const c of civCars) {
      if (Math.abs(c.v) > 58 && dist2(p.x, p.y, c.x, c.y) < 18 * 18) {
        p.fall = 55;
        p.x += Math.cos(c.a) * 14; p.y += Math.sin(c.a) * 14;
        if (c === player.car) { crime(60); notice('You clipped a pedestrian!', 2); }
        break;
      }
    }
  }
}

function updateCops(dt) {
  const want = stars() > 0 ? Math.min(6, stars() + 1) : 0;
  if (cops.length < want) {
    S.spawnCd -= dt;
    if (S.spawnCd <= 0) {
      S.spawnCd = 0.8;
      let bx = VX[0], by = HY[0], bd = -1;
      const cand = [[0, 0], [COLS, 0], [0, ROWS], [COLS, ROWS], [3, 0], [3, ROWS], [0, 2], [COLS, 2]];
      for (const [i, j] of cand) {
        const d = dist2(player.x, player.y, VX[i], HY[j]);
        if (d > bd) { bd = d; bx = VX[i]; by = HY[j]; }
      }
      if (bd > 420 * 420) cops.push({ x: bx, y: by, a: 0, v: 0, hp: 100 });
    }
  }
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  for (let i = cops.length - 1; i >= 0; i--) {
    const c = cops[i];
    if (want === 0 && dist2(px, py, c.x, c.y) > 950 * 950) { cops.splice(i, 1); continue; }
    const wantA = Math.atan2(py - c.y, px - c.x);
    c.a = turnToward(c.a, wantA, 2.7 * dt);
    const d = Math.sqrt(dist2(px, py, c.x, c.y));
    const sp = want === 0 ? 130 : d > 150 ? 314 : d > 62 ? 238 : 96;
    c.v += clamp(sp - c.v, -320 * dt, 210 * dt);
    c.x += Math.cos(c.a) * c.v * dt;
    c.y += Math.sin(c.a) * c.v * dt;
    c.x = clamp(c.x, 16, WORLD_W - 16); c.y = clamp(c.y, 16, WORLD_H - 16);
    const push = circleVsBuildings(c.x, c.y, 15);
    if (push) { c.x = push.x; c.y = push.y; c.v *= 0.45; }
    if (player.car && dist2(c.x, c.y, player.car.x, player.car.y) < 30 * 30) {
      const pc = player.car;
      pc.hp -= 14 * dt; c.hp -= 8 * dt;
      if (pc.hp <= 0) wreckPlayerCar();
    }
  }
}

function updateMission(dt) {
  const m = S.mission;
  if (!m) return;
  m.tLeft--;
  if (m.tLeft <= 0) {
    S.mission = null; notice('Mission failed — out of time. The contact shrugs.', 3); tone(220, 0.25, 'square', 0.05, 160);
    return;
  }
  const st = m.def.stages[m.stage];
  if (!st) return;
  const px = player.car ? player.car.x : player.x, py = player.car ? player.car.y : player.y;
  if (st.car) {
    if (jobCar && dist2(px, py, jobCar.x, jobCar.y) < 60 * 60 && !m.hintShown) {
      m.hintShown = true; notice('There she is. Press E next to the convertible.', 3);
    }
    return;
  }
  if (dist2(px, py, st.x, st.y) < 52 * 52) {
    m.stage++;
    tone(740, 0.09);
    if (m.def.id === 'taxi' && m.stage === 1) notice('Passenger in! Hospital, fast but intact.', 3);
    if (m.stage >= m.def.stages.length) {
      S.completeInfo = { id: m.def.id, name: m.def.name, pay: m.def.pay };
      S.mission = null;
      if (!SHOTMODE) { S.mode = 'complete'; jingle([784, 988, 1175, 1568], 0.09); }
    } else {
      notice(m.def.stages[m.stage].label, 3);
    }
  }
}

function render() {

function drawLighting() {

function drawMarkers() {

  text('SCORE ' + Math.floor(S.score), 28, 58, 13, '#e5e7eb', 'left', 'normal');
  text('HP', 128, 58, 11, '#9ca3af', 'left', 'normal');
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(152, 53, 58, 9);
  ctx.fillStyle = player.hp > 35 ? '#4ade80' : '#f87171';
  ctx.fillRect(152, 53, 58 * clamp(player.hp, 0, 100) / 100, 9);
  // second row: ride health in a car, stamina on foot
  if (player.car) {
    text('RIDE', 28, 76, 11, '#9ca3af', 'left', 'normal');
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(70, 71, 140, 8);
    ctx.fillStyle = '#60a5fa'; ctx.fillRect(70, 71, 140 * clamp(player.car.hp, 0, 100) / 100, 8);
  } else {
    text('SPRINT', 28, 76, 11, '#9ca3af', 'left', 'normal');
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(84, 71, 126, 8);
    ctx.fillStyle = '#facc15'; ctx.fillRect(84, 71, 126 * S.stamina / 100, 8);
  }
  text('COINS ' + S.coinsGot + '/' + TOTAL_COINS + '   ·   DAY ' + S.day, 28, 96, 12, '#fde68a', 'left', 'normal');
  text('BEST ' + S.bestScore + (S.isNewBest ? ' ★ NEW' : ''), 28, 114, 12, '#7dd3fc', 'left', 'normal');
  if (radio.channel !== 0) text('♪ ' + RADIO_CHANNELS[radio.channel].name, 122, 114, 10, '#c4b5fd', 'left', 'normal');
  // clock, top centre, with a sun/moon marker
  const sun = sunElevation(S.timeOfDay);
  text((sun > 0 ? 'DAY' : 'NIGHT') + '  ' + clockText(S.timeOfDay), VW / 2, 58, 13, sun > 0 ? '#bae6fd' : '#c4b5fd', 'center');
  // wanted stars
  const st = stars();
  for (let i = 0; i < 5; i++) text('★', VW / 2 - 52 + i * 26, 30, 25, i < st ? '#ffd23f' : 'rgba(255,255,255,.22)', 'center');
  if (S.bust > 0.02) {
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(VW / 2 - 70, 70, 140, 9);
    ctx.fillStyle = '#ef4444'; ctx.fillRect(VW / 2 - 70, 70, 140 * S.bust, 9);
    text('BUSTED?', VW / 2, 90, 11, '#fca5a5', 'center');
  }
  if (S.noticeT > 0) text(S.notice, VW / 2, 108, 16, '#fde68a', 'center');
  if (S.mission) {
    const m = S.mission, stg = m.def.stages[m.stage];
    const t = Math.max(0, Math.ceil(m.tLeft / 60));
    const mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
    panel(VW / 2 - 265, VH - 64, 530, 48);
    text(m.def.name + '  ·  ' + mm + ':' + ss, VW / 2, VH - 46, 14, '#ffd23f', 'center');
    text(stg.label, VW / 2, VH - 26, 13, '#ffffff', 'center', 'normal');
  }
  if (S.parcel) {
    const p = S.parcel;
    const label = p.phase === 'pickup'
      ? 'Paket Pantai: pick up the parcel at ' + p.fromLabel
      : 'Paket Pantai: deliver to ' + p.toLabel + '  ·  ' + Math.max(0, Math.ceil(p.tLeft / 60)) + 's left';
    panel(VW / 2 - 265, S.mission ? VH - 112 : VH - 64, 530, 40);
    text(label, VW / 2, (S.mission ? VH - 112 : VH - 64) + 20, 13, p.phase === 'pickup' ? '#5eead4' : '#f0abfc', 'center', 'normal');
  }
  if (stars() > 0 && S.unseenT > 3) text('OUT OF SIGHT — HEAT FALLING', VW / 2, 128, 12, '#7dd3fc', 'center', 'normal');
  text('WASD move · Shift sprint · E enter/exit · H horn · R radio · P pause · M sound' + (S.muted ? ' · MUTED' : ''), 16, VH - 16, 12, 'rgba(255,255,255,.55)', 'left', 'normal');
}
function drawMinimap() {
  // minimap v2: bigger, with coins, citizens, compass and a clock strip
  const w = 196, h = 204, x0 = VW - w - 14, y0 = 14, sc = w / WORLD_W;
  panel(x0 - 4, y0 - 4, w + 8, h + 26, 0.62);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  ctx.fillStyle = '#20262e'; ctx.fillRect(x0, y0, w, h);
  ctx.fillStyle = '#14507a'; ctx.fillRect(x0, y0 + (CITY_H + SAND) * sc, w, SEA * sc);
  ctx.fillStyle = '#e2cf9e'; ctx.fillRect(x0, y0 + CITY_H * sc, w, SAND * sc);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i <= COLS; i++) { ctx.moveTo(x0 + VX[i] * sc, y0); ctx.lineTo(x0 + VX[i] * sc, y0 + CITY_H * sc); }
  for (let j = 0; j <= ROWS; j++) { ctx.moveTo(x0, y0 + HY[j] * sc); ctx.lineTo(x0 + CITY_W * sc, y0 + HY[j] * sc); }
  ctx.stroke();
  ctx.fillStyle = '#596068';
  for (const b of buildings) ctx.fillRect(x0 + b.x * sc, y0 + b.y * sc, Math.max(2, b.w * sc), Math.max(2, b.h * sc));
  for (const c of coins) {
    if (c.taken) continue;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(x0 + c.x * sc, y0 + c.y * sc, 2.2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  for (const p of peds) ctx.fillRect(x0 + p.x * sc - 1, y0 + p.y * sc - 1, 2, 2);
  const contactColors = { docks: '#22d3ee', cafe: '#fb923c', beach: '#f472b6' };
  for (const key of Object.keys(CONTACTS)) {
    const c = CONTACTS[key];
    ctx.fillStyle = contactColors[key];
    ctx.beginPath(); ctx.arc(x0 + c.x * sc, y0 + c.y * sc, 3.4, 0, 7); ctx.fill();
  }
  if (S.mission) {
    const stg = S.mission.def.stages[S.mission.stage];
    const tx = stg.car ? (jobCar ? jobCar.x : 0) : stg.x, ty = stg.car ? (jobCar ? jobCar.y : 0) : stg.y;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(x0 + tx * sc, y0 + ty * sc, 4 + Math.sin(S.steps * 0.15) * 1.2, 0, 7); ctx.fill();
  }
  if (S.parcel) {
    const p = S.parcel;
    const mx = p.phase === 'pickup' ? p.x : p.tx, my = p.phase === 'pickup' ? p.y : p.ty;
    ctx.fillStyle = p.phase === 'pickup' ? '#2dd4bf' : '#e879f9';
    ctx.beginPath(); ctx.arc(x0 + mx * sc, y0 + my * sc, 3.6, 0, 7); ctx.fill();
  }
  for (const c of cops) { ctx.fillStyle = '#2f7bff'; ctx.beginPath(); ctx.arc(x0 + c.x * sc, y0 + c.y * sc, 3, 0, 7); ctx.fill(); }
  // player as a rotated arrow so heading reads at a glance
  ctx.save();
  ctx.translate(x0 + player.x * sc, y0 + player.y * sc); ctx.rotate(player.a);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-4, -3.4); ctx.lineTo(-4, 3.4); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  ctx.strokeRect(x0 + S.camX * sc, y0 + S.camY * sc, VW * sc, VH * sc);
  ctx.restore();
  text('N', x0 + w - 10, y0 + 12, 12, '#ffffff', 'center');
  text(clockText(S.timeOfDay) + ' · Day ' + S.day, x0 + w / 2, y0 + h + 13, 11, '#cbd5e1', 'center', 'normal');
}
function drawOverlays() {
  if (S.mode === 'playing') return;
  ctx.fillStyle = S.mode === 'title' ? 'rgba(4,8,14,.66)' : 'rgba(4,8,14,.6)';
  ctx.fillRect(0, 0, VW, VH);
  if (S.mode === 'title') {
    text('AZURA HEAT', VW / 2, 200, 74, '#ffd23f', 'center');
    text('P O R T   A Z U R A  —  R O U N D  4', VW / 2, 252, 20, '#7dd3fc', 'center');
    text('An original top-down crime sandbox. Steal rides, run jobs for the docks,', VW / 2, 306, 17, '#e5e7eb', 'center', 'normal');
    text('Café Azul and the beach kiosk, grab hidden cash, and outrun the Azura PD.', VW / 2, 330, 17, '#e5e7eb', 'center', 'normal');
    text('New in round 4: a real pause menu, a saved best score, Paket Pantai parcel runs,', VW / 2, 362, 15, '#fde68a', 'center', 'normal');
    text('a three-stop procedural radio, and heat that fades while the PD cannot see you.', VW / 2, 384, 15, '#fde68a', 'center', 'normal');
    if (S.bestScore > 0) text('BEST SCORE  ' + S.bestScore, VW / 2, 410, 16, '#7dd3fc', 'center');
    text('WASD / arrows — move & drive      E — enter / exit car, take a job', VW / 2, 436, 16, '#cbd5e1', 'center', 'normal');
    text('Shift — sprint      H — horn      R — radio      P — pause      M — sound on/off', VW / 2, 462, 16, '#cbd5e1', 'center', 'normal');
    text('PRESS ENTER OR CLICK TO PLAY', VW / 2, 518, 21, '#7CFC9A', 'center');
  } else if (S.mode === 'paused') {
    // Round 4 pause menu: the simulation is frozen (see step()), so this
    // is a genuine progress summary, not a snapshot of a moving game.
    const jobsDone = Object.keys(S.doneMissions).length;
    panel(VW / 2 - 250, VH / 2 - 150, 500, 300, 0.72);
    text('PAUSED', VW / 2, VH / 2 - 108, 44, '#ffffff', 'center');
    text('—  P O R T   A Z U R A   ·   D A Y  ' + S.day + '  ·  ' + clockText(S.timeOfDay) + '  —', VW / 2, VH / 2 - 70, 14, '#7dd3fc', 'center', 'normal');
    text('Missions complete   ' + jobsDone + ' / ' + MISSIONS.length, VW / 2, VH / 2 - 34, 17, '#e5e7eb', 'center', 'normal');
    text('Coins found   ' + S.coinsGot + ' / ' + TOTAL_COINS + '      ·      Paket Pantai deliveries   ' + S.parcelDone, VW / 2, VH / 2 - 6, 17, '#e5e7eb', 'center', 'normal');
    text('Cash   $' + S.cash + '      ·      Score   ' + Math.floor(S.score), VW / 2, VH / 2 + 22, 17, '#e5e7eb', 'center', 'normal');
    text('Best score   ' + S.bestScore + (S.isNewBest ? '  (new record this run!)' : ''), VW / 2, VH / 2 + 50, 17, '#fde68a', 'center', 'normal');
    text('Wanted   ' + '★'.repeat(stars()) + '☆'.repeat(5 - stars()) + '      ·      Radio   ' + RADIO_CHANNELS[radio.channel].name, VW / 2, VH / 2 + 78, 15, '#cbd5e1', 'center', 'normal');
    if (S.mission) text('On the clock: ' + S.mission.def.name + ' — ' + Math.max(0, Math.ceil(S.mission.tLeft / 60)) + 's left', VW / 2, VH / 2 + 104, 14, '#ffd23f', 'center', 'normal');
    text('P or Esc to keep driving', VW / 2, VH / 2 + 132, 16, '#7CFC9A', 'center');
  } else if (S.mode === 'busted') {
    text('BUSTED', VW / 2, VH / 2 - 26, 58, '#f87171', 'center');
    text('The Azura PD walks you to the station. Fine: $' + (S.lastFine || 0), VW / 2, VH / 2 + 24, 18, '#e5e7eb', 'center', 'normal');
    text('PRESS ENTER', VW / 2, VH / 2 + 62, 18, '#7CFC9A', 'center');
  } else if (S.mode === 'downed') {
    text('DOWNED', VW / 2, VH / 2 - 26, 58, '#fb923c', 'center');
    text('You wake up at St. Azura General. The bill is $50.', VW / 2, VH / 2 + 24, 18, '#e5e7eb', 'center', 'normal');
    text('PRESS ENTER', VW / 2, VH / 2 + 62, 18, '#7CFC9A', 'center');
  } else if (S.mode === 'complete') {
    const done = Object.keys(S.doneMissions).length + 1;
    text('MISSION COMPLETE', VW / 2, VH / 2 - 34, 48, '#7CFC9A', 'center');
    text(S.completeInfo.name, VW / 2, VH / 2 + 12, 22, '#ffffff', 'center');
    text('+$' + S.completeInfo.pay, VW / 2, VH / 2 + 48, 26, '#ffd23f', 'center');
    text('Jobs done: ' + done + '/' + MISSIONS.length + '   ·   Score: ' + Math.floor(S.score + S.completeInfo.pay) + '   ·   Coins: ' + S.coinsGot + '/' + TOTAL_COINS, VW / 2, VH / 2 + 82, 15, '#cbd5e1', 'center', 'normal');
    text('Best score: ' + Math.max(S.bestScore, Math.floor(S.score + S.completeInfo.pay)) + (S.isNewBest ? '  ★ NEW RECORD' : ''), VW / 2, VH / 2 + 104, 14, '#7dd3fc', 'center', 'normal');
    if (!SHOTMODE) text('PRESS ENTER', VW / 2, VH / 2 + 132, 17, '#cbd5e1', 'center');
  }
}

// ---------- shot-mode scenes (deterministic; used for the renders) ----------
function setupShot() {
  if (SHOT === 'start') {
    S.mode = 'title';
    S.timeOfDay = 0.44;
    player.x = 330; player.y = CITY_H + 30; player.a = -0.4;
    for (let i = 0; i < 150; i++) step(STEP);           // ambient life behind the title
  } else if (SHOT === 'play') {
    S.mode = 'playing';
    S.timeOfDay = 0.71;                                  // golden hour for the action shot
    const car = newCar(VX[2], HY[2], 0, 'player');
    car.color = '#3f6fd8'; car.type = 'sedan'; car.v = 130;
    civCars.push(car);
    player.car = car; player.x = car.x; player.y = car.y;
    S.cash = 165; S.score = 210; S.coinsGot = 1;
    if (coins[0]) coins[0].taken = true;
    S.heat = 240; S.lastCrime = 0;                       // two stars
    cops.push({ x: VX[2] - 235, y: HY[2] - 16, a: 0, v: 205, hp: 100 });
    cops.push({ x: VX[2] - 330, y: HY[2] + 17, a: 0, v: 215, hp: 100 });
    S.mission = { def: MISSIONS[0], stage: 1, tLeft: 140 * 60, stole: false, hintShown: true };
    civCars = civCars.filter((c) => !(c.mode === 'traffic' && Math.abs(c.y - HY[2]) < 58 && c.x > VX[1] && c.x < VX[5]));
    keys.KeyW = true;                                    // scripted: foot down, straight east
    for (let i = 0; i < 120; i++) step(STEP);
    keys.KeyW = false;
  } else if (SHOT === 'end') {
    S.doneMissions = { cargo: true };
    S.cash = 320; S.score = 640; S.coinsGot = 3;
    S.timeOfDay = 0.78;                                  // dusk over the café
    S.completeInfo = { id: 'rush', name: 'Azul Coffee Rush', pay: 250 };
    player.x = CONTACTS.cafe.x + 30; player.y = CONTACTS.cafe.y + 10; player.a = -0.6;
    for (let i = 0; i < 90; i++) step(STEP);             // ambient life
    S.mode = 'complete';
  }
  render();
  window.__shotReady = true;
}

// ---------- boot ----------
buildWorld();
if (SHOTMODE) {
  setupShot();
} else {
  let last = performance.now(), acc = 0;
  const frame = (now) => {
    acc += Math.min(0.12, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
